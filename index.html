<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="description" content="Sätze, Wiederholungen und Gewichte für jedes Workout notieren.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Trainings-Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* =====================================================================
   DESIGN-SYSTEM · „Kreide & Gusseisen“
   Alle Werte als Tokens. Komponenten verwenden ausschließlich diese.
   ===================================================================== */
:root {
  /* Typografie */
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-12: 0.75rem;   /* Labels, Meta */
  --fs-14: 0.875rem;  /* Sekundärtext, Buttons */
  --fs-16: 1rem;      /* Fließtext */
  --fs-20: 1.25rem;   /* Karten-Titel, Kennzahlen */
  --fs-24: 1.5rem;
  --fs-32: 2rem;      /* Seitentitel */
  --fs-48: 3rem;
  --lh-tight: 1.1;
  --lh-snug: 1.25;
  --lh-body: 1.5;
  --tracking-tight: -0.025em;
  --tracking-snug: -0.01em;
  --tracking-caps: 0.06em;

  /* Abstände (4px-Raster) */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px; --s-5: 20px;
  --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px;

  /* Radien: außen 16 → innen 10 → klein 6 */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-full: 999px;

  /* Bewegung */
  --dur-fast: 150ms;
  --dur: 200ms;
  --dur-slow: 250ms;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* Layout */
  --content-w: 680px;
  --nav-w: 248px;
  --tap: 44px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --page-x: var(--s-4);
  --page-top: calc(var(--safe-t) + var(--s-6));

  /* ---------- Farben: Dunkel (Standard) ---------- */
  color-scheme: dark;
  --bg-app: #121110;
  --bg-surface: #1a1917;
  --bg-inset: #23211e;
  --bg-elevated: #1f1d1b;
  --bg-hover: rgba(255, 248, 240, 0.04);
  --bg-press: rgba(255, 248, 240, 0.07);
  --glass: rgba(18, 17, 16, 0.8);
  --backdrop: rgba(8, 7, 6, 0.55);

  --border-subtle: rgba(255, 244, 230, 0.07);
  --border: rgba(255, 244, 230, 0.11);
  --border-strong: rgba(255, 244, 230, 0.18);
  --border-top: rgba(255, 248, 240, 0.11);   /* feines Kanten-Highlight */
  --highlight: rgba(255, 250, 245, 0.16);

  --text-primary: #f3f0ea;
  --text-secondary: #aca69d;
  --text-tertiary: #918b81;

  --accent: #f0824c;
  --accent-hover: #f59362;
  --accent-press: #e2733e;
  --accent-ink: #1d0f07;
  --accent-soft: rgba(240, 130, 76, 0.11);

  --success: #86c49a;
  --success-soft: rgba(134, 196, 154, 0.14);
  --danger: #ee8295;
  --danger-soft: rgba(238, 130, 149, 0.13);

  --shadow-sm: 0 1px 2px rgba(8, 6, 4, 0.4);
  --shadow-md: 0 1px 2px rgba(8, 6, 4, 0.35), 0 8px 24px -8px rgba(8, 6, 4, 0.55);
  --shadow-lg: 0 2px 4px rgba(8, 6, 4, 0.35), 0 24px 56px -12px rgba(8, 6, 4, 0.65);
}

/* ---------- Farben: Hell ---------- */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg-app: #f6f5f2;
    --bg-surface: #fdfcfa;
    --bg-inset: #f0eee9;
    --bg-elevated: #fdfcfa;
    --bg-hover: rgba(48, 32, 16, 0.04);
    --bg-press: rgba(48, 32, 16, 0.07);
    --glass: rgba(246, 245, 242, 0.82);
    --backdrop: rgba(32, 26, 20, 0.28);
    --border-subtle: rgba(48, 32, 16, 0.08);
    --border: rgba(48, 32, 16, 0.12);
    --border-strong: rgba(48, 32, 16, 0.2);
    --border-top: rgba(48, 32, 16, 0.06);
    --highlight: rgba(255, 255, 255, 0.35);
    --text-primary: #1c1a17;
    --text-secondary: #5e5952;
    --text-tertiary: #6f6a63;
    --accent: #b8440f;
    --accent-hover: #a33b0b;
    --accent-press: #923409;
    --accent-ink: #fffaf6;
    --accent-soft: rgba(184, 68, 15, 0.09);
    --success: #2f7d4a;
    --success-soft: rgba(47, 125, 74, 0.1);
    --danger: #b23a56;
    --danger-soft: rgba(178, 58, 86, 0.1);
    --shadow-sm: 0 1px 2px rgba(60, 40, 20, 0.06);
    --shadow-md: 0 1px 2px rgba(60, 40, 20, 0.05), 0 8px 24px -8px rgba(60, 40, 20, 0.12);
    --shadow-lg: 0 2px 4px rgba(60, 40, 20, 0.05), 0 24px 56px -12px rgba(60, 40, 20, 0.22);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg-app: #f6f5f2;
  --bg-surface: #fdfcfa;
  --bg-inset: #f0eee9;
  --bg-elevated: #fdfcfa;
  --bg-hover: rgba(48, 32, 16, 0.04);
  --bg-press: rgba(48, 32, 16, 0.07);
  --glass: rgba(246, 245, 242, 0.82);
  --backdrop: rgba(32, 26, 20, 0.28);
  --border-subtle: rgba(48, 32, 16, 0.08);
  --border: rgba(48, 32, 16, 0.12);
  --border-strong: rgba(48, 32, 16, 0.2);
  --border-top: rgba(48, 32, 16, 0.06);
  --highlight: rgba(255, 255, 255, 0.35);
  --text-primary: #1c1a17;
  --text-secondary: #5e5952;
  --text-tertiary: #6f6a63;
  --accent: #b8440f;
  --accent-hover: #a33b0b;
  --accent-press: #923409;
  --accent-ink: #fffaf6;
  --accent-soft: rgba(184, 68, 15, 0.09);
  --success: #2f7d4a;
  --success-soft: rgba(47, 125, 74, 0.1);
  --danger: #b23a56;
  --danger-soft: rgba(178, 58, 86, 0.1);
  --shadow-sm: 0 1px 2px rgba(60, 40, 20, 0.06);
  --shadow-md: 0 1px 2px rgba(60, 40, 20, 0.05), 0 8px 24px -8px rgba(60, 40, 20, 0.12);
  --shadow-lg: 0 2px 4px rgba(60, 40, 20, 0.05), 0 24px 56px -12px rgba(60, 40, 20, 0.22);
}

@media (min-width: 640px) {
  :root { --page-x: var(--s-8); }
}
@media (min-width: 960px) {
  :root { --page-x: var(--s-10); --page-top: var(--s-12); }
}

/* =====================================================================
   BASIS
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg-app);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: var(--fs-16);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p { margin: 0; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
.ic { flex: none; display: block; }
.hidden { display: none !important; }
.tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }

/* =====================================================================
   LAYOUT
   ===================================================================== */
main { padding: var(--page-top) var(--page-x) calc(176px + var(--safe-b)); }
.view { max-width: var(--content-w); margin: 0 auto; }

.page-head { margin-bottom: var(--s-6); }
.eyebrow { font-size: var(--fs-14); color: var(--text-secondary); }
.page-title {
  margin-top: var(--s-1);
  font-size: var(--fs-32); line-height: var(--lh-tight);
  font-weight: 700; letter-spacing: var(--tracking-tight);
}
.section-label {
  margin: var(--s-8) 0 var(--s-3); padding: 0 var(--s-1);
  font-size: var(--fs-12); font-weight: 600; letter-spacing: var(--tracking-caps);
  text-transform: uppercase; color: var(--text-tertiary);
}
.section-label:first-child { margin-top: 0; }

/* =====================================================================
   BUTTONS
   ===================================================================== */
.btn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  height: var(--tap); padding: 0 var(--s-4);
  border-radius: var(--r-md);
  font-size: var(--fs-14); font-weight: 600; line-height: 1; white-space: nowrap;
  transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
  user-select: none;
}
.btn:active { transform: scale(0.98); }
.btn-lg { height: 48px; font-size: var(--fs-16); }
.btn-block { width: 100%; }
.btn-primary {
  background: var(--accent); color: var(--accent-ink);
  box-shadow: inset 0 1px 0 var(--highlight), var(--shadow-sm);
}
.btn-primary:active { background: var(--accent-press); }
.btn-secondary {
  background: var(--bg-surface); color: var(--text-primary);
  border: 1px solid var(--border); border-top-color: var(--border-top);
  box-shadow: var(--shadow-sm);
}
.btn-ghost { color: var(--text-secondary); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }
.btn.is-loading { color: transparent !important; pointer-events: none; }
.btn.is-loading::after {
  content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--text-secondary); border-right-color: transparent;
  animation: spin 700ms linear infinite;
}
.btn-icon {
  display: inline-grid; place-items: center; flex: none;
  width: var(--tap); height: var(--tap); border-radius: var(--r-md);
  color: var(--text-secondary);
  transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast);
}
.btn-icon:active { transform: scale(0.94); background: var(--bg-press); }
.btn-icon:disabled { opacity: 0.3; pointer-events: none; }
.btn-icon.is-framed { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-top-color: var(--border-top); }

@media (hover: hover) {
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary:hover { background: var(--bg-inset); }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }
  .btn-icon:hover { background: var(--bg-hover); color: var(--text-primary); }
  .btn-danger:hover { background: var(--danger-soft); filter: brightness(1.1); }
}

/* =====================================================================
   FORMULARE
   ===================================================================== */
.label { display: block; margin-bottom: var(--s-2); font-size: var(--fs-14); font-weight: 500; color: var(--text-secondary); }
.input {
  width: 100%; height: 48px; padding: 0 var(--s-4);
  background: var(--bg-inset); color: var(--text-primary);
  border: 1px solid var(--border-subtle); border-radius: var(--r-md);
  font-size: var(--fs-16);
}
.input::placeholder { color: var(--text-tertiary); }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input[aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.field-error {
  display: flex; align-items: center; gap: var(--s-2);
  margin-bottom: var(--s-2); font-size: var(--fs-14); color: var(--danger);
}
@media (hover: hover) { .input:hover:not(:focus) { border-color: var(--border); } }

/* Datum: eigenes Aussehen, natives Feld liegt unsichtbar darüber */
.date-field, .date-chip { position: relative; display: flex; align-items: center; cursor: pointer; }
.date-field input, .date-chip input {
  position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0;
  opacity: 0; border: 0; -webkit-appearance: none; appearance: none; font-size: 16px; cursor: pointer;
}
.date-field {
  justify-content: space-between; gap: var(--s-3); height: 48px; padding: 0 var(--s-4);
  background: var(--bg-inset); border: 1px solid var(--border-subtle); border-radius: var(--r-md);
}
.date-field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.date-field-value { display: flex; align-items: center; gap: var(--s-2); font-weight: 500; }
.date-field-value .ic { color: var(--text-secondary); }
.date-chip {
  display: inline-flex; gap: var(--s-2); height: 32px; padding: 0 var(--s-3);
  border-radius: var(--r-full); background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  font-size: var(--fs-14); font-weight: 500; color: var(--text-secondary);
}
.date-chip::before { content: ""; position: absolute; inset: -6px; } /* 44px Touch-Ziel */
.date-chip:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Segmented Control */
.seg { display: flex; gap: var(--s-1); padding: var(--s-1); background: var(--bg-inset); border-radius: var(--r-md); }
.seg button {
  flex: 1; height: 36px; padding: 0 var(--s-3); border-radius: var(--r-sm);
  font-size: var(--fs-14); font-weight: 500; color: var(--text-secondary); white-space: nowrap;
}
.seg button[aria-pressed="true"] {
  background: var(--bg-surface); color: var(--text-primary);
  box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--border-subtle);
}
@media (hover: hover) { .seg button:hover:not([aria-pressed="true"]) { color: var(--text-primary); } }

/* Schalter */
.switch {
  position: relative; flex: none; width: 44px; height: 28px; border-radius: var(--r-full);
  background: var(--bg-inset); box-shadow: inset 0 0 0 1px var(--border);
}
.switch::after {
  content: ""; position: absolute; left: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--text-tertiary); box-shadow: var(--shadow-sm);
  transition: transform var(--dur) var(--ease-out);
}
.switch[aria-checked="true"] { background: var(--accent); box-shadow: none; }
.switch[aria-checked="true"]::after { transform: translateX(16px); background: var(--accent-ink); }

/* =====================================================================
   KARTEN & LISTEN
   ===================================================================== */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle); border-top-color: var(--border-top);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}
.card-pad { padding: var(--s-4); }
.card-link {
  display: block; width: 100%; text-align: left;
  transition: transform var(--dur) var(--ease-out);
}
.card-link:active { transform: scale(0.99); }
@media (hover: hover) { .card-link:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); } }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); }
.card-title { font-size: var(--fs-14); font-weight: 600; }
.card-meta { font-size: var(--fs-12); color: var(--text-tertiary); font-weight: 500; }

.list { overflow: hidden; }
.row {
  display: flex; align-items: center; gap: var(--s-3);
  width: 100%; min-height: 64px; padding: var(--s-3) var(--s-4); text-align: left;
}
.row + .row { border-top: 1px solid var(--border-subtle); }
button.row:active { background: var(--bg-press); }
button.row:focus-visible { outline-offset: -2px; border-radius: 0; }
@media (hover: hover) { button.row:hover { background: var(--bg-hover); } }
.row-main { flex: 1; min-width: 0; }
.row-title { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { display: block; font-size: var(--fs-14); color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-chev { color: var(--text-tertiary); }
.row-date { flex: none; width: 40px; text-align: center; }
.row-date-wd { display: block; font-size: var(--fs-12); font-weight: 500; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; }
.row-date-d { display: block; font-size: var(--fs-20); font-weight: 600; line-height: var(--lh-tight); font-variant-numeric: tabular-nums; }
.row-num { flex: none; text-align: right; }
.row-num-v { display: block; font-weight: 600; font-variant-numeric: tabular-nums; }
.row-num-l { display: block; font-size: var(--fs-12); color: var(--text-tertiary); }

.list-inset { background: var(--bg-inset); border-radius: var(--r-md); overflow: hidden; }
.list-inset .row { min-height: 56px; }

/* Kennzahlen */
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.metric { min-width: 0; }
.metric + .metric { padding-left: var(--s-4); border-left: 1px solid var(--border-subtle); }
.metric-label { display: block; font-size: var(--fs-12); font-weight: 500; color: var(--text-tertiary); }
.metric-value {
  display: block; margin-top: var(--s-1);
  font-size: var(--fs-20); font-weight: 600; letter-spacing: var(--tracking-snug);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.delta {
  display: inline-flex; align-items: center; gap: var(--s-1); margin-top: var(--s-1);
  font-size: var(--fs-12); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.delta-up { color: var(--success); }
.delta-down { color: var(--danger); }
.delta-eq { color: var(--text-tertiary); }

/* Wochenleiste */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--s-1); }
.day { display: flex; flex-direction: column; align-items: center; gap: var(--s-2); }
.day-label { font-size: var(--fs-12); font-weight: 500; color: var(--text-tertiary); }
.day-num {
  width: 36px; height: 36px; border-radius: var(--r-full); display: grid; place-items: center;
  font-size: var(--fs-14); font-weight: 600; font-variant-numeric: tabular-nums;
  background: var(--bg-inset); color: var(--text-tertiary);
}
.day.is-today .day-num { box-shadow: inset 0 0 0 2px var(--accent); color: var(--text-primary); }
.day.is-trained .day-num { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.day.is-missed .day-num { background: var(--danger-soft); color: var(--danger); }
.week-legend { display: flex; gap: var(--s-4); margin-top: var(--s-3); font-size: var(--fs-12); color: var(--text-tertiary); }
.week-legend span { display: inline-flex; align-items: center; gap: var(--s-1); }
.week-legend i { width: 8px; height: 8px; border-radius: 50%; display: block; }

/* Leerer Zustand */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--s-12) var(--s-6); }
.empty-icon {
  width: 48px; height: 48px; display: grid; place-items: center; margin-bottom: var(--s-4);
  border-radius: var(--r-md); background: var(--bg-surface); border: 1px solid var(--border-subtle);
  color: var(--text-secondary); box-shadow: var(--shadow-sm);
}
.empty h3 { font-size: var(--fs-16); font-weight: 600; }
.empty p { margin-top: var(--s-1); max-width: 34ch; font-size: var(--fs-14); color: var(--text-secondary); }
.empty .btn { margin-top: var(--s-5); }

/* =====================================================================
   WORKOUT
   ===================================================================== */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-2);
  margin: calc(var(--page-top) * -1) calc(var(--page-x) * -1) 0;
  padding: calc(var(--safe-t) + var(--s-2)) calc(var(--page-x) - var(--s-2)) var(--s-2);
  background: var(--glass);
  -webkit-backdrop-filter: saturate(1.4) blur(16px); backdrop-filter: saturate(1.4) blur(16px);
  border-bottom: 1px solid transparent;
}
.topbar.is-scrolled { border-bottom-color: var(--border-subtle); }
.topbar-title {
  min-width: 0; font-size: var(--fs-16); font-weight: 600;
  opacity: 0; transform: translateY(4px);
  transition: opacity var(--dur) var(--ease-out), transform var(--dur) var(--ease-out);
}
.topbar.is-scrolled .topbar-title { opacity: 1; transform: none; }

.w-title {
  display: block; width: 100%; margin-top: var(--s-4); padding: 0;
  background: none; border: 0; border-radius: 0;
  font-size: var(--fs-32); font-weight: 700; letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
}
.w-title::placeholder { color: var(--text-tertiary); }

  trash: '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  repeat: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  'arrow-up': '<path d="M12 19V5M5 12l7-7 7 7"/>',
  'arrow-down': '<path d="M12 5v14M19 12l-7 7-7-7"/>',
  minus: '<path d="M5 12h14"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/>',
  up: '<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',

};
const ic = (n, s = 20) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[n]}</svg>`;
document.querySelectorAll('[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic, +el.dataset.size || 20); });

/* =====================================================================
   Daten
   ===================================================================== */
const KEY = 'trainings-tracker-v1';
let data = load();
const state = { view: 'home', tab: 'home', workoutId: null, justDone: null };
let saveWarned = false;

function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch {}
  if (!d || !Array.isArray(d.workouts)) d = { workouts: [] };
  d.settings = Object.assign({ rest: 90, autoRest: true, theme: 'system' }, d.settings);
  return d;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); }
  catch {
    if (!saveWarned) {
      saveWarned = true;
      toast('Speichern hat nicht geklappt. Exportiere in den Einstellungen ein Backup, damit nichts verloren geht.', { type: 'error' });
    }
  }
}

/* =====================================================================
   Helfer
   ===================================================================== */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const iso = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
const today = () => iso(new Date());
const toDate = s => new Date(s + 'T00:00');
const addDays = (s, n) => { const d = toDate(s); d.setDate(d.getDate() + n); return iso(d); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const num = v => (+v || 0).toLocaleString('de-DE', { maximumFractionDigits: 2 });
const dfmt = (s, o) => toDate(s).toLocaleDateString('de-DE', o);
const wd2 = s => dfmt(s, { weekday: 'short' }).replace('.', '').slice(0, 2);
const byDateDesc = (a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0);
const sorted = () => [...data.workouts].sort(byDateDesc);
const current = () => data.workouts.find(w => w.id === state.workoutId);
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

const setCount = w => w.exercises.reduce((n, e) => n + e.sets.length, 0);
const doneCount = w => w.exercises.reduce((n, e) => n + e.sets.filter(s => s.done).length, 0);
const repCount = sets => sets.reduce((n, s) => n + (+s.reps || 0), 0);
const volume = w => w.exercises.reduce((n, e) => n + e.sets.reduce((m, s) => m + (+s.reps || 0) * (+s.weight || 0), 0), 0);
const fmtVol = v => v >= 1000 ? (v / 1000).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' t' : Math.round(v) + ' kg';
const fmtSet = s => s.weight ? `${num(s.weight)} kg × ${+s.reps || 0}` : `${+s.reps || 0} Wdh.`;
const fmtSetShort = s => (+s.reps || 0) + (s.weight ? ` × ${num(s.weight)}` : ' Wdh.');

function mondayOf(d) { const m = new Date(d); m.setHours(0, 0, 0, 0); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; }
const mondayIso = s => iso(mondayOf(toDate(s)));
function isoWeek(s) {
  const d = toDate(s), t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
}
function weekRange(mon) {
  const end = addDays(mon, 6), a = toDate(mon), b = toDate(end);
  return a.getMonth() === b.getMonth()
    ? `${a.getDate()}.–${dfmt(end, { day: 'numeric', month: 'short' })}`
    : `${dfmt(mon, { day: 'numeric', month: 'short' })} – ${dfmt(end, { day: 'numeric', month: 'short' })}`;
}
/** „Heute, Mo., 16. Nov.“ / „Gestern, …“ / „Mi., 4. Nov.“ */
function fmtPick(s) {
  const long = dfmt(s, { weekday: 'short', day: 'numeric', month: 'short' });
  if (s === today()) return 'Heute, ' + long;
  if (s === addDays(today(), -1)) return 'Gestern, ' + long;
  return long + (s.slice(0, 4) !== today().slice(0, 4) ? ' ' + s.slice(0, 4) : '');
}

/** Letzte Ausführung einer Übung vor dem gegebenen Workout */
function previousExercise(name, w) {
  const key = name.trim().toLowerCase();
  for (const x of sorted()) {
    if (x.id === w.id || x.date > w.date) continue;
    const ex = x.exercises.find(e => e.name.trim().toLowerCase() === key);
    if (ex && ex.sets.length) return ex;
  }
  return null;
}

/* Wochenleiste: Akzent = trainiert, Rot = vergangen ohne Training, Ring = heute */
function dayCell(s, trained) {
  const missed = !trained && s < today();
  const cls = ['day', trained ? 'is-trained' : missed ? 'is-missed' : '', s === today() ? 'is-today' : ''].join(' ');
  const status = trained ? 'trainiert' : missed ? 'kein Training' : s === today() ? 'heute' : 'kommt noch';
  return `<div class="${cls}" role="listitem" aria-label="${dfmt(s, { weekday: 'long', day: 'numeric', month: 'long' })}: ${status}">
    <span class="day-label" aria-hidden="true">${wd2(s)}</span><span class="day-num" aria-hidden="true">${toDate(s).getDate()}</span></div>`;
}
const weekLegend = () => `<div class="week-legend" aria-hidden="true">
  <span><i style="background:var(--accent)"></i>Trainiert</span>
  <span><i style="background:var(--danger)"></i>Ausgelassen</span></div>`;

function delta(cur, prev, { unit = '', pct = false } = {}) {
  if (!cur && !prev) return '<span class="delta delta-eq">–</span>';
  const d = cur - prev;
  if (!d) return `<span class="delta delta-eq">${ic('equal', 14)}gleich</span>`;
  const amount = pct && prev ? Math.round(Math.abs(d) / prev * 100) + ' %'
    : unit === 'kg' && Math.abs(d) >= 1000 ? fmtVol(Math.abs(d)) : num(Math.abs(d)) + (unit ? ' ' + unit : '');
  return `<span class="delta ${d > 0 ? 'delta-up' : 'delta-down'}">${ic(d > 0 ? 'up' : 'down', 14)}${d > 0 ? '+' : '−'}${amount}</span>`;
}

/* =====================================================================
   Theme
   ===================================================================== */
function applyTheme() {
  const t = data.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  requestAnimationFrame(() => {
    document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue('--bg-app').trim();
  });
}
matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTheme);

/* =====================================================================
   Navigation
   ===================================================================== */
function show(view) {
  state.view = view;
  if (view !== 'workout') state.tab = view;
  for (const v of ['home', 'progress', 'more', 'workout']) $('v-' + v).classList.toggle('hidden', v !== view);
  document.body.classList.toggle('in-workout', view === 'workout');
  $('dock').classList.toggle('hidden', view !== 'workout');
  document.querySelectorAll('.nav-item').forEach(t => {
    if (t.dataset.tab === state.tab) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
  render();
  window.scrollTo(0, 0);
}
function render() {
  ({ home: renderHome, progress: renderProgress, more: renderMore, workout: renderWorkout })[state.view]();
}
function openWorkout(id) {
  state.workoutId = id;
  history.pushState({ workout: id }, '');
  show('workout');
}
function closeWorkout() {
  if (history.state && history.state.workout) history.back();
  else show(state.tab);
}
window.addEventListener('popstate', () => { if (state.view === 'workout') show(state.tab); });
$('nav').addEventListener('click', e => {
  const t = e.target.closest('.nav-item');
  if (!t) return;
  if (state.view === 'workout' && history.state && history.state.workout) history.replaceState(null, '');
  show(t.dataset.tab);
});

/* =====================================================================
   Training (Startseite)
   ===================================================================== */
function renderHome() {
  const t = today(), mon = mondayIso(t);
  const trained = new Set(data.workouts.map(w => w.date));
  const days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
  const week = data.workouts.filter(w => w.date >= mon && w.date <= addDays(mon, 6));
  const list = sorted();

  const groups = [];
  for (const w of list) {
    const label = dfmt(w.date, { month: 'long', year: 'numeric' });
    if (!groups.length || groups.at(-1).label !== label) groups.push({ label, items: [] });
    groups.at(-1).items.push(w);
  }

  $('v-home').innerHTML = `
    <header class="page-head">
      <p class="eyebrow">${dfmt(t, { weekday: 'long', day: 'numeric', month: 'long' })}</p>
      <h1 class="page-title" id="t-home">Training</h1>
    </header>

    <section class="card card-pad" aria-labelledby="t-week">
      <div class="card-head" style="margin-bottom:var(--s-4)">
        <h2 class="card-title" id="t-week">Diese Woche</h2>
        <span class="card-meta">KW ${isoWeek(t)}</span>
      </div>
      <div class="week" role="list">${days.map(d => dayCell(d, trained.has(d))).join('')}</div>
      <div class="metrics" style="margin-top:var(--s-4);padding-top:var(--s-4);border-top:1px solid var(--border-subtle)">
        <div class="metric"><span class="metric-label">Workouts</span><span class="metric-value">${week.length}</span></div>
        <div class="metric"><span class="metric-label">Sätze</span><span class="metric-value">${week.reduce((n, w) => n + setCount(w), 0)}</span></div>
        <div class="metric"><span class="metric-label">Volumen</span><span class="metric-value">${fmtVol(week.reduce((n, w) => n + volume(w), 0))}</span></div>
      </div>
    </section>

    <button class="btn btn-primary btn-lg btn-block" data-act="new" style="margin-top:var(--s-4)">${ic('plus')}Workout starten</button>

    ${list.length ? groups.map(g => `
      <h2 class="section-label">${g.label}</h2>
      <div class="card list">
        ${g.items.map(w => `
          <button class="row" data-open="${w.id}">
            <span class="row-date"><span class="row-date-wd">${wd2(w.date)}</span><span class="row-date-d">${toDate(w.date).getDate()}</span></span>
            <span class="row-main">
              <span class="row-title">${esc(w.name || 'Workout')}</span>
              <span class="row-sub">${esc(w.exercises.map(e => e.name).join(', ') || 'Noch keine Übungen')}</span>
            </span>
            <span class="row-num"><span class="row-num-v">${setCount(w)}</span><span class="row-num-l">Sätze</span></span>
            <span class="row-chev">${ic('chevron-right', 16)}</span>
          </button>`).join('')}
      </div>`).join('') : `
      <div class="empty">
        <div class="empty-icon">${ic('dumbbell', 24)}</div>
        <h3>Noch keine Workouts</h3>
        <p>Starte dein erstes Training. Übungen, Sätze und Gewichte trägst du danach direkt ein.</p>
      </div>`}
  `;
}
$('v-home').addEventListener('click', e => {
  const open = e.target.closest('[data-open]');
  if (open) return openWorkout(open.dataset.open);
  if (e.target.closest('[data-act="new"]')) newWorkoutSheet();
});

const copyExercises = w => w.exercises.map(e => ({ name: e.name, sets: e.sets.map(s => ({ reps: s.reps, weight: s.weight, done: false })) }));

function newWorkoutSheet() {
  const seen = new Set(), templates = [];
  for (const w of sorted()) {
    const k = (w.name || '').trim().toLowerCase();
    if (!k || seen.has(k) || !w.exercises.length) continue;
    seen.add(k); templates.push(w);
    if (templates.length >= 6) break;
  }
  const sheet = openSheet('Neues Workout', `
    <div>
      <label class="label" for="nw-name">Name</label>
      <input class="input" id="nw-name" placeholder="z. B. Push, Pull oder Beine" autocomplete="off" enterkeyhint="go">
    </div>
    <div>
      <span class="label" id="nw-date-l">Datum</span>
      <label class="date-field">
        <span class="date-field-value">${ic('calendar', 18)}<span id="nw-date-label">${fmtPick(today())}</span></span>
        <span class="row-chev">${ic('chevron-right', 16)}</span>
        <input id="nw-date" type="date" value="${today()}" aria-labelledby="nw-date-l">
      </label>
    </div>
    <button class="btn btn-primary btn-lg btn-block" data-act="start">Workout starten</button>
    ${templates.length ? `
      <h3 class="section-label">Früheres Workout wiederholen</h3>
      <div class="list-inset">
        ${templates.map(w => `<button class="row" data-tpl="${w.id}">
          <span class="row-main"><span class="row-title">${esc(w.name)}</span><span class="row-sub">${esc(w.exercises.map(e => e.name).join(', '))}</span></span>
          <span class="row-chev">${ic('chevron-right', 16)}</span>
        </button>`).join('')}
      </div>` : ''}
  `);
  const nameEl = sheet.querySelector('#nw-name'), dateEl = sheet.querySelector('#nw-date');
  const start = (name, exercises = []) => {
    const w = { id: uid(), created: Date.now(), name: name || 'Workout', date: dateEl.value || today(), exercises };
    data.workouts.push(w); save(); closeSheet(); openWorkout(w.id);
  };
  nameEl.addEventListener('keydown', e => { if (e.key === 'Enter') start(nameEl.value.trim()); });
  dateEl.addEventListener('change', () => { sheet.querySelector('#nw-date-label').textContent = fmtPick(dateEl.value || today()); });
  sheet.addEventListener('click', e => {
    if (e.target.closest('[data-act="start"]')) return start(nameEl.value.trim());
    const t = e.target.closest('[data-tpl]');
    if (t) { const src = data.workouts.find(w => w.id === t.dataset.tpl); start(src.name, copyExercises(src)); }
  });
}

/* =====================================================================
   Workout
   ===================================================================== */
function renderWorkout() {
  const w = current();
  if (!w) return show(state.tab);
  $('w-name').value = w.name;
  $('w-date').value = w.date;
  $('w-date-label').textContent = fmtPick(w.date);
  $('tb-title').textContent = w.name;
  const names = [...new Set(data.workouts.flatMap(x => x.exercises.map(e => e.name)))].sort((a, b) => a.localeCompare(b, 'de'));
  $('ex-suggestions').innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');
  clearExError();
  renderExercises();
}

function renderProgressBlock() {
  const w = current(), total = setCount(w), done = doneCount(w);
  const box = $('w-progress');
  if (!box.firstElementChild) {
    box.innerHTML = `<div class="w-progress-meta"><span id="wp-sets"></span><span id="wp-side"></span></div>
      <div class="bar" role="progressbar" aria-label="Erledigte Sätze" aria-valuemin="0" id="wp-bar"><i></i></div>`;
  }
  $('wp-sets').innerHTML = total ? `<b>${done}</b> von ${plural(total, 'Satz', 'Sätzen')} erledigt` : 'Noch keine Sätze';
  $('wp-side').textContent = `${plural(w.exercises.length, 'Übung', 'Übungen')} · ${fmtVol(volume(w))}`;
  const bar = $('wp-bar');
  bar.setAttribute('aria-valuemax', total); bar.setAttribute('aria-valuenow', done);
  bar.firstElementChild.style.transform = `scaleX(${total ? done / total : 0})`;
  document.querySelectorAll('[data-count]').forEach(el => {
    const ex = w.exercises[+el.dataset.count];
    el.textContent = `${plural(ex.sets.length, 'Satz', 'Sätze')} · ${repCount(ex.sets)} Wdh.`;
  });
}

function renderExercises() {
  const w = current();
  $('ex-list').innerHTML = w.exercises.length ? w.exercises.map((ex, ei) => {
    const prev = previousExercise(ex.name, w);
    return `<article class="card ex" aria-labelledby="ex-${ei}">
      <div class="ex-head">
        <div><h3 class="ex-name" id="ex-${ei}">${esc(ex.name)}</h3><span class="ex-meta" data-count="${ei}"></span></div>
        <button class="btn-icon" data-act="ex-menu" data-ei="${ei}" aria-label="Optionen für ${esc(ex.name)}">${ic('more')}</button>
      </div>
      <div class="sets">
        ${ex.sets.length ? `<div class="sets-grid sets-head" aria-hidden="true"><span></span><span>Vorher</span><span>Wdh.</span><span>kg</span><span></span></div>` : ''}
        ${ex.sets.map((s, si) => {
          const p = prev && prev.sets[si];
          const jd = state.justDone && state.justDone[0] === ei && state.justDone[1] === si;
          return `<div class="sets-grid set ${s.done ? 'is-done' : ''} ${jd ? 'just-done' : ''}">
            <span class="set-idx">${si + 1}</span>
            ${p ? `<button class="set-prev" data-act="prev" data-ei="${ei}" data-si="${si}" aria-label="Werte vom letzten Mal übernehmen: ${esc(fmtSet(p))}">${esc(fmtSetShort(p))}</button>` : '<span class="set-prev" aria-hidden="true">–</span>'}
            <input class="num-input" type="number" min="0" inputmode="numeric" value="${esc(s.reps)}" placeholder="0" data-f="reps" data-ei="${ei}" data-si="${si}" aria-label="Satz ${si + 1}: Wiederholungen">
            <input class="num-input" type="number" min="0" step="0.25" inputmode="decimal" value="${esc(s.weight)}" placeholder="–" data-f="weight" data-ei="${ei}" data-si="${si}" aria-label="Satz ${si + 1}: Gewicht in kg">
            <button class="check-btn" data-act="done" data-ei="${ei}" data-si="${si}" aria-pressed="${!!s.done}" aria-label="Satz ${si + 1} erledigt">${ic('check', 18)}</button>
          </div>`;
        }).join('')}
      </div>
      <button class="btn btn-ghost btn-block add-set" data-act="add-set" data-ei="${ei}">${ic('plus', 18)}Satz hinzufügen</button>
    </article>`;
  }).join('') : `
    <div class="empty">
      <div class="empty-icon">${ic('dumbbell', 24)}</div>
      <h3>Noch keine Übungen</h3>
      <p>Füge deine erste Übung hinzu. Hast du sie schon einmal gemacht, übernehmen wir die Sätze vom letzten Mal.</p>
      <button class="btn btn-secondary" data-act="focus-add">${ic('plus', 18)}Übung hinzufügen</button>
    </div>`;
  state.justDone = null;
  renderProgressBlock();
}

function setExError(msg) {
  $('ex-error').innerHTML = `${ic('alert', 16)}<span>${esc(msg)}</span>`;
  $('ex-error').classList.remove('hidden');
  $('new-ex').setAttribute('aria-invalid', 'true');
}
function clearExError() {
  $('ex-error').classList.add('hidden');
  $('new-ex').removeAttribute('aria-invalid');
}
function addExercise() {
  const name = $('new-ex').value.trim();
  if (!name) { setExError('Gib zuerst einen Namen für die Übung ein.'); $('new-ex').focus(); return; }
  const w = current();
  if (w.exercises.some(e => e.name.trim().toLowerCase() === name.toLowerCase())) {
    setExError(`„${name}“ ist schon in diesem Workout. Füge dort einfach weitere Sätze hinzu.`); return;
  }
  clearExError();
  const prev = previousExercise(name, w);
  const sets = prev ? prev.sets.map(s => ({ reps: s.reps, weight: s.weight, done: false })) : [{ reps: '', weight: '', done: false }];
  w.exercises.push({ name, sets });
  $('new-ex').value = '';
  save(); renderExercises();
  requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: reduced() ? 'auto' : 'smooth' }));
}
$('add-ex').addEventListener('click', addExercise);
$('new-ex').addEventListener('keydown', e => { if (e.key === 'Enter') addExercise(); });
$('new-ex').addEventListener('input', clearExError);

$('v-workout').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const w = current(), act = b.dataset.act, ei = +b.dataset.ei, si = +b.dataset.si;
  if (act === 'back') return closeWorkout();
  if (act === 'w-menu') return workoutMenu();
  if (act === 'ex-menu') return exerciseMenu(ei);
  if (act === 'focus-add') return $('new-ex').focus();
  if (act === 'add-set') {
    const sets = w.exercises[ei].sets, last = sets.at(-1);
    sets.push(last ? { reps: last.reps, weight: last.weight, done: false } : { reps: '', weight: '', done: false });
  } else if (act === 'prev') {
    const p = previousExercise(w.exercises[ei].name, w).sets[si];
    Object.assign(w.exercises[ei].sets[si], { reps: p.reps, weight: p.weight });
  } else if (act === 'done') {
    const s = w.exercises[ei].sets[si];
    const wasComplete = setCount(w) > 0 && doneCount(w) === setCount(w);
    s.done = !s.done;
    if (s.done) {
      state.justDone = [ei, si];
      if (navigator.vibrate) navigator.vibrate(12);
      const nowComplete = doneCount(w) === setCount(w);
      if (nowComplete && !wasComplete) { stopTimer(); toast('Workout abgeschlossen. Starke Leistung!', { type: 'success' }); }
      else if (data.settings.autoRest) startTimer(data.settings.rest);

/* =====================================================================

function exerciseHistory() {
  const map = new Map();
  for (const w of [...data.workouts].sort((a, b) => a.date.localeCompare(b.date))) {
    for (const ex of w.exercises) {
      if (!ex.sets.length) continue;
      const key = ex.name.trim().toLowerCase();
      if (!map.has(key)) map.set(key, { name: ex.name.trim(), sessions: [] });
      map.get(key).sessions.push({ date: w.date, sets: ex.sets });
    }
  }
  return [...map.values()].sort((a, b) => b.sessions.at(-1).date.localeCompare(a.sessions.at(-1).date));
}
const usesWeight = h => h.sessions.some(s => s.sets.some(x => +x.weight > 0));
function bestSet(h) {
  const w8 = usesWeight(h);
  let best = null;
  for (const s of h.sessions) for (const x of s.sets) {
    const sc = w8 ? [+x.weight || 0, +x.reps || 0] : [+x.reps || 0, 0];
    if (!best || sc[0] > best.sc[0] || (sc[0] === best.sc[0] && sc[1] > best.sc[1])) best = { x, sc };
  }
  return best.x;
}
function sparkline(h) {
  const w8 = usesWeight(h);
  const vals = h.sessions.slice(-12).map(s => Math.max(...s.sets.map(x => w8 ? +x.weight || 0 : +x.reps || 0)));
  if (vals.length < 2) return '';
  const W = 72, H = 28, min = Math.min(...vals), max = Math.max(...vals), r = max - min || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * (W - 8) + 4, H - 4 - (v - min) / r * (H - 8)]);
  const [lx, ly] = pts.at(-1);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" style="flex:none"><polyline fill="none" stroke="var(--accent)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" points="${pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}"/><circle cx="${lx}" cy="${ly}" r="3" fill="var(--accent)" stroke="var(--bg-surface)" stroke-width="2"/></svg>`;
}

/* ---------- Diagramm ---------- */
function metricsFor(h) {
  const max = (sets, f) => Math.max(...sets.map(f));
  const sum = (sets, f) => sets.reduce((n, x) => n + f(x), 0);
  const reps = x => +x.reps || 0, kg = x => +x.weight || 0;
  return usesWeight(h) ? [
    { label: 'Gewicht', unit: 'kg', desc: 'Schwerster Satz', f: s => max(s, kg) },
    { label: 'Volumen', unit: 'kg', desc: 'Wdh. × Gewicht', f: s => sum(s, x => reps(x) * kg(x)) },
    { label: 'Wdh.', unit: 'Wdh.', desc: 'Wiederholungen gesamt', f: s => sum(s, reps) }
  ] : [
    { label: 'Max. Wdh.', unit: 'Wdh.', desc: 'Bester Satz', f: s => max(s, reps) },
    { label: 'Wdh. gesamt', unit: 'Wdh.', desc: 'Wiederholungen gesamt', f: s => sum(s, reps) }
  ];
}
const fmtVal = (v, unit) => unit === 'kg' && v >= 10000 ? (v / 1000).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' t' : num(v) + ' ' + unit;
const fmtTick = v => v >= 10000 ? (v / 1000).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + 'k' : num(v);
function niceTicks(min, max) {
  if (min === max) { const pad = Math.max(1, Math.abs(min) * 0.1); min -= pad; max += pad; }
  const raw = (max - min) / 3, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
  return ticks;
}
function drawChart(sheet, h, m) {
  const box = sheet.querySelector('#chart');
  const pts = h.sessions.map(s => ({ date: s.date, v: m.f(s.sets), sets: s.sets }));
  const first = pts[0], last = pts.at(-1);
  sheet.querySelector('#ch-val').textContent = fmtVal(last.v, m.unit);
  sheet.querySelector('#ch-delta').innerHTML = pts.length < 2
    ? `<span class="delta delta-eq">${esc(m.desc)}</span>`
    : delta(last.v, first.v, { unit: m.unit === 'kg' ? 'kg' : m.unit }).replace('</span>', ` <span style="color:var(--text-tertiary);font-weight:500">seit ${dfmt(first.date, { day: 'numeric', month: 'short' })}</span></span>`);

  if (pts.length < 2) { box.innerHTML = `<div class="chart-empty">Ab zwei Einheiten siehst du hier deine Entwicklung.</div>`; return; }

  const W = box.clientWidth || 320, H = 192, L = 40, R = 12, T = 16, B = 28;
  const ticks = niceTicks(Math.min(...pts.map(p => p.v)), Math.max(...pts.map(p => p.v)));
  const y0 = ticks[0], y1 = ticks.at(-1);
  const x = i => L + i / (pts.length - 1) * (W - L - R);
  const y = v => T + (1 - (v - y0) / (y1 - y0 || 1)) * (H - T - B);
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area = `${x(0).toFixed(1)},${H - B} ${line} ${x(pts.length - 1).toFixed(1)},${H - B}`;
  const showDots = pts.length <= 24;
  const xl = pts.length > 2 ? [0, Math.floor((pts.length - 1) / 2), pts.length - 1] : [0, 1];
  const dShort = d => dfmt(d, { day: '2-digit', month: '2-digit' });

  box.innerHTML = `
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(h.name)}: ${esc(m.desc)} von ${fmtVal(first.v, m.unit)} auf ${fmtVal(last.v, m.unit)}">
      <defs><linearGradient id="ch-fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--accent)" stop-opacity=".18"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
      </linearGradient></defs>
      ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--border-subtle)"/>
        <text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" class="ch-axis">${fmtTick(t)}</text>`).join('')}
      ${xl.map((i, k) => `<text x="${x(i)}" y="${H - 8}" text-anchor="${k === 0 ? 'start' : k === xl.length - 1 ? 'end' : 'middle'}" class="ch-axis">${dShort(pts[i].date)}</text>`).join('')}
      <polygon points="${area}" fill="url(#ch-fill)"/>
      <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p, i) => (showDots || i === pts.length - 1) ? `<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="var(--accent)" stroke="var(--bg-elevated)" stroke-width="2"/>` : '').join('')}
      <line id="ch-cross" y1="${T}" y2="${H - B}" stroke="var(--border-strong)" stroke-dasharray="3 3" visibility="hidden"/>
      <circle id="ch-hot" r="6" fill="var(--accent)" stroke="var(--bg-elevated)" stroke-width="2" visibility="hidden"/>
      <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/>
    </svg>
    <div class="ch-tip hidden" id="ch-tip"></div>`;

  const svg = box.querySelector('svg'), tip = box.querySelector('#ch-tip');
  const cross = box.querySelector('#ch-cross'), hot = box.querySelector('#ch-hot');
  const showAt = clientX => {
    const rx = clientX - svg.getBoundingClientRect().left;
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((rx - L) / (W - L - R) * (pts.length - 1))));
    const p = pts[i], px = x(i), py = y(p.v);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    hot.setAttribute('cx', px); hot.setAttribute('cy', py); hot.setAttribute('visibility', 'visible');
    tip.innerHTML = `<span>${dfmt(p.date, { weekday: 'short', day: 'numeric', month: 'short' })}</span><b>${fmtVal(p.v, m.unit)}</b><span>${p.sets.map(s => esc(fmtSetShort(s))).join(' · ')}</span>`;
    tip.classList.remove('hidden');
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(W - tw, px - tw / 2)) + 'px';
    tip.style.top = Math.max(0, py - tip.offsetHeight - 16) + 'px';
  };
  const hide = () => { tip.classList.add('hidden'); cross.setAttribute('visibility', 'hidden'); hot.setAttribute('visibility', 'hidden'); };
  svg.addEventListener('pointermove', e => showAt(e.clientX));
  svg.addEventListener('pointerdown', e => showAt(e.clientX));
  svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
}

/* =====================================================================
   Wochenbericht
   ===================================================================== */
function weekStats(mon) {
  const end = addDays(mon, 7);
  const ws = data.workouts.filter(w => w.date >= mon && w.date < end);
  const ex = new Map();
  for (const w of ws) for (const e of w.exercises) {
    if (!e.sets.length) continue;
    const k = e.name.trim().toLowerCase();
    const c = ex.get(k) || { name: e.name.trim(), maxKg: 0, repsAtMax: 0, maxReps: 0 };
    for (const s of e.sets) {
      const kg = +s.weight || 0, r = +s.reps || 0;
      if (kg > c.maxKg || (kg === c.maxKg && r > c.repsAtMax)) { c.maxKg = kg; c.repsAtMax = r; }
      c.maxReps = Math.max(c.maxReps, r);
    }
    ex.set(k, c);
  }
  return {
    mon, ex, workouts: ws.length, dates: new Set(ws.map(w => w.date)),
    sets: ws.reduce((n, w) => n + setCount(w), 0),
    reps: ws.reduce((n, w) => n + w.exercises.reduce((m, e) => m + repCount(e.sets), 0), 0),
    volume: ws.reduce((n, w) => n + volume(w), 0)
  };
}
const fmtBest = a => a.maxKg ? `${num(a.maxKg)} kg × ${a.repsAtMax}` : `${a.maxReps} Wdh.`;
function compareEx(a, b) {
  const signed = (d, unit) => (d > 0 ? '+' : '−') + num(Math.abs(d)) + ' ' + unit;
  if (a.maxKg || b.maxKg) {
    const d = a.maxKg - b.maxKg;
    if (d) return { dir: Math.sign(d), text: signed(d, 'kg') };
    const r = a.repsAtMax - b.repsAtMax;
    return { dir: Math.sign(r), text: r ? signed(r, 'Wdh.') : 'gleich' };
  }
  const r = a.maxReps - b.maxReps;
  return { dir: Math.sign(r), text: r ? signed(r, 'Wdh.') : 'gleich' };
}
function weekReport(mon) {
  const cur = weekStats(mon), prev = weekStats(addDays(mon, -7));
  const improved = [], declined = [], same = [], added = [], missed = [];
  for (const [k, a] of cur.ex) {
    const b = prev.ex.get(k);
    if (!b) { added.push({ name: a.name, to: fmtBest(a) }); continue; }
    const c = compareEx(a, b);
    (c.dir > 0 ? improved : c.dir < 0 ? declined : same).push({ name: a.name, from: fmtBest(b), to: fmtBest(a), diff: c.text, dir: c.dir });
  }
  for (const [k, b] of prev.ex) if (!cur.ex.has(k)) missed.push({ name: b.name, to: fmtBest(b) });

  const running = mon === mondayIso(today());
  const useVol = cur.volume || prev.volume;
  const [cv, pv] = useVol ? [cur.volume, prev.volume] : [cur.reps, prev.reps];
  const pct = pv ? Math.round((cv - pv) / pv * 100) : 0;
  const what = useVol ? 'Volumen' : 'Wiederholungen';
  const sp = `${pct >= 0 ? '+' : '−'}${Math.abs(pct)} %`;
  let title, text;
  if (!cur.workouts) {
    title = running ? 'Diese Woche noch kein Training' : 'Kein Training in dieser Woche';
    text = prev.workouts ? `In der Vorwoche waren es ${plural(prev.workouts, 'Workout', 'Workouts')}.` : 'Starte ein Workout, sobald du Zeit hast.';
  } else if (!prev.workouts) {
    title = 'Zurück im Training';
    text = `${plural(cur.workouts, 'Workout', 'Workouts')} nach einer Woche Pause.`;
  } else if (pct >= 10 && improved.length >= declined.length) {
    title = 'Starke Woche';
    text = `${what} ${sp}${improved.length ? `, ${plural(improved.length, 'Übung', 'Übungen')} verbessert` : ''}.`;
  } else if (improved.length > declined.length) {
    title = 'Du wirst stärker';
    text = `${plural(improved.length, 'Übung', 'Übungen')} verbessert, ${what} ${sp}.`;
  } else if (pct <= -10) {
    title = running ? 'Da geht noch was' : 'Ruhigere Woche';
    text = `${what} ${sp} gegenüber der Vorwoche${declined.length ? `, ${plural(declined.length, 'Übung', 'Übungen')} schwächer` : ''}.`;
  } else {
    title = 'Solide Woche';
    text = `${what} auf dem Niveau der Vorwoche (${sp}).`;
  }
  if (running && cur.workouts) text += ' Die Woche läuft noch.';
  return { cur, prev, improved, declined, same, added, missed, title, text, running };
}

        <button class="btn-icon is-framed" data-w="-7" ${m <= first ? 'disabled' : ''} aria-label="Vorherige Woche">${ic('chevron-left')}</button>
        <div class="week-nav-label" aria-live="polite"><b>KW ${isoWeek(m)}</b><span>${weekRange(m)}${r.running ? ' · aktuell' : ''}</span></div>
        <button class="btn-icon is-framed" data-w="7" ${m >= thisMon ? 'disabled' : ''} aria-label="Nächste Woche">${ic('chevron-right')}</button>
      </div>
      <div style="margin-top:var(--s-6)">
        <p class="report-title" style="margin:0">${r.title}</p>
        <p class="report-text">${esc(r.text)}</p>
      </div>
      <div style="margin-top:var(--s-5)">
        <div class="week" role="list">${days.map(d => dayCell(d, r.cur.dates.has(d))).join('')}</div>
        ${weekLegend()}
      </div>
      <div class="tiles" style="margin-top:var(--s-5)">
        <div class="tile"><span class="metric-label">Workouts</span><span class="metric-value">${r.cur.workouts}</span>${delta(r.cur.workouts, r.prev.workouts)}</div>
        <div class="tile"><span class="metric-label">Sätze</span><span class="metric-value">${r.cur.sets}</span>${delta(r.cur.sets, r.prev.sets)}</div>
        <div class="tile"><span class="metric-label">Wiederholungen</span><span class="metric-value">${num(r.cur.reps)}</span>${delta(r.cur.reps, r.prev.reps, { pct: true })}</div>
        <div class="tile"><span class="metric-label">Volumen</span><span class="metric-value">${fmtVol(r.cur.volume)}</span>${delta(r.cur.volume, r.prev.volume, { pct: true, unit: 'kg' })}</div>
      </div>
      <p class="note" style="margin-top:var(--s-3)">Verglichen mit KW ${isoWeek(addDays(m, -7))} (${weekRange(addDays(m, -7))})</p>
      <div style="margin-top:var(--s-2)">
        ${list('Verbessert', r.improved)}
        ${list('Verschlechtert', r.declined)}
        ${list('Gleich geblieben', r.same)}
        ${list('Neu in dieser Woche', r.added)}
        ${list('Diesmal nicht trainiert', r.missed)}
      </div>`;
    sheet.querySelectorAll('#rep .section-label').forEach(el => { el.style.marginTop = 'var(--s-6)'; });
  };
  sheet.addEventListener('click', e => {
    const b = e.target.closest('[data-w]');
    if (b && !b.disabled) { mon = addDays(mon, +b.dataset.w); draw(mon); }
  });
  draw(mon);
}

/* =====================================================================
   Einstellungen
   ===================================================================== */
function renderMore() {
  const s = data.settings;
  const seg = (name, opts, cur) => `<div class="seg" role="group" aria-label="${name}">${opts.map(([v, l]) => `<button data-set="${name}" data-v="${v}" aria-pressed="${String(cur) === String(v)}">${l}</button>`).join('')}</div>`;
  $('v-more').innerHTML = `
    <header class="page-head">
      <p class="eyebrow">App</p>
      <h1 class="page-title" id="t-more">Einstellungen</h1>
    </header>

    <h2 class="section-label">Darstellung</h2>
    <div class="card">
      <div class="setting setting-stack">
        <span class="setting-text"><b>Erscheinungsbild</b><small>Hell, dunkel oder wie dein Gerät</small></span>
        ${seg('theme', [['system', 'System'], ['light', 'Hell'], ['dark', 'Dunkel']], s.theme)}
      </div>
    </div>

    <h2 class="section-label">Pausentimer</h2>
    <div class="card">
      <div class="setting">
        <span class="setting-text" id="auto-l"><b>Automatisch starten</b><small>Nach jedem abgehakten Satz</small></span>
        <button class="switch" role="switch" aria-checked="${s.autoRest}" aria-labelledby="auto-l" data-act="auto"></button>
      </div>
      <div class="setting setting-stack">
        <span class="setting-text"><b>Pausendauer</b><small>Läuft unten mit, auch zwischen den Tabs</small></span>
        ${seg('rest', [[60, '1:00'], [90, '1:30'], [120, '2:00'], [180, '3:00']], s.rest)}
      </div>
    </div>

    <h2 class="section-label">Daten</h2>
    <div class="card list">
      <button class="row" data-act="export">
        <span class="row-chev" style="color:var(--text-secondary)">${ic('download')}</span>
        <span class="row-main"><span class="row-title">Backup exportieren</span><span class="row-sub">Alle Workouts als JSON-Datei sichern</span></span>
        <span class="row-chev">${ic('chevron-right', 16)}</span>
      </button>
      <button class="row" data-act="import" id="import-btn">
        <span class="row-chev" style="color:var(--text-secondary)">${ic('upload')}</span>
        <span class="row-main"><span class="row-title">Backup importieren</span><span class="row-sub">Ersetzt die Daten auf diesem Gerät</span></span>
        <span class="row-chev" id="import-state">${ic('chevron-right', 16)}</span>
      </button>
    </div>
    <p class="note" style="margin-top:var(--s-6)">Deine Daten bleiben auf diesem Gerät. Sichere sie ab und zu mit einem Backup.</p>
  `;
}
$('v-more').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.set === 'theme') { data.settings.theme = b.dataset.v; applyTheme(); }
  else if (b.dataset.set === 'rest') data.settings.rest = +b.dataset.v;
  else if (b.dataset.act === 'auto') data.settings.autoRest = !data.settings.autoRest;
  else if (b.dataset.act === 'export') return exportData();
  else if (b.dataset.act === 'import') return $('import-file').click();
  else return;
  save(); renderMore();
});

function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `training-backup-${today()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup gespeichert', { type: 'success' });
}
$('import-file').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const st = $('import-state');
  if (st) st.innerHTML = '<span class="btn is-loading" style="height:16px;padding:0;width:16px" aria-label="Wird geladen"></span>';
  try {
    const imported = JSON.parse(await file.text());
    if (!Array.isArray(imported.workouts)) throw new Error('format');
    if (!confirm(`Backup mit ${plural(imported.workouts.length, 'Workout', 'Workouts')} importieren? Die aktuellen Daten auf diesem Gerät werden ersetzt.`)) { renderMore(); return; }
    localStorage.setItem(KEY, JSON.stringify(imported));
    data = load(); save(); applyTheme(); render();
    toast(`${plural(data.workouts.length, 'Workout', 'Workouts')} importiert`, { type: 'success' });
  } catch {
    renderMore();
    toast('Diese Datei ist kein gültiges Backup. Wähle eine Datei, die du über „Backup exportieren“ erstellt hast.', { type: 'error' });
  }
});

/* =====================================================================
   Pausentimer
   ===================================================================== */
let timer = null;
function startTimer(sec) {
  stopTimer();
  timer = { end: Date.now() + sec * 1000, total: sec };
  timer.iv = setInterval(tickTimer, 250);
  $('timer-wrap').classList.remove('hidden');
  document.body.classList.add('has-timer');
  tickTimer();
  const frame = () => {
    if (!timer) return;
    const left = Math.max(0, timer.end - Date.now());
    $('timer-bar').style.transform = `scaleX(${Math.min(1, left / (timer.total * 1000))})`;
    timer.raf = requestAnimationFrame(frame);
  };
  frame();
}
function stopTimer() {
  if (timer) { clearInterval(timer.iv); cancelAnimationFrame(timer.raf); }
  timer = null;
  $('timer-wrap').classList.add('hidden');
  document.body.classList.remove('has-timer');
}
function tickTimer() {
  const left = Math.max(0, Math.ceil((timer.end - Date.now()) / 1000));
  $('timer-time').textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  if (left <= 0) {
    stopTimer(); beep();
    if (navigator.vibrate) navigator.vibrate([180, 90, 180]);
    toast('Pause vorbei. Nächster Satz!', { type: 'success' });
  }
}
document.querySelector('.timer').addEventListener('click', e => {
  const b = e.target.closest('[data-t]'); if (!b || !timer) return;
  if (b.dataset.t === 'skip') return stopTimer();
  const d = +b.dataset.t;
  timer.end = Math.max(Date.now() + 1000, timer.end + d * 1000);
  timer.total = Math.max(timer.total + d, 1);
  tickTimer();
});
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.24].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.18, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.18);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2);
    });
  } catch {}
}

/* =====================================================================
   Sheet, Toast, Rückgängig
   ===================================================================== */
let lastFocus = null;
function openSheet(title, html) {
  closeSheet(true);
  lastFocus = document.activeElement;
  const bg = document.createElement('div');
  bg.className = 'sheet-backdrop'; bg.id = 'sheet';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head"><h2 class="sheet-title truncate" id="sheet-title">${esc(title)}</h2>
      <button class="btn-icon" data-close aria-label="Schließen">${ic('x')}</button></div>
    <div class="sheet-body">${html}</div></div>`;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) closeSheet(); });
  document.body.appendChild(bg);
  requestAnimationFrame(() => requestAnimationFrame(() => bg.classList.add('is-open')));
  bg.firstElementChild.focus({ preventScroll: true });
  return bg.querySelector('.sheet-body');
}
function closeSheet(immediate) {
  const bg = $('sheet');
  if (!bg) return;
  bg.removeAttribute('id');
  if (immediate || reduced()) bg.remove();
  else { bg.classList.remove('is-open'); setTimeout(() => bg.remove(), 250); }
  if (!immediate && lastFocus && lastFocus.isConnected) lastFocus.focus({ preventScroll: true });
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('sheet')) closeSheet();
  if (e.key === 'Tab' && $('sheet')) {           // Fokus im Dialog halten
    const f = [...$('sheet').querySelectorAll('button:not([disabled]), input, [tabindex="-1"]')].filter(el => el.offsetParent !== null);
    if (!f.length) return;
    const firstEl = f[0], lastEl = f.at(-1);
    if (e.shiftKey && document.activeElement === firstEl) { e.preventDefault(); lastEl.focus(); }
    else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); firstEl.focus(); }
  }
});

let toastEl = null, toastTimer = null;
function toast(msg, { type = 'info', action } = {}) {
  if (toastEl) { const old = toastEl; old.classList.remove('is-shown'); setTimeout(() => old.remove(), 200); }
  clearTimeout(toastTimer);
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.setAttribute('role', type === 'error' ? 'alert' : 'status');
  t.innerHTML = `${type === 'success' ? ic('check-circle', 18) : type === 'error' ? ic('alert', 18) : ''}<span class="toast-msg">${esc(msg)}</span>${action ? `<button class="toast-action">${esc(action.label)}</button>` : ''}`;
  if (action) t.querySelector('button').addEventListener('click', () => { action.fn(); hide(); });
  document.body.appendChild(t);
  toastEl = t;
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('is-shown')));
  const hide = () => { t.classList.remove('is-shown'); setTimeout(() => t.remove(), 200); if (toastEl === t) toastEl = null; };
  toastTimer = setTimeout(hide, action ? 5000 : type === 'error' ? 6500 : 2400);
}
function withUndo(msg, fn) {
  const snapshot = JSON.stringify(data.workouts);
  fn(); save(); render();
  toast(msg, { action: { label: 'Rückgängig', fn: () => { data.workouts = JSON.parse(snapshot); save(); render(); } } });
}

/* =====================================================================
   Start
   ===================================================================== */
applyTheme();
show('home');

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
