<style>
/* =====================================================================
   DESIGN-SYSTEM · „Kreide & Gusseisen“
   Alle Werte als Tokens. Komponenten verwenden ausschließlich diese.
   ===================================================================== */
:root {
  /* Typografie */
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-12: 0.75rem;   /* Labels, Meta */
  --fs-14: 0.875rem;  /* Sekundärtext, Buttons */
  --fs-16: 1rem;      /* Fließtext */
  --fs-20: 1.25rem;   /* Karten-Titel, Kennzahlen */
  --fs-24: 1.5rem;
  --fs-32: 2rem;      /* Seitentitel */
  --fs-48: 3rem;
  --fs-64: 4rem;      /* Display (Jahresrückblick) */
  --lh-tight: 1.1;
  --lh-snug: 1.25;
  --lh-body: 1.5;
  --tracking-tight: -0.025em;
  --tracking-snug: -0.01em;
  --tracking-caps: 0.06em;

  /* Abstände (4px-Raster) */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px; --s-5: 20px;
  --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px;

  /* Radien: außen 16 → innen 10 → klein 6 */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-full: 999px;

  /* Bewegung */
  --dur-fast: 150ms;
  --dur: 200ms;
  --dur-slow: 250ms;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* Layout */
  --content-w: 680px;
  --nav-w: 248px;
  --tap: 44px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --page-x: var(--s-4);
  --page-top: calc(var(--safe-t) + var(--s-6));

  /* ---------- Farben: Dunkel (Standard) ---------- */
  color-scheme: dark;
  --bg-app: #121110;
  --bg-surface: #1a1917;
  --bg-inset: #23211e;
  --bg-elevated: #1f1d1b;
  --bg-hover: rgba(255, 248, 240, 0.04);
  --bg-press: rgba(255, 248, 240, 0.07);
  --glass: rgba(18, 17, 16, 0.8);
  --backdrop: rgba(8, 7, 6, 0.55);

  --border-subtle: rgba(255, 244, 230, 0.07);
  --border: rgba(255, 244, 230, 0.11);
  --border-strong: rgba(255, 244, 230, 0.18);
  --border-top: rgba(255, 248, 240, 0.11);   /* feines Kanten-Highlight */
  --highlight: rgba(255, 250, 245, 0.16);

  --text-primary: #f3f0ea;
  --text-secondary: #aca69d;
  --text-tertiary: #918b81;

  --accent: #f0824c;
  --accent-hover: #f59362;
  --accent-press: #e2733e;
  --accent-ink: #1d0f07;
  --accent-soft: rgba(240, 130, 76, 0.11);

  /* Rekord: gedämpftes Champagner-Gold, nur für Auszeichnungen (Rekord-Hinweis, Pokal, Rekord-Karten) */
  --record: #e6c77e;
  --record-soft: rgba(230, 199, 126, 0.12);
  --record-edge: rgba(230, 199, 126, 0.38);

  --success: #86c49a;
  --success-soft: rgba(134, 196, 154, 0.14);
  --danger: #ee8295;
  --danger-soft: rgba(238, 130, 149, 0.13);

  --shadow-sm: 0 1px 2px rgba(8, 6, 4, 0.4);
  --shadow-md: 0 1px 2px rgba(8, 6, 4, 0.35), 0 8px 24px -8px rgba(8, 6, 4, 0.55);
  --shadow-lg: 0 2px 4px rgba(8, 6, 4, 0.35), 0 24px 56px -12px rgba(8, 6, 4, 0.65);
}

/* ---------- Farben: Hell ---------- */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg-app: #f6f5f2;
    --bg-surface: #fdfcfa;
    --bg-inset: #f0eee9;
    --bg-elevated: #fdfcfa;
    --bg-hover: rgba(48, 32, 16, 0.04);
    --bg-press: rgba(48, 32, 16, 0.07);
    --glass: rgba(246, 245, 242, 0.82);
    --backdrop: rgba(32, 26, 20, 0.28);
    --border-subtle: rgba(48, 32, 16, 0.08);
    --border: rgba(48, 32, 16, 0.12);
    --border-strong: rgba(48, 32, 16, 0.2);
    --border-top: rgba(48, 32, 16, 0.06);
    --highlight: rgba(255, 255, 255, 0.35);
    --text-primary: #1c1a17;
    --text-secondary: #5e5952;
    --text-tertiary: #6f6a63;
    --accent: #b8440f;
    --accent-hover: #a33b0b;
    --accent-press: #923409;
    --accent-ink: #fffaf6;
    --accent-soft: rgba(184, 68, 15, 0.09);
    --record: #7a5c0c;
    --record-soft: rgba(122, 92, 12, 0.1);
    --record-edge: rgba(122, 92, 12, 0.34);
    --success: #2f7d4a;
    --success-soft: rgba(47, 125, 74, 0.1);
    --danger: #b23a56;
    --danger-soft: rgba(178, 58, 86, 0.1);
    --shadow-sm: 0 1px 2px rgba(60, 40, 20, 0.06);
    --shadow-md: 0 1px 2px rgba(60, 40, 20, 0.05), 0 8px 24px -8px rgba(60, 40, 20, 0.12);
    --shadow-lg: 0 2px 4px rgba(60, 40, 20, 0.05), 0 24px 56px -12px rgba(60, 40, 20, 0.22);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg-app: #f6f5f2;
  --bg-surface: #fdfcfa;
  --bg-inset: #f0eee9;
  --bg-elevated: #fdfcfa;
  --bg-hover: rgba(48, 32, 16, 0.04);
  --bg-press: rgba(48, 32, 16, 0.07);
  --glass: rgba(246, 245, 242, 0.82);
  --backdrop: rgba(32, 26, 20, 0.28);
  --border-subtle: rgba(48, 32, 16, 0.08);
  --border: rgba(48, 32, 16, 0.12);
  --border-strong: rgba(48, 32, 16, 0.2);
  --border-top: rgba(48, 32, 16, 0.06);
  --highlight: rgba(255, 255, 255, 0.35);
  --text-primary: #1c1a17;
  --text-secondary: #5e5952;
  --text-tertiary: #6f6a63;
  --accent: #b8440f;
  --accent-hover: #a33b0b;
  --accent-press: #923409;
  --accent-ink: #fffaf6;
  --accent-soft: rgba(184, 68, 15, 0.09);
  --record: #7a5c0c;
  --record-soft: rgba(122, 92, 12, 0.1);
  --record-edge: rgba(122, 92, 12, 0.34);
  --success: #2f7d4a;
  --success-soft: rgba(47, 125, 74, 0.1);
  --danger: #b23a56;
  --danger-soft: rgba(178, 58, 86, 0.1);
  --shadow-sm: 0 1px 2px rgba(60, 40, 20, 0.06);
  --shadow-md: 0 1px 2px rgba(60, 40, 20, 0.05), 0 8px 24px -8px rgba(60, 40, 20, 0.12);
  --shadow-lg: 0 2px 4px rgba(60, 40, 20, 0.05), 0 24px 56px -12px rgba(60, 40, 20, 0.22);
}

@media (min-width: 640px) {
  :root { --page-x: var(--s-8); }
}
@media (min-width: 960px) {
  :root { --page-x: var(--s-10); --page-top: var(--s-12); }
}

/* =====================================================================
   BASIS
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
/* Kein grauer Tipp-Blitz auf allem, was antippbar ist (auch summary, label, SVG-Muskeln) – Drück-Feedback kommt über :active */
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
/* Langes Drücken auf Bedienelemente markiert keinen Text und öffnet kein Kontextmenü (Inhalt bleibt kopierbar; label nicht, sonst blockiert iOS enthaltene Eingabefelder) */
button, summary, .drag-handle { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
/* Kein Zoom bei schnellem Doppeltipp (Pinch-Zoom bleibt erlaubt) und keine 300-ms-Verzögerung */
html, body, button, input, label, summary, a { touch-action: manipulation; }
body {
  margin: 0;
  background: var(--bg-app);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: var(--fs-16);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p { margin: 0; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
.ic { flex: none; display: block; }
.hidden { display: none !important; }
.tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }

/* =====================================================================
   LAYOUT
   ===================================================================== */
main { padding: var(--page-top) var(--page-x) calc(176px + var(--safe-b)); }
.view { max-width: var(--content-w); margin: 0 auto; }

.page-head { margin-bottom: var(--s-6); }
.eyebrow { font-size: var(--fs-14); color: var(--text-secondary); }
.page-title {
  font-size: var(--fs-32); line-height: var(--lh-tight);
  font-weight: 700; letter-spacing: var(--tracking-tight);
}
.page-sub { margin-top: var(--s-1); font-size: var(--fs-14); color: var(--text-secondary); }

/* Startbereich: das fällige Workout als Hauptaktion */
.start { display: grid; gap: var(--s-1); margin-bottom: var(--s-4); }
.start-main { height: auto; min-height: 88px; padding: var(--s-4); justify-content: flex-start; gap: var(--s-4); text-align: left; }
.start-ic { flex: none; width: 48px; height: 48px; display: grid; place-items: center; border-radius: var(--r-full); background: color-mix(in srgb, var(--accent-ink) 14%, transparent); }
.start-text { display: grid; gap: 2px; min-width: 0; }
.start-t { font-size: var(--fs-20); font-weight: 700; letter-spacing: var(--tracking-tight); line-height: var(--lh-snug); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.start-sub { font-size: var(--fs-14); font-weight: 500; line-height: var(--lh-snug); opacity: 0.85; font-variant-numeric: tabular-nums; }
.start-ex { margin-top: var(--s-1); font-size: var(--fs-12); font-weight: 500; line-height: var(--lh-snug); opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Hinweise (Wochenabschluss, Backup) als ruhige Zeilen */
.notices { margin-top: var(--s-4); }
.notice { min-height: 60px; gap: var(--s-3); }
.notice-icon { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r-full); background: var(--bg-inset); color: var(--text-secondary); }
.notice-btn { height: 36px; padding: 0 var(--s-3); flex: none; }
.notice .row-sub { white-space: normal; }
.notice-x { width: 36px; height: 36px; margin-right: calc(var(--s-2) * -1); }
.notice-x::before { content: ""; position: absolute; inset: -4px; } /* 44px Touch-Ziel */
.notice-x { position: relative; }
.section-label {
  margin: var(--s-8) 0 var(--s-3); padding: 0 var(--s-1);
  font-size: var(--fs-12); font-weight: 600; letter-spacing: var(--tracking-caps);
  text-transform: uppercase; color: var(--text-tertiary);
}
.section-label:first-child { margin-top: 0; }

/* =====================================================================
   BUTTONS
   ===================================================================== */
.btn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  height: var(--tap); padding: 0 var(--s-4);
  border-radius: var(--r-md);
  font-size: var(--fs-14); font-weight: 600; line-height: 1; white-space: nowrap;
  transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
  user-select: none;
}
.btn:active { transform: scale(0.98); }
.btn-lg { height: 48px; font-size: var(--fs-16); }
.btn-block { width: 100%; }
.btn-primary {
  background: var(--accent); color: var(--accent-ink);
  box-shadow: inset 0 1px 0 var(--highlight), var(--shadow-sm);
}
.btn-primary:active { background: var(--accent-press); }
.btn-secondary {
  background: var(--bg-surface); color: var(--text-primary);
  border: 1px solid var(--border); border-top-color: var(--border-top);
  box-shadow: var(--shadow-sm);
}
.btn-ghost { color: var(--text-secondary); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }
.btn.is-loading { color: transparent !important; pointer-events: none; }
.btn.is-loading::after {
  content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--text-secondary); border-right-color: transparent;
  animation: spin 700ms linear infinite;
}
.btn-icon {
  display: inline-grid; place-items: center; flex: none;
  width: var(--tap); height: var(--tap); border-radius: var(--r-md);
  color: var(--text-secondary);
  transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast);
}
.btn-icon:active { transform: scale(0.94); background: var(--bg-press); }
.btn-icon:disabled { opacity: 0.3; pointer-events: none; }
.btn-icon.is-framed { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-top-color: var(--border-top); }

@media (hover: hover) and (pointer: fine) {
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary:hover { background: var(--bg-inset); }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }
  .btn-icon:hover { background: var(--bg-hover); color: var(--text-primary); }
  .btn-danger:hover { background: var(--danger-soft); filter: brightness(1.1); }
}

/* =====================================================================
   FORMULARE
   ===================================================================== */
.label { display: block; margin-bottom: var(--s-2); font-size: var(--fs-14); font-weight: 500; color: var(--text-secondary); }
.input {
  width: 100%; height: 48px; padding: 0 var(--s-4);
  background: var(--bg-inset); color: var(--text-primary);
  border: 1px solid var(--border-subtle); border-radius: var(--r-md);
  font-size: var(--fs-16);
}
.input::placeholder { color: var(--text-tertiary); }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input[aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.field-error {
  display: flex; align-items: center; gap: var(--s-2);
  margin-bottom: var(--s-2); font-size: var(--fs-14); color: var(--danger);
}
@media (hover: hover) and (pointer: fine) { .input:hover:not(:focus) { border-color: var(--border); } }

/* Datum: eigenes Aussehen, natives Feld liegt unsichtbar darüber */
.date-field, .date-chip { position: relative; display: flex; align-items: center; cursor: pointer; }
.date-field input, .date-chip input {
  position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0;
  opacity: 0; border: 0; -webkit-appearance: none; appearance: none; font-size: 16px; cursor: pointer;
}
.date-field {
  justify-content: space-between; gap: var(--s-3); height: 48px; padding: 0 var(--s-4);
  background: var(--bg-inset); border: 1px solid var(--border-subtle); border-radius: var(--r-md);
}
.date-field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.date-field-value { display: flex; align-items: center; gap: var(--s-2); font-weight: 500; }
.date-field-value .ic { color: var(--text-secondary); }
.date-chip {
  display: inline-flex; gap: var(--s-2); height: 32px; padding: 0 var(--s-3);
  border-radius: var(--r-full); background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  font-size: var(--fs-14); font-weight: 500; color: var(--text-secondary);
}
.date-chip::before { content: ""; position: absolute; inset: -6px; } /* 44px Touch-Ziel */
.date-chip:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Segmented Control */
.seg { display: flex; gap: var(--s-1); padding: var(--s-1); background: var(--bg-inset); border-radius: var(--r-md); }
.seg button {
  flex: 1; min-width: 0; height: 36px; padding: 0 var(--s-2); border-radius: var(--r-sm);
  font-size: var(--fs-14); font-weight: 500; color: var(--text-secondary); white-space: nowrap; font-variant-numeric: tabular-nums;
}
.seg button[aria-pressed="true"] {
  background: var(--bg-surface); color: var(--text-primary);
  box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--border-subtle);
}
@media (hover: hover) and (pointer: fine) { .seg button:hover:not([aria-pressed="true"]) { color: var(--text-primary); } }

/* Schalter */
.switch {
  position: relative; flex: none; width: 44px; height: 28px; border-radius: var(--r-full);
  background: var(--bg-inset); box-shadow: inset 0 0 0 1px var(--border);
}
.switch::after {
  content: ""; position: absolute; left: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--text-tertiary); box-shadow: var(--shadow-sm);
  transition: transform var(--dur) var(--ease-out);
}
.switch[aria-checked="true"] { background: var(--accent); box-shadow: none; }
.switch[aria-checked="true"]::after { transform: translateX(16px); background: var(--accent-ink); }

/* =====================================================================
   KARTEN & LISTEN
   ===================================================================== */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle); border-top-color: var(--border-top);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}
.card-pad { padding: var(--s-4); }
.card-link {
  display: block; width: 100%; text-align: left;
  transition: transform var(--dur) var(--ease-out);
}
.card-link:active { transform: scale(0.99); }
@media (hover: hover) and (pointer: fine) { .card-link:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); } }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); }
.card-title { font-size: var(--fs-14); font-weight: 600; }
.card-meta { font-size: var(--fs-12); color: var(--text-tertiary); font-weight: 500; }

.list { overflow: hidden; }
.row {
  display: flex; align-items: center; gap: var(--s-3);
  width: 100%; min-height: 64px; padding: var(--s-3) var(--s-4); text-align: left;
}
.row + .row { border-top: 1px solid var(--border-subtle); }
button.row:active { background: var(--bg-press); }
button.row:focus-visible { outline-offset: -2px; border-radius: 0; }
@media (hover: hover) and (pointer: fine) { button.row:hover { background: var(--bg-hover); } }
.row-main { flex: 1; min-width: 0; }
.row-title { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { display: block; font-size: var(--fs-14); color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-chev { color: var(--text-tertiary); }
.row-date { flex: none; width: 40px; text-align: center; }
.row-date-wd { display: block; font-size: var(--fs-12); font-weight: 500; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; }
.row-date-d { display: block; font-size: var(--fs-20); font-weight: 600; line-height: var(--lh-tight); font-variant-numeric: tabular-nums; }
.row-num { flex: none; text-align: right; }
.row-num-v { display: block; font-weight: 600; font-variant-numeric: tabular-nums; }
.row-num-l { display: block; font-size: var(--fs-12); color: var(--text-tertiary); }

.list-inset { background: var(--bg-inset); border-radius: var(--r-md); overflow: hidden; }
.list-inset .row { min-height: 56px; }

/* Kennzahlen */
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.metric { min-width: 0; }
.metric + .metric { padding-left: var(--s-4); border-left: 1px solid var(--border-subtle); }
.metric-label { display: block; font-size: var(--fs-12); font-weight: 500; color: var(--text-tertiary); }
.metrics .metric-value { font-size: var(--fs-24); font-weight: 700; letter-spacing: var(--tracking-tight); }
.metric-value {
  display: block; margin-top: var(--s-1);
  font-size: var(--fs-20); font-weight: 600; letter-spacing: var(--tracking-snug);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.delta {
  display: inline-flex; align-items: center; gap: var(--s-1); margin-top: var(--s-1);
  font-size: var(--fs-12); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.delta-up { color: var(--success); }
.delta-down { color: var(--danger); }
.delta-eq { color: var(--text-tertiary); }

/* Wochenleiste */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--s-1); }
.day { display: flex; flex-direction: column; align-items: center; gap: var(--s-2); }
.day-label { font-size: var(--fs-12); font-weight: 500; color: var(--text-tertiary); }
.day-num {
  width: 36px; height: 36px; border-radius: var(--r-full); display: grid; place-items: center;
  font-size: var(--fs-14); font-weight: 600; font-variant-numeric: tabular-nums;
  background: var(--bg-inset); color: var(--text-tertiary);
}
.day.is-today .day-num { box-shadow: inset 0 0 0 2px var(--accent); color: var(--text-primary); }
.day.is-trained .day-num { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.day.is-missed .day-num { background: var(--danger-soft); color: var(--danger); }
.week-legend { display: flex; gap: var(--s-4); margin-top: var(--s-3); font-size: var(--fs-12); color: var(--text-tertiary); }
.week-legend span { display: inline-flex; align-items: center; gap: var(--s-1); }
.week-legend i { width: 8px; height: 8px; border-radius: 50%; display: block; }

/* Leerer Zustand */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--s-12) var(--s-6); }
.empty-icon {
  width: 48px; height: 48px; display: grid; place-items: center; margin-bottom: var(--s-4);
  border-radius: var(--r-md); background: var(--bg-surface); border: 1px solid var(--border-subtle);
  color: var(--text-secondary); box-shadow: var(--shadow-sm);
}
.empty h3 { font-size: var(--fs-16); font-weight: 600; }
.empty p { margin-top: var(--s-1); max-width: 34ch; font-size: var(--fs-14); color: var(--text-secondary); }
.empty .btn { margin-top: var(--s-5); }

/* =====================================================================
   WORKOUT
   ===================================================================== */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-2);
  margin: calc(var(--page-top) * -1) calc(var(--page-x) * -1) 0;
  padding: calc(var(--safe-t) + var(--s-2)) calc(var(--page-x) - var(--s-2)) var(--s-2);
  background: var(--glass);
  -webkit-backdrop-filter: saturate(1.4) blur(16px); backdrop-filter: saturate(1.4) blur(16px);
  border-bottom: 1px solid transparent;
}
.topbar.is-scrolled { border-bottom-color: var(--border-subtle); }
.topbar-title {
  min-width: 0; font-size: var(--fs-16); font-weight: 600;
  opacity: 0; transform: translateY(4px);
  transition: opacity var(--dur) var(--ease-out), transform var(--dur) var(--ease-out);
}
.topbar.is-scrolled .topbar-title { opacity: 1; transform: none; }

.w-title {
  display: block; width: 100%; margin-top: var(--s-2); padding: 0;
  background: none; border: 0; border-radius: 0;
  font-size: var(--fs-24); font-weight: 700; letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
}
.w-title::placeholder { color: var(--text-tertiary); }
.w-title:focus-visible { outline: none; box-shadow: 0 2px 0 var(--accent); }
.w-meta { display: flex; align-items: center; gap: var(--s-3); margin-top: var(--s-2); }

.w-progress { margin-top: var(--s-4); }
.w-progress-meta {
  display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-3);
  margin-bottom: var(--s-2); font-size: var(--fs-14); color: var(--text-secondary);
}
.w-progress-meta b { color: var(--text-primary); font-weight: 600; }
.bar { height: 4px; border-radius: var(--r-full); background: var(--bg-inset); overflow: hidden; }
.bar > i {
  display: block; height: 100%; border-radius: inherit; background: var(--accent);
  transform-origin: left center; transform: scaleX(0);
  transition: transform var(--dur-slow) var(--ease-out);
}

.ex-wrap { margin-top: var(--s-3); border-radius: var(--r-lg); }
.ex-wrap:first-child { margin-top: var(--s-4); }
/* Rekord: feine goldene Kante oben, solange die Übung einen Rekord hält */
.ex.has-pr { border-top-color: var(--record-edge); }
.ex { position: relative; padding: var(--s-4) var(--s-4) var(--s-3); }
.ex-head { display: flex; align-items: flex-start; gap: var(--s-2); margin-bottom: var(--s-3); touch-action: pan-y; }
.ex-head-main { flex: 1; min-width: 0; }
.ex-name { font-size: var(--fs-16); font-weight: 600; line-height: var(--lh-snug); }
.ex-meta { display: block; margin-top: var(--s-1); font-size: var(--fs-14); color: var(--text-secondary); }
.ex-head > .btn-icon:last-child { margin: calc(var(--s-3) * -1) calc(var(--s-3) * -1) 0 0; }
.drag-handle { margin: calc(var(--s-3) * -1) calc(var(--s-1) * -1) 0 calc(var(--s-3) * -1); color: var(--text-tertiary); touch-action: none; cursor: grab; }
.drag-handle:active { cursor: grabbing; }

/* Persönlicher Rekord */
.pr-badge {
  display: none; align-items: center; gap: var(--s-1); width: max-content;
  height: 24px; margin-top: var(--s-2); padding: 0 var(--s-2); border-radius: var(--r-full);
  background: var(--record-soft); color: var(--record); box-shadow: inset 0 0 0 1px var(--record-edge);
  font-size: var(--fs-12); font-weight: 600;
}
.has-pr .pr-badge { display: inline-flex; animation: rise var(--dur-slow) var(--ease-out); }
.idx-pr { display: none; color: var(--record); place-items: center; }
.set.is-pr .idx-num { display: none; }
.set.is-pr .idx-pr { display: grid; }

/* Wischen & Umsortieren */
.swipe { position: relative; }
.swipe-bg {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; gap: var(--s-2);
  padding-right: var(--s-5); border-radius: inherit;
  background: var(--danger-soft); color: var(--danger); font-size: var(--fs-14); font-weight: 600;
  opacity: 0;
}
.swipe.is-swiping .swipe-bg { opacity: 1; }
.swipe.will-delete .swipe-bg { background: var(--danger); color: var(--bg-app); }
.swipe.will-delete .swipe-bg .ic { animation: pop var(--dur) var(--ease-spring); }
.ex-wrap.is-dragging { position: relative; z-index: 5; }
.ex-wrap.is-dragging .ex { box-shadow: var(--shadow-lg); transform: scale(1.015); transition: transform var(--dur) var(--ease-out); }
.ex-wrap.is-shifting { transition: transform var(--dur) var(--ease-out); }

/* Dauer */
.time-chip {
  display: inline-flex; align-items: center; gap: var(--s-2); height: 32px; padding: 0 var(--s-3);
  border-radius: var(--r-full); background: var(--bg-surface); border: 1px solid var(--border-subtle);
  font-size: var(--fs-14); font-weight: 500; color: var(--text-secondary); font-variant-numeric: tabular-nums;
}
.time-chip.is-live { color: var(--text-primary); }
.live-dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

/* Rekord-Jagd */
.hunt {
  display: flex; align-items: center; gap: var(--s-1);
  padding: var(--s-1) var(--s-1) var(--s-1) 40px;
  font-size: var(--fs-14); font-weight: 500; color: var(--record);
}
.hunt + .set-swipe, .set-stepper + .set-swipe { margin-top: var(--s-1); }

/* Notiz zur Übung */
.ex-note {
  display: flex; align-items: flex-start; gap: var(--s-2); width: 100%; min-height: var(--tap); margin-bottom: var(--s-3); padding: var(--s-3);
  border-radius: var(--r-md); background: var(--bg-inset); text-align: left; color: var(--text-secondary);
  font-size: var(--fs-14); line-height: var(--lh-snug);
}
.ex-note .ic { flex: none; margin-top: 2px; color: var(--text-tertiary); }
.ex-note span { min-width: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; white-space: pre-line; }
textarea.input { height: auto; min-height: 96px; padding: var(--s-3) var(--s-4); resize: none; font-family: var(--font-sans); font-size: var(--fs-16); line-height: var(--lh-body); }

/* Anleitung in Schritten */
.steps { display: grid; gap: var(--s-3); margin: var(--s-4) 0; padding: 0; list-style: none; counter-reset: step; }
.steps li { display: flex; align-items: flex-start; gap: var(--s-3); font-size: var(--fs-14); color: var(--text-secondary); counter-increment: step; }
.steps li::before {
  content: counter(step); flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: var(--r-full);
  background: var(--bg-inset); color: var(--text-primary); font-size: var(--fs-12); font-weight: 600; font-variant-numeric: tabular-nums;
}
.steps li b { color: var(--text-primary); font-weight: 600; }
.steps .ic { display: inline; vertical-align: -3px; }

/* ±-Schritte unter dem Satz, solange ein Zahlenfeld aktiv ist (Tastatur bleibt offen) */
.set-stepper {
  display: flex; align-items: center; justify-content: flex-end; gap: var(--s-2);
  padding: var(--s-1) var(--s-1) 0; scroll-margin-bottom: 180px; animation: rise var(--dur) var(--ease-out);
}
.set-stepper-k { margin-right: auto; padding-left: 40px; font-size: var(--fs-12); font-weight: 500; color: var(--text-tertiary); }
.stp {
  min-width: 56px; height: var(--tap); padding: 0 var(--s-2); border-radius: var(--r-sm);
  background: var(--bg-inset); color: var(--text-primary);
  font-family: var(--font-mono); font-size: var(--fs-14); font-weight: 600; font-variant-numeric: tabular-nums;
  transition: transform var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
}
.stp:active { transform: scale(0.94); background: var(--bg-press); }
.stp-minus { color: var(--text-secondary); }
@media (hover: hover) and (pointer: fine) { .stp:hover { background: var(--bg-hover); } }

/* Hinweiszeilen & Callouts */
.hint-row {
  display: flex; align-items: center; gap: var(--s-3); margin-top: var(--s-3);
  padding: var(--s-3); border-radius: var(--r-md); background: var(--bg-inset);
  font-size: var(--fs-14); color: var(--text-secondary);
}
.hint-row > .ic { color: var(--text-tertiary); }
.hint-row > span { flex: 1; min-width: 0; }
.hint-row .btn { height: 32px; padding: 0 var(--s-3); flex: none; }
.callout {
  display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-4);
  border-radius: var(--r-md); background: var(--accent-soft); font-size: var(--fs-14);
}
.callout > .ic { color: var(--accent); }
.callout b { font-weight: 600; }
/* Einführung: Spotlight auf dem echten Element, Erklärkarte oben oder unten */
.tour { position: fixed; inset: 0; z-index: 70; opacity: 0; transition: opacity var(--dur) var(--ease-out); touch-action: none; }
.tour.is-open { opacity: 1; }
.tour-spot {
  position: fixed; left: 0; top: 0; border-radius: var(--r-lg); pointer-events: none;
  box-shadow: 0 0 0 2px var(--accent), 0 0 0 9999px var(--backdrop-strong, var(--backdrop));
  transition: transform 300ms var(--ease-out), width 300ms var(--ease-out), height 300ms var(--ease-out), box-shadow var(--dur) var(--ease-out);
}
.tour.no-target .tour-spot { transform: translate(50vw, 40vh) !important; width: 0 !important; height: 0 !important; box-shadow: 0 0 0 9999px var(--backdrop-strong, var(--backdrop)); }
.tour-card {
  position: fixed; left: var(--page-x); right: var(--page-x); bottom: calc(var(--s-4) + var(--safe-b));
  max-width: 480px; margin: 0 auto; overflow: hidden;
  padding: var(--s-5) var(--s-5) var(--s-4);
  background: var(--bg-elevated); border: 1px solid var(--border); border-top-color: var(--border-strong);
  border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
  animation: rise var(--dur-slow) var(--ease-out);
}
.tour-card.at-top { bottom: auto; top: calc(var(--s-4) + var(--safe-t)); }
.tour.no-target .tour-card { bottom: auto; top: 50%; transform: translateY(-50%); }
.tour-bar { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--border-subtle); }
.tour-bar i { display: block; height: 100%; background: var(--accent); transform-origin: left center; transition: transform var(--dur-slow) var(--ease-out); }
.tour-head { display: flex; align-items: center; justify-content: space-between; margin: calc(var(--s-2) * -1) calc(var(--s-3) * -1) 0 0; }
.tour-count { font-family: var(--font-mono); font-size: var(--fs-12); font-weight: 500; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.tour-skip { height: 36px; padding: 0 var(--s-3); }
.tour-title { margin-top: var(--s-1); font-size: var(--fs-20); font-weight: 600; letter-spacing: var(--tracking-snug); line-height: var(--lh-snug); }
.tour-text { margin-top: var(--s-2); font-size: var(--fs-14); line-height: 1.5; color: var(--text-secondary); text-wrap: pretty; }
.tour-actions { display: flex; justify-content: flex-end; gap: var(--s-2); margin-top: var(--s-4); }
.tour-actions .btn-ghost:disabled { visibility: hidden; }
/* „Meintest du …?“ beim Hinzufügen einer Übung */
.ex-similar { display: flex; align-items: center; gap: var(--s-2); margin-bottom: var(--s-2); font-size: var(--fs-14); }
.ex-similar > span { flex: 1; min-width: 0; }
.ex-similar small { color: var(--text-secondary); font-size: var(--fs-12); }
.ex-similar .btn { height: 36px; padding: 0 var(--s-3); flex: none; }
/* Routinen-Editor */
.re-list { display: grid; gap: var(--s-2); }
.re-ex { padding: var(--s-2) var(--s-2) var(--s-3) var(--s-3); border-radius: var(--r-md); background: var(--bg-inset); }
.re-ex-head { display: flex; align-items: center; gap: var(--s-1); min-height: var(--tap); }
.re-ex-head b { flex: 1; min-width: 0; font-weight: 600; }
.re-ex-row { display: flex; align-items: center; gap: var(--s-2); }
.re-k { font-size: var(--fs-12); font-weight: 500; color: var(--text-secondary); }
.stepper { display: inline-flex; align-items: center; gap: var(--s-1); }
.re-ex-row .re-k + .re-reps, .re-ex-row .stepper + .re-k { margin-left: auto; }
.stepper b { min-width: 2ch; text-align: center; font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.stepper .btn-icon:disabled { opacity: 0.35; }
.re-ex-row .re-reps { width: 88px; flex: none; background: var(--bg-surface); }
.re-add { display: flex; gap: var(--s-2); }
.re-add .btn { width: 48px; height: 48px; padding: 0; flex: none; }
.is-danger-text { color: var(--danger); }
.callout.stall { margin-bottom: var(--s-3); padding: var(--s-2) var(--s-2) var(--s-2) var(--s-3); gap: var(--s-2); line-height: var(--lh-snug); }
.callout.stall > span { flex: 1; min-width: 0; }
.callout.stall .btn { height: 36px; padding: 0 var(--s-3); flex: none; }

/* Chips (Mehrfachauswahl) */
.chips { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.chip {
  height: 36px; padding: 0 var(--s-3); border-radius: var(--r-full);
  border: 1px solid var(--border); font-size: var(--fs-14); font-weight: 500; color: var(--text-secondary);
  transition: transform var(--dur-fast) var(--ease-out);
}
.chip:active { transform: scale(0.96); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* Muskel-Heatmap */
.seg-sm { flex: none; }
.seg-sm button { height: 32px; padding: 0 var(--s-3); font-size: var(--fs-12); }
.card-head.is-center { align-items: center; }
.mu-sum { margin-top: var(--s-1); font-size: var(--fs-14); color: var(--text-secondary); }
.mu-sum b { color: var(--text-primary); font-weight: 600; }
.body-figs { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); margin-top: var(--s-5); }
.body-fig { margin: 0; text-align: center; }
.body-fig svg { display: block; width: 100%; max-width: 168px; height: auto; margin: 0 auto; overflow: visible; }
.body-fig figcaption { margin-top: var(--s-2); font-size: var(--fs-12); font-weight: 500; color: var(--text-tertiary); letter-spacing: var(--tracking-caps); text-transform: uppercase; }
.sil { fill: var(--bg-inset); stroke: var(--border-subtle); stroke-width: 1; }
.sil-line { fill: none; stroke: var(--border); stroke-width: 1; }
.mu { cursor: pointer; transition: opacity var(--dur-fast) var(--ease-out); }
@media (hover: hover) and (pointer: fine) { .mu:hover { opacity: 0.78; } }
.mu.is-selected { stroke: var(--text-primary); stroke-width: 2.5; }
.heat-legend { display: flex; align-items: center; justify-content: center; gap: var(--s-1); margin-top: var(--s-4); font-size: var(--fs-12); color: var(--text-tertiary); }
.heat-legend i { display: block; width: 16px; height: 8px; border-radius: 2px; }
.heat-legend span:first-child { margin-right: var(--s-1); }
.heat-legend span:last-child { margin-left: var(--s-1); }
.mu-info {
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: var(--s-1) var(--s-2);
  min-height: 44px; margin-top: var(--s-4); padding: var(--s-2) var(--s-3);
  border-radius: var(--r-md); background: var(--bg-inset);
  font-size: var(--fs-14); color: var(--text-secondary); text-align: center; text-wrap: balance;
}
.mu-info b { color: var(--text-primary); font-weight: 600; }
.mu-list { margin-top: var(--s-5); }
.mu-row {
  display: grid; grid-template-columns: 112px minmax(0, 1fr) 72px; align-items: center; gap: var(--s-3);
  width: calc(100% + var(--s-4)); min-height: 40px; margin: 0 calc(var(--s-2) * -1); padding: 0 var(--s-2);
  border-radius: var(--r-sm); text-align: left; font-size: var(--fs-14);
}
.mu-row.is-selected { background: var(--bg-inset); }
@media (hover: hover) and (pointer: fine) { .mu-row:hover { background: var(--bg-hover); } }
.mu-row-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mu-row.is-zero .mu-row-name { color: var(--text-tertiary); }
.mu-row-v { text-align: right; color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mu-bar { height: 8px; border-radius: var(--r-full); background: var(--bg-inset); overflow: hidden; }
.mu-bar i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transform-origin: left center; transition: transform var(--dur-slow) var(--ease-out); }
.mu-bar i.l1 { opacity: 0.35; } .mu-bar i.l2 { opacity: 0.55; } .mu-bar i.l3 { opacity: 0.78; }
.mu-more summary {
  display: flex; align-items: center; gap: var(--s-1); width: max-content; min-height: 40px;
  cursor: pointer; list-style: none; font-size: var(--fs-14); font-weight: 500; color: var(--text-secondary);
}
.mu-more summary::-webkit-details-marker { display: none; }
.mu-more summary .ic { transition: transform var(--dur) var(--ease-out); }
.mu-more[open] summary .ic { transform: rotate(90deg); }
@media (hover: hover) and (pointer: fine) { .mu-more summary:hover { color: var(--text-primary); } }

/* Trainings-Kalender */
.cal-wrap { display: flex; gap: var(--s-2); margin-top: var(--s-4); }
.cal-days, .cal { display: grid; grid-template-rows: 16px repeat(7, 14px); gap: 3px; }
.cal-days { font-size: var(--fs-12); line-height: 14px; color: var(--text-tertiary); }
.cal-scroll {
  flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--s-4)); mask-image: linear-gradient(to right, transparent, #000 var(--s-4));
}
.cal-scroll::-webkit-scrollbar { display: none; }
.cal { grid-auto-columns: 14px; width: max-content; padding-left: var(--s-4); }
.cal-m { font-size: var(--fs-12); line-height: 16px; color: var(--text-tertiary); white-space: nowrap; }
.cal-c { display: block; width: 14px; height: 14px; padding: 0; border-radius: 3px; background: var(--bg-inset); }
.cal-c.l1 { background: color-mix(in srgb, var(--accent) 32%, var(--bg-inset)); }
.cal-c.l2 { background: color-mix(in srgb, var(--accent) 56%, var(--bg-inset)); }
.cal-c.l3 { background: color-mix(in srgb, var(--accent) 80%, var(--bg-inset)); }
.cal-c.l4 { background: var(--accent); }
.cal-c.is-sel { outline: 2px solid var(--text-primary); outline-offset: 1px; }
.cal-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s-2) var(--s-4); margin-top: var(--s-4); }
.cal-info { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-1) var(--s-2); min-height: 32px; font-size: var(--fs-14); color: var(--text-secondary); }
.cal-foot .heat-legend { margin: 0; }
.cal-foot .heat-legend .cal-c { width: 12px; height: 12px; }

/* Jahresrückblick */
.year-card { padding: var(--s-5); background: var(--accent); color: var(--accent-ink); border: 0; }
.year-k { display: block; font-size: var(--fs-12); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; opacity: 0.75; }
.year-t { display: block; margin-top: var(--s-2); font-size: var(--fs-24); font-weight: 700; letter-spacing: var(--tracking-tight); line-height: var(--lh-snug); }
.year-s { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); margin-top: var(--s-1); font-size: var(--fs-14); opacity: 0.85; }
.year-more { display: flex; flex-wrap: wrap; gap: var(--s-2); margin-top: var(--s-3); }

.story {
  position: fixed; inset: 0; z-index: 55; display: flex; flex-direction: column;
  background: var(--bg-app); color: var(--text-primary);
  opacity: 0; transition: opacity var(--dur) var(--ease-out);
}
.story.is-open { opacity: 1; }
.story.is-accent { background: var(--accent); color: var(--accent-ink); }
.story-bars { display: flex; gap: var(--s-1); padding: calc(var(--safe-t) + var(--s-3)) var(--s-4) 0; }
.story-bars i { flex: 1; height: 4px; border-radius: var(--r-full); background: currentColor; opacity: 0.22; }
.story-bars i.is-done { opacity: 1; }
.story-top { display: flex; align-items: center; justify-content: space-between; padding: var(--s-1) var(--s-2) 0 var(--s-4); font-size: var(--fs-14); font-weight: 600; }
.story-top .btn-icon { color: inherit; }
.story-stage { position: relative; flex: 1; overflow: hidden; }
.slide {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
  max-width: 560px; margin: 0 auto; padding: var(--s-8) var(--s-6) calc(var(--s-12) + var(--safe-b));
  opacity: 0; transform: translateY(16px); pointer-events: none;
  transition: opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-out);
}
.slide.is-active { opacity: 1; transform: none; }
.slide-k { font-size: var(--fs-14); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; opacity: 0.7; }
.slide-big { margin-top: var(--s-3); font-size: var(--fs-64); font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.slide-name { margin-top: var(--s-3); font-size: var(--fs-48); font-weight: 700; letter-spacing: var(--tracking-tight); line-height: var(--lh-tight); overflow-wrap: anywhere; }
.slide-t { margin-top: var(--s-4); font-size: var(--fs-24); font-weight: 600; letter-spacing: var(--tracking-snug); line-height: var(--lh-snug); }
.slide-s { margin-top: var(--s-3); font-size: var(--fs-16); opacity: 0.75; }
.slide-bars { display: flex; align-items: flex-end; gap: var(--s-1); height: 136px; margin-top: var(--s-8); }
.slide-bars span { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: var(--s-2); font-size: var(--fs-12); opacity: 0.85; }
.slide-bars i { display: block; width: 100%; min-height: 2px; border-radius: 4px 4px 0 0; background: currentColor; opacity: 0.28; transform-origin: bottom; }
.slide.is-active .slide-bars i { animation: grow var(--dur-slow) var(--ease-out) both; }
.slide-bars i.is-max { background: var(--accent); opacity: 1; }
.story-nav { position: absolute; inset: 0; z-index: 1; display: flex; }
.story-nav button { flex: 1; }
.story-nav button:first-child { flex: 0 0 33%; }
.story-cta { position: relative; z-index: 2; margin-top: var(--s-8); pointer-events: auto; }
.story.is-accent .story-cta { background: var(--accent-ink); color: var(--accent); box-shadow: none; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

/* Zusammenfassung */
.summary-hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--s-2) 0 var(--s-2); }
.summary-icon {
  width: 48px; height: 48px; display: grid; place-items: center; margin-bottom: var(--s-4);
  border-radius: var(--r-full); background: var(--accent-soft); color: var(--accent);
  animation: pop var(--dur-slow) var(--ease-spring);
}
/* Wochenabschluss */
.wrap-card {
  display: flex; align-items: center; gap: var(--s-4); margin-bottom: var(--s-4); padding: var(--s-4); text-align: left;
  background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent);
}
.wrap-card-icon {
  flex: none; width: 44px; height: 44px; display: grid; place-items: center;
  border-radius: var(--r-full); background: var(--accent); color: var(--accent-ink);
}
/* Backup-Erinnerung */
.backup-card { display: flex; align-items: flex-start; gap: var(--s-4); margin-bottom: var(--s-4); padding: var(--s-4); }
.backup-card-icon {
  flex: none; width: 44px; height: 44px; display: grid; place-items: center;
  border-radius: var(--r-full); background: var(--accent-soft); color: var(--accent);
}
.backup-card-actions { display: flex; flex-wrap: wrap; gap: var(--s-2); margin-top: var(--s-3); }
.tip { display: flex; gap: var(--s-3); padding: var(--s-3) var(--s-4); }
.tip + .tip { border-top: 1px solid var(--bg-surface); }
.tip-icon { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r-full); }
.tip-icon.is-down { background: var(--danger-soft); color: var(--danger); }
.tip-icon.is-warn { background: var(--accent-soft); color: var(--accent); }
.tip-icon.is-up { background: var(--success-soft); color: var(--success); }
.tip-body { min-width: 0; }
.tip-body b { display: block; font-weight: 600; }
.tip-body span { display: block; margin-top: var(--s-1); font-size: var(--fs-14); color: var(--text-secondary); }
.tip-body .tip-src { display: block; margin-top: var(--s-2); font-size: var(--fs-12); color: var(--text-tertiary); }

/* Leistungsbericht */
.report-btn { display: flex; align-items: center; gap: var(--s-4); margin-top: var(--s-4); padding: var(--s-4); text-align: left; }
.report-btn + .ex-wrap { margin-top: var(--s-4); }
.report-btn-icon {
  flex: none; width: 44px; height: 44px; display: grid; place-items: center;
  border-radius: var(--r-full); background: var(--accent-soft); color: var(--accent);
}
.report-btn-k { display: block; font-size: var(--fs-12); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-tertiary); }
.report-btn-t { display: block; margin-top: var(--s-1); font-size: var(--fs-16); font-weight: 600; }
.tone-up { background: var(--success-soft) !important; color: var(--success) !important; }
.tone-down { background: var(--bg-inset) !important; color: var(--text-secondary) !important; }
.tone-pr { background: var(--record-soft) !important; color: var(--record) !important; box-shadow: inset 0 0 0 1px var(--record-edge); }
.report-hero-t { margin-top: var(--s-2); font-size: var(--fs-24); font-weight: 700; letter-spacing: var(--tracking-tight); line-height: var(--lh-snug); }
.summary-hero .eyebrow { font-size: var(--fs-12); font-weight: 500; color: var(--text-tertiary); }
.summary-time { font-size: var(--fs-48); font-weight: 700; letter-spacing: var(--tracking-tight); line-height: var(--lh-tight); font-variant-numeric: tabular-nums; }
.summary-sub { margin-top: var(--s-2); font-size: var(--fs-14); color: var(--text-secondary); text-wrap: pretty; }
.summary-meta { margin-top: var(--s-3); font-size: var(--fs-12); font-weight: 500; color: var(--text-tertiary); }

/* Rekorde im Bericht: der Höhepunkt nach dem Training */
.pr-list { display: grid; gap: var(--s-2); }
.pr-card {
  display: grid; gap: var(--s-1); padding: var(--s-4);
  background: var(--record-soft); border-radius: var(--r-md);
  box-shadow: inset 0 0 0 1px var(--record-edge), inset 0 1px 0 var(--border-top);
  animation: rise var(--dur-slow) var(--ease-out) both; animation-delay: calc(120ms + var(--i, 0) * 90ms);
}
.pr-card-name { display: flex; align-items: center; gap: var(--s-2); font-size: var(--fs-14); font-weight: 600; }
.pr-card-name .ic { color: var(--record); }
.pr-card-val { font-family: var(--font-mono); font-size: var(--fs-32); font-weight: 600; letter-spacing: var(--tracking-snug); line-height: var(--lh-tight); font-variant-numeric: tabular-nums; }
.pr-card-was { font-size: var(--fs-12); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.row-icon { flex: none; color: var(--text-secondary); }
.row-icon.is-accent { color: var(--record); }

.sets { margin: 0 calc(var(--s-1) * -1); }
.sets-grid {
  display: grid; grid-template-columns: 28px minmax(0, 1fr) 72px 72px var(--tap);
  gap: var(--s-2); align-items: center; padding: 0 var(--s-1);
}
.sets-head { padding-bottom: var(--s-2); font-size: var(--fs-12); font-weight: 500; color: var(--text-tertiary); }
.sets-head span:nth-child(3), .sets-head span:nth-child(4) { text-align: center; }
.set-swipe { border-radius: var(--r-md); }
.set-swipe + .set-swipe { margin-top: var(--s-1); }
.set {
  position: relative; padding-top: var(--s-1); padding-bottom: var(--s-1);
  border-radius: var(--r-md); background-color: var(--bg-surface); touch-action: pan-y;
}
.set-idx {
  display: grid; place-items: center; width: 100%; height: var(--tap); border-radius: var(--r-sm);
  font-family: var(--font-mono); font-size: var(--fs-14); font-weight: 500; text-align: center; color: var(--text-tertiary);
  transition: background-color var(--dur-fast) var(--ease-out);
}
.set-idx:active { background: var(--bg-press); }
@media (hover: hover) and (pointer: fine) { .set-idx:hover { background: var(--bg-hover); color: var(--text-primary); } }
.set.is-warm .set-idx { color: var(--text-secondary); font-weight: 600; }
.set.is-warm .num-input:not(:focus) { color: var(--text-secondary); }
.set.is-warm.is-done { background-image: linear-gradient(var(--bg-inset), var(--bg-inset)); }   /* Aufwärmen: erledigt, aber ohne Glut */
.set.is-warm.is-done .set-idx { color: var(--text-secondary); }
.set-prev {
  min-height: var(--tap); line-height: var(--tap); text-align: left; font-size: var(--fs-14); color: var(--text-tertiary);
  font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
button.set-prev:active { color: var(--text-primary); }
@media (hover: hover) and (pointer: fine) { button.set-prev:hover { color: var(--text-primary); } }
.num-input {
  width: 100%; height: var(--tap); padding: 0; text-align: center;
  background: var(--bg-inset); border: 1px solid transparent; border-radius: var(--r-sm);
  font-size: var(--fs-20); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: var(--tracking-snug);
  -moz-appearance: textfield;
}
.num-input::-webkit-outer-spin-button, .num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.num-input::placeholder { color: var(--text-tertiary); font-weight: 500; }
.num-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--bg-surface); }
@media (hover: hover) and (pointer: fine) { .num-input:hover:not(:focus) { border-color: var(--border); } }
.check-btn {
  width: var(--tap); height: var(--tap); display: grid; place-items: center; border-radius: var(--r-sm);
  border: 1px solid var(--border); color: var(--text-tertiary);
  transition: transform var(--dur-fast) var(--ease-out);
}
.check-btn:active { transform: scale(0.92); }
@media (hover: hover) and (pointer: fine) { .check-btn:hover { color: var(--text-primary); background: var(--bg-hover); } }
.set.is-done { background-image: linear-gradient(var(--accent-soft), var(--accent-soft)); }
.set.is-done .set-idx { color: var(--accent); }
.set.is-done .set-prev { color: var(--text-secondary); }   /* Kontrast auf dem Ember-Schimmer */
.set.is-done .num-input:not(:focus) { background: transparent; }
.set.is-done .check-btn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.set.just-done .check-btn { animation: pop var(--dur-slow) var(--ease-spring); }
/* Abhaken: Die Glut breitet sich vom Daumen (Haken rechts) über die Zeile aus, der Haken zeichnet sich */
.set.just-done { background-repeat: no-repeat; background-position: right center; animation: ember-fill 420ms var(--ease-out); }
.set.just-done .check-btn .ic { animation: draw-check 320ms var(--ease-out) 60ms both; }
.ex.just-complete .ex-meta { animation: meta-flash 900ms var(--ease-out); }
.set.just-added, .ex-wrap.just-added { animation: rise var(--dur-slow) var(--ease-out); }
.bar > i { position: relative; overflow: hidden; }
.bar.is-advancing > i::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent-ink) 55%, transparent), transparent);
  animation: sheen 700ms var(--ease-out);
}
@keyframes ember-fill { from { background-size: 0% 100%; } to { background-size: 100% 100%; } }
@keyframes draw-check { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes meta-flash { 0%, 40% { color: var(--accent); } 100% { color: var(--text-secondary); } }
@keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.add-set { margin-top: var(--s-2); }

/* =====================================================================
   UNTEN FIXIERT: Pausentimer + Eingabeleiste
   ===================================================================== */
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none; }
.bottom > * { pointer-events: auto; }
.timer-wrap { padding: 0 var(--page-x); }
.timer {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: var(--s-3);
  max-width: var(--content-w); height: 56px; margin: 0 auto var(--s-3); padding: 0 var(--s-2) 0 var(--s-4);
  background: var(--bg-elevated); border: 1px solid var(--border); border-top-color: var(--border-strong);
  border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
  animation: rise var(--dur-slow) var(--ease-out);
}
.timer > .ic { color: var(--accent); }
.timer-label { font-size: var(--fs-14); color: var(--text-secondary); }
.timer-time { flex: 1; font-family: var(--font-mono); font-size: var(--fs-32); font-weight: 600; line-height: 1; letter-spacing: var(--tracking-tight); font-variant-numeric: tabular-nums; }
.timer-actions { display: flex; gap: var(--s-1); }
.timer-actions .btn { padding: 0 var(--s-3); font-variant-numeric: tabular-nums; }
.timer-track { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--border-subtle); }
.timer-track > i { display: block; height: 100%; background: var(--accent); transform-origin: left center; }
/* Endzustand: „Pause vorbei“ steht kurz auf Ember-Grund, die Zeit weicht einem „Los“ */
.timer.is-over, body.in-workout .timer.is-over { background: var(--accent-soft); }
.timer.is-over .timer-time { color: var(--accent); animation: pop var(--dur-slow) var(--ease-spring); }
.timer.is-over .timer-label { color: var(--text-primary); font-weight: 600; }
.timer.is-over .timer-actions .btn { display: none; }
.timer.is-over .timer-track > i { transform: scaleX(1) !important; transition: none !important; }

.dock {
  padding: var(--s-3) var(--page-x) calc(var(--s-3) + var(--safe-b));
  background: var(--glass); border-top: 1px solid var(--border-subtle);
  -webkit-backdrop-filter: saturate(1.4) blur(16px); backdrop-filter: saturate(1.4) blur(16px);
}
.dock-inner { max-width: var(--content-w); margin: 0 auto; }
.dock-row { display: flex; gap: var(--s-2); }
.dock-add { width: 48px; height: 48px; padding: 0; flex: none; }
.dock-finish { height: 48px; padding: 0 var(--s-3); flex: none; }

/* Im Workout: Pausentimer und Eingabeleiste als eine Fläche */
body.in-workout .timer-wrap {
  background: var(--glass); border-top: 1px solid var(--border-subtle);
  -webkit-backdrop-filter: saturate(1.4) blur(16px); backdrop-filter: saturate(1.4) blur(16px);
  animation: rise var(--dur-slow) var(--ease-out);
}
body.in-workout .timer {
  height: 60px; margin-bottom: 0; padding-left: 0;
  background: none; border: 0; border-radius: 0; box-shadow: none; animation: none;
}
body.in-workout.has-timer .dock { border-top-color: transparent; padding-top: var(--s-2); }

/* =====================================================================
   NAVIGATION
   ===================================================================== */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(3, 1fr);
  height: calc(64px + var(--safe-b)); padding: var(--s-2) var(--s-2) calc(var(--s-2) + var(--safe-b));
  background: var(--glass); border-top: 1px solid var(--border-subtle);
  -webkit-backdrop-filter: saturate(1.4) blur(16px); backdrop-filter: saturate(1.4) blur(16px);
}
.nav-brand { display: none; }
.nav-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-1);
  border-radius: var(--r-md); font-size: var(--fs-12); font-weight: 500; color: var(--text-tertiary);
  transition: transform var(--dur-fast) var(--ease-out);
}
.nav-item:active { transform: scale(0.96); }
.nav-item[aria-current="page"] { color: var(--text-primary); }
.nav-item[aria-current="page"] .ic { color: var(--accent); }
body.in-workout .nav { display: none; }
body:not(.in-workout) .bottom { bottom: calc(64px + var(--safe-b)); }

@media (min-width: 960px) {
  .nav {
    top: 0; right: auto; width: var(--nav-w); height: auto;
    display: flex; flex-direction: column; gap: var(--s-1);
    padding: var(--s-6) var(--s-4);
    background: var(--bg-app); border-top: 0; border-right: 1px solid var(--border-subtle);
    -webkit-backdrop-filter: none; backdrop-filter: none;
  }
  body.in-workout .nav { display: flex; }
  .nav-brand {
    display: flex; align-items: center; gap: var(--s-3);
    padding: 0 var(--s-2) var(--s-8); font-size: var(--fs-16); font-weight: 600; letter-spacing: var(--tracking-snug);
  }
  .brand-mark {
    width: 32px; height: 32px; border-radius: var(--r-md); display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 1px 0 var(--highlight), var(--shadow-sm);
  }
  .nav-item {
    flex-direction: row; justify-content: flex-start; gap: var(--s-3);
    height: 40px; padding: 0 var(--s-3); font-size: var(--fs-14); color: var(--text-secondary);
  }
  .nav-item[aria-current="page"] {
    background: var(--bg-surface); color: var(--text-primary);
    box-shadow: inset 0 0 0 1px var(--border-subtle), var(--shadow-sm);
  }
  main { margin-left: var(--nav-w); }
  .bottom { left: var(--nav-w); }
  body:not(.in-workout) .bottom { bottom: 0; }
}
@media (min-width: 960px) and (hover: hover) and (pointer: fine) {
  .nav-item:hover:not([aria-current="page"]) { background: var(--bg-hover); color: var(--text-primary); }
}

/* =====================================================================
   SHEET / DIALOG
   ===================================================================== */
.sheet-backdrop {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: flex-end; justify-content: center;
  background: var(--backdrop);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  opacity: 0; transition: opacity var(--dur) var(--ease-out);
}
.sheet-backdrop.is-open { opacity: 1; }
/* Hintergrund darf nicht mitscrollen; nur der Inhalt des Sheets scrollt */
.sheet-backdrop { touch-action: none; overscroll-behavior: contain; }
.sheet-body { touch-action: pan-y; }
body.scroll-locked { position: fixed; left: 0; right: 0; overflow: hidden; }
.sheet.is-dragging { transition: none; }
/* Zieh-Fortschritt nur am Hintergrund; nicht vererben, sonst rechnet der Browser bei jeder Bewegung den ganzen Fensterinhalt neu */
@property --drag { syntax: '<number>'; inherits: false; initial-value: 0; }
.sheet-backdrop[style*="--drag"] { background: color-mix(in srgb, var(--backdrop) calc((1 - var(--drag)) * 100%), transparent); }
.sheet {
  display: flex; flex-direction: column;
  width: 100%; max-width: 560px; max-height: min(78dvh, 760px);   /* oben bleibt sichtbar Seite stehen: es ist ein Blatt, keine neue Seite */
  background: var(--bg-elevated);
  border: 1px solid var(--border); border-bottom: 0; border-top-color: var(--border-strong);
  border-radius: var(--r-lg) var(--r-lg) 0 0; box-shadow: var(--shadow-lg);
  transform: translateY(32px); transition: transform var(--dur-slow) var(--ease-out);
}
.sheet-backdrop.is-open .sheet { transform: none; }
.sheet-backdrop.is-full .sheet { height: calc(100dvh - var(--safe-t) - var(--s-3)); max-height: none; }
.sheet-grip { width: 36px; height: 4px; margin: var(--s-2) auto 0; border-radius: var(--r-full); background: var(--border-strong); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); padding: var(--s-2) var(--s-2) 0 var(--s-5); }
.sheet-title { min-width: 0; font-size: var(--fs-20); font-weight: 600; letter-spacing: var(--tracking-snug); }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: var(--s-3) var(--s-5) calc(var(--s-6) + var(--safe-b)); }
.sheet-body > * + * { margin-top: var(--s-4); }
.sheet-body > .section-label { margin-top: var(--s-6); margin-bottom: 0; }
.sheet-body > .section-label + * { margin-top: var(--s-3); }
@media (min-width: 640px) {
  .sheet-backdrop { align-items: center; padding: var(--s-6); }
  .sheet { border-radius: var(--r-lg); border-bottom: 1px solid var(--border); transform: translateY(8px) scale(0.98); }
  .sheet-grip { display: none; }
  .sheet-head { padding-top: var(--s-3); }
  .sheet-body { padding-bottom: var(--s-6); }
  .sheet-backdrop.is-full .sheet { height: auto; max-height: min(92vh, 960px); max-width: 600px; }
}

.menu { margin: 0 calc(var(--s-2) * -1); }
.menu-item {
  display: flex; align-items: center; gap: var(--s-3);
  width: 100%; min-height: 56px; padding: var(--s-2); border-radius: var(--r-md);
  font-size: var(--fs-16); font-weight: 500; text-align: left;
}
.menu-item .ic { color: var(--text-secondary); }
.menu-item small { display: block; font-size: var(--fs-14); font-weight: 400; color: var(--text-secondary); }
.menu-item.is-danger, .menu-item.is-danger .ic { color: var(--danger); }
.menu-item:active { background: var(--bg-press); }

/* Text und Aktionen in Entscheidungs-Sheets */
.sheet-text { font-size: var(--fs-14); color: var(--text-secondary); text-wrap: pretty; }
.sheet-body > .sheet-actions { margin-top: var(--s-6); }
.sheet-actions { display: flex; flex-direction: column; gap: var(--s-2); }
.sheet-body > .field-error { margin-bottom: 0; }

/* Vorher/Nachher-Vergleich (Import) */
.cmp { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--s-2); }
.cmp-col { display: flex; flex-direction: column; gap: var(--s-1); padding: var(--s-3) var(--s-4); background: var(--bg-inset); border-radius: var(--r-md); }
.cmp-label { font-size: var(--fs-12); font-weight: 500; color: var(--text-tertiary); }
.cmp-num { font-family: var(--font-mono); font-size: var(--fs-24); font-weight: 600; font-variant-numeric: tabular-nums; line-height: var(--lh-snug); }
.cmp-sub { font-size: var(--fs-12); color: var(--text-secondary); }
.cmp-arrow { color: var(--text-tertiary); }

/* Offene Sätze beim Beenden */
.open-sets { display: flex; align-items: baseline; gap: var(--s-3); }
.open-sets-num { font-family: var(--font-mono); font-size: var(--fs-48); font-weight: 600; line-height: var(--lh-tight); font-variant-numeric: tabular-nums; }
.open-sets-text { font-size: var(--fs-14); color: var(--text-secondary); text-wrap: pretty; }
@media (hover: hover) and (pointer: fine) { .menu-item:hover { background: var(--bg-hover); } }

/* =====================================================================
   FORTSCHRITT · Diagramm · Wochenbericht
   ===================================================================== */
.report { padding: var(--s-4) var(--s-4) var(--s-4); }
.report-title { display: block; margin-top: var(--s-2); font-size: var(--fs-20); font-weight: 600; letter-spacing: var(--tracking-snug); line-height: var(--lh-snug); }
.report-text { display: block; margin-top: var(--s-1); font-size: var(--fs-14); color: var(--text-secondary); }
.report .metrics { margin-top: var(--s-4); padding-top: var(--s-4); border-top: 1px solid var(--border-subtle); }

.chart-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--s-1) var(--s-3); }
.chart-value { font-size: var(--fs-32); font-weight: 700; letter-spacing: var(--tracking-tight); line-height: var(--lh-tight); font-variant-numeric: tabular-nums; }
.chart-head .delta { margin-top: 0; }
.chart { position: relative; margin-top: var(--s-2); }
.chart svg { display: block; overflow: visible; touch-action: pan-y; }
.ch-axis { fill: var(--text-tertiary); font-size: 12px; font-family: var(--font-mono); }
.chart-empty {
  display: grid; place-items: center; height: 120px; padding: 0 var(--s-6); text-align: center;
  background: var(--bg-inset); border-radius: var(--r-md); font-size: var(--fs-14); color: var(--text-secondary);
}
.ch-tip {
  position: absolute; z-index: 2; pointer-events: none; max-width: 240px;
  padding: var(--s-2) var(--s-3);
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-md);
  font-size: var(--fs-12); line-height: var(--lh-snug);
}
.ch-tip span { display: block; color: var(--text-secondary); }
.ch-tip b { display: block; margin: var(--s-1) 0; font-size: var(--fs-14); font-weight: 600; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); }
.tile { padding: var(--s-3) var(--s-4); background: var(--bg-inset); border-radius: var(--r-md); }
.metric-inline { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: var(--s-3) var(--s-4); background: var(--bg-inset); border-radius: var(--r-md); }
.metric-inline .metric + .metric { border-left-color: var(--border); }

.week-nav { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
.week-nav-label { text-align: center; }
.week-nav-label b { display: block; font-size: var(--fs-16); font-weight: 600; }
.week-nav-label span { font-size: var(--fs-14); color: var(--text-secondary); }

.hist { padding: var(--s-3) 0; }
.hist + .hist { border-top: 1px solid var(--border-subtle); }
.hist-date { font-size: var(--fs-14); font-weight: 500; }
.hist-sets { margin-top: var(--s-1); font-size: var(--fs-14); color: var(--text-secondary); font-variant-numeric: tabular-nums; word-spacing: 2px; }

.note { font-size: var(--fs-12); color: var(--text-tertiary); text-align: center; }

/* Einstellungen */
.setting { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); min-height: 64px; padding: var(--s-3) var(--s-4); }
.setting + .setting { border-top: 1px solid var(--border-subtle); }
.setting-text { min-width: 0; }
.setting-text b { display: block; font-weight: 500; }
.setting-text small { display: block; font-size: var(--fs-14); color: var(--text-secondary); }
.setting .seg { flex: none; }
.setting-stack { flex-direction: column; align-items: stretch; }
.setting-stack .seg { width: 100%; }
@media (min-width: 480px) { .setting-stack { flex-direction: row; align-items: center; } .setting-stack .seg { width: auto; } }

/* =====================================================================
   TOAST
   ===================================================================== */
body { --toast-b: calc(80px + var(--safe-b)); }
body.in-workout { --toast-b: calc(88px + var(--safe-b)); }
body.has-timer { --toast-b: calc(148px + var(--safe-b)); }
body.in-workout.has-timer { --toast-b: calc(136px + var(--safe-b)); }
@media (min-width: 960px) {
  body { --toast-b: var(--s-6); }
  body.has-timer { --toast-b: 92px; }
  body.in-workout { --toast-b: 96px; }
  body.in-workout.has-timer { --toast-b: 144px; }
}
.toast {
  position: fixed; left: 50%; bottom: var(--toast-b); z-index: 60;
  display: flex; align-items: center; gap: var(--s-3);
  width: max-content; max-width: min(440px, calc(100vw - var(--s-8))); min-height: 48px; padding: var(--s-3) var(--s-4);
  background: var(--bg-elevated); color: var(--text-primary);
  border: 1px solid var(--border); border-top-color: var(--border-strong); border-radius: var(--r-md);
  box-shadow: var(--shadow-lg); font-size: var(--fs-14); font-weight: 500;
  opacity: 0; transform: translate(-50%, 8px);
  transition: opacity var(--dur) var(--ease-out), transform var(--dur) var(--ease-out);
}
@media (min-width: 960px) { .toast { left: calc(50% + var(--nav-w) / 2); } }
.toast.is-shown { opacity: 1; transform: translate(-50%, 0); }
.toast-success > .ic { color: var(--success); }
.toast-error > .ic { color: var(--danger); }
.toast-msg { min-width: 0; }
.toast-action {
  flex: none; height: 32px; margin-right: calc(var(--s-2) * -1); padding: 0 var(--s-2);
  border-radius: var(--r-sm); color: var(--accent); font-weight: 600;
}
.toast-action::before { content: ""; position: absolute; inset: 0; } /* ganze Fläche tippbar */
@media (hover: hover) and (pointer: fine) { .toast-action:hover { background: var(--accent-soft); } }

/* =====================================================================
   ANIMATIONEN
   ===================================================================== */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { 0% { transform: scale(0.82); } 100% { transform: scale(1); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.toast-pr > .ic { color: var(--record); }
/* Seitenwechsel: Abschnitte gleiten aus der Richtung des Tabs herein, leicht versetzt (gesamt ≤ 310 ms) */
.view.is-entering > * { animation: view-in 220ms var(--ease-out) both; }
.view.is-entering > :nth-child(2) { animation-delay: 30ms; }
.view.is-entering > :nth-child(3) { animation-delay: 60ms; }
.view.is-entering > :nth-child(n+4) { animation-delay: 90ms; }
.view.is-entering { --dx: 0px; }
.view.from-right { --dx: 24px; }
.view.from-left { --dx: -24px; }
@keyframes view-in { from { opacity: 0; transform: translate3d(var(--dx), 6px, 0); } to { opacity: 1; transform: none; } }
.nav-item .ic { transition: color var(--dur-fast) var(--ease-out); }
.nav-item.just-selected .ic { animation: nav-bump 360ms var(--ease-spring); }
@keyframes nav-bump { 0% { transform: scale(1); } 40% { transform: scale(1.18) translateY(-2px); } 100% { transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important;
    transition-duration: 1ms !important; scroll-behavior: auto !important;
  }
}
</style>

<body>

<script>
/* =====================================================================
   Icons (ein Set, Lucide-Stil, 1.75px Strich)
   ===================================================================== */
const PATHS = {
  'chevron-left': '<path d="m15 18-6-6 6-6"/>',
  'chevron-right': '<path d="m9 18 6-6-6-6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  help: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  dumbbell: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',
  chart: '<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>',
  sliders: '<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  timer: '<path d="M10 2h4M12 14l3-3"/><circle cx="12" cy="14" r="8"/>',
  trash: '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  repeat: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  'arrow-up': '<path d="M12 19V5M5 12l7-7 7 7"/>',
  'arrow-down': '<path d="M12 5v14M19 12l-7 7-7-7"/>',
  minus: '<path d="M5 12h14"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/>',
  up: '<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',
  down: '<path d="m22 17-8.5-8.5-5 5L2 7"/><path d="M16 17h6v-6"/>',
  equal: '<path d="M5 9h14M5 15h14"/>',
  'check-circle': '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
  trophy: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
  grip: '<circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/>',
  flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
  resume: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  share: '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/>',
  note: '<path d="M15 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M15 3v5h5M8 13h8M8 17h5"/>',
  swap: '<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>'
};
const ic = (n, s = 20) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[n]}</svg>`;
document.querySelectorAll('[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic, +el.dataset.size || 20); });

/* =====================================================================
   Daten
   ===================================================================== */
const KEY = 'trainings-tracker-v1';
let data = load();
const state = { view: null, tab: 'home', workoutId: null, justDone: null, justAdded: null };
let saveWarned = false;

function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch {}
  return sanitizeData(d).data;
}

/** Prüft und bereinigt Daten (Speicher und Import): nur bekannte Felder mit gültigen Typen kommen durch.
    Liefert die bereinigten Daten und wie viele Einträge repariert oder verworfen wurden. */
function sanitizeData(raw) {
  let fixed = 0;
  const obj = v => v && typeof v === 'object' && !Array.isArray(v);
  const str = (v, max) => (typeof v === 'string' ? v.slice(0, max) : '');
  const time = v => (Number.isFinite(v) && v > 0 && v < 8.64e15 ? v : undefined);
  const val = v => {                                   // Wdh./kg: Zahl ≥ 0 oder leer
    if (v === '' || v == null) return '';
    const n = typeof v === 'number' ? v : typeof v === 'string' && /^\s*\d*([.,]\d*)?\s*$/.test(v) ? parseFloat(v.replace(',', '.')) : NaN;
    if (Number.isFinite(n) && n >= 0 && n <= 100000) return n;
    fixed++; return '';
  };
  const validDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + 'T12:00:00'));
  const ids = new Set();
  const workouts = [];
  for (const w of (obj(raw) && Array.isArray(raw.workouts) ? raw.workouts : [])) {

/* ---------- Lernender Vorschlag: welches Workout ist als Nächstes dran? ----------
   Drei Signale aus dem eigenen Verlauf, jüngere Wochen zählen stärker (×0,8 pro Woche):
   1. Wochentag: dasselbe Workout an mindestens 3 der letzten Termine dieses Wochentags und ≥ 60 % Anteil.
   2. Reihenfolge: auf das letzte Workout folgte mindestens 2-mal und zu ≥ 60 % dasselbe.
   3. Sonst: das, dessen letzte Ausführung am längsten her ist (letzte 5 Wochen zuerst). */
const LEARN_WEEKS = 8, LEARN_SHARE = 0.6;
function suggestions(t = today()) {
  const key = w => w.name.trim().toLowerCase();
  const named = data.workouts
    .filter(w => (w.name || '').trim() && w.exercises.length && !isActive(w) && w.date <= t)
    .sort((a, b) => a.date.localeCompare(b.date) || (a.created || 0) - (b.created || 0));
  if (!named.length) return [];
  const last = new Map();                                   // jüngste Ausführung je Vorlage
  for (const w of named) last.set(key(w), w);
  const weekAge = d => (toDate(t) - toDate(d)) / (7 * 864e5);
  const weight = d => Math.pow(0.8, weekAge(d));
  const hist = named.filter(w => w.date >= addDays(t, -LEARN_WEEKS * 7));

  /* 1. Wochentag (nur frühere Tage, heute zählt nicht mit) */
  const wd = toDate(t).getDay(), day = new Map();
  let dayTotal = 0;
  for (const w of hist) {
    if (w.date >= t || toDate(w.date).getDay() !== wd) continue;
    const e = day.get(key(w)) || { w: 0, n: 0 };
    e.w += weight(w.date); e.n++; dayTotal += weight(w.date);
    day.set(key(w), e);
  }
  /* 2. Reihenfolge: Übergänge zwischen aufeinanderfolgenden, verschiedenen Workouts */
  const next = new Map();
  for (let i = 1; i < hist.length; i++) {
    const a = key(hist[i - 1]), b = key(hist[i]);
    if (a === b) continue;
    const m = next.get(a) || new Map(), e = m.get(b) || { w: 0, n: 0 };
    e.w += weight(hist[i].date); e.n++;
    m.set(b, e); next.set(a, m);
  }
  const prev = named.at(-1), from = next.get(key(prev));
  const fromTotal = from ? [...from.values()].reduce((s, e) => s + e.w, 0) : 0;

  /* 3. Fälligkeit */
  const cutoff = addDays(t, -35);
  const temps = [...last.values()];
  const maxAge = Math.max(1, ...temps.filter(w => w.date >= cutoff).map(w => weekAge(w.date)));

  return temps.map(w => {
    const k = key(w), recent = w.date >= cutoff;
    if (w.date === t) return { w, score: -1, why: '' };        // heute schon gemacht
    const d = day.get(k), f = from && from.get(k);
    const dayShare = d && d.n >= 3 ? d.w / dayTotal : 0;
    const seqShare = f && f.n >= 2 ? f.w / fromTotal : 0;
    const byDay = dayShare >= LEARN_SHARE ? 2 * dayShare : 0;
    const bySeq = seqShare >= LEARN_SHARE ? 1.5 * seqShare : 0;
    const byAge = recent ? 0.5 * weekAge(w.date) / maxAge : 0;
    const why = byDay && byDay >= bySeq ? `${WEEKDAYS[wd]}s meist dran`
      : bySeq ? `Folgt meist auf ${prev.name.trim()}` : '';
    return { w, score: byDay + bySeq + byAge + (recent ? 0.01 : 0), why };
  }).sort((a, b) => b.score - a.score || a.w.date.localeCompare(b.w.date)).slice(0, 6);
}
const templatesByDue = () => suggestions().map(s => s.w);
/** Neues Workout für heute: aus einer Routine (gleichnamige Routine hat Vorrang), als Kopie einer Vorlage oder leer */
function startWorkout(src, { name, date = today(), routine } = {}) {
  const r = routine || routineFor(src ? src.name : name);

  data.workouts.push(w); save(); closeSheet(true); openWorkout(w.id);
}
