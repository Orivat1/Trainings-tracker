function openWeekWrap(mon) {
  const r = weekWrap(mon), r1 = v => Math.round(v * 10) / 10;
  const days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
  const vsAvg = (cur, avg, fmt) => {
    if (!avg) return '<span class="delta delta-eq">kein Ø</span>';
    const p = Math.round((cur - avg) / avg * 100);
    if (Math.abs(p) < 2) return `<span class="delta delta-eq">${ic('equal', 14)}im Schnitt · Ø ${fmt(avg)}</span>`;
    return `<span class="delta ${p > 0 ? 'delta-up' : 'delta-down'}">${ic(p > 0 ? 'up' : 'down', 14)}${p > 0 ? '+' : '−'}${Math.abs(p)} % · Ø ${fmt(avg)}</span>`;
  };
  const tile = (label, value, vs) => `<div class="tile"><span class="metric-label">${label}</span><span class="metric-value">${value}</span>${r.have ? vs : ''}</div>`;
  const section = (title, items, cls) => items.length ? `
    <h3 class="section-label">${title} · ${items.length}</h3>
    <div class="list-inset">${items.map(i => `<div class="row">
      <span class="row-main"><span class="row-title">${esc(i.name)}</span><span class="row-sub">${esc(i.from)} → <b style="color:var(--text-primary);font-weight:600">${esc(i.to)}</b></span></span>
      ${i.diff ? `<span class="delta delta-${cls}" style="margin:0">${ic(cls === 'up' ? 'up' : 'down', 14)}${esc(i.diff)}</span>` : ''}
    </div>`).join('')}</div>` : '';
  const names = a => a.map(i => esc(i.name)).join(', ');
  const notes = [r.same.length ? `Auf deinem Durchschnittsniveau: ${names(r.same)}.` : '', r.added.length ? `Neu dabei: ${names(r.added)}.` : ''].filter(Boolean);
  const icn = r.tone === 'up' ? 'up' : r.tone === 'down' ? 'down' : 'flag';

  const sheet = openSheet('Wochenabschluss', `
    <div class="summary-hero">
      <div class="summary-icon ${r.tone === 'eq' ? '' : 'tone-' + r.tone}">${ic(icn, 22)}</div>
      <p class="eyebrow">KW ${isoWeek(mon)} · ${weekRange(mon)}</p>
      <div class="report-hero-t">${esc(r.title)}</div>
      <p class="summary-sub" style="max-width:38ch">${esc(r.text)}</p>
    </div>
    <div>
      <div class="week" role="list">${days.map(d => dayCell(d, r.cur.dates.has(d))).join('')}</div>
      ${weekLegend()}
    </div>
    <div class="tiles">
      ${tile('Workouts', r.cur.workouts, vsAvg(r.cur.workouts, r.avg.workouts, v => num(r1(v))))}
      ${tile('Sätze', r.cur.sets, vsAvg(r.cur.sets, r.avg.sets, v => num(Math.round(v))))}
      ${tile('Wiederholungen', num(r.cur.reps), vsAvg(r.cur.reps, r.avg.reps, v => num(Math.round(v))))}
      ${tile('Volumen', fmtVol(r.cur.volume), vsAvg(r.cur.volume, r.avg.volume, fmtVol))}
    </div>
    ${r.have ? `<p class="note">Durchschnitt der letzten ${plural(r.priorCount, 'Woche', 'Wochen')} (ab Trainingsbeginn)</p>` : ''}
    ${section('Verbessert gegenüber deinem Schnitt', r.improved, 'up')}
    ${section('Unter deinem Schnitt', r.declined, 'down')}
    ${notes.length ? `<p class="note" style="text-align:left;margin-top:var(--s-4)">${notes.join(' ')}</p>` : ''}
    <h3 class="section-label">Worauf du nächste Woche achten solltest</h3>
    <div class="list-inset">${r.tips.map(t => `<div class="tip"><span class="tip-icon is-${t.tone}">${ic(t.icon, 18)}</span>
      <span class="tip-body"><b>${esc(t.title)}</b><span>${esc(t.text)}</span>${t.src ? `<small class="tip-src">Quelle: ${esc(t.src)}</small>` : ''}</span></div>`).join('')}</div>
    <p class="note" style="text-align:left">Die Tipps beruhen auf der ACSM-Leitlinie 2026 und Metaanalysen. Sie gelten für gesunde Erwachsene und ersetzen keine persönliche Beratung.</p>
    <div class="callout">${ic('flag', 18)}<span>Ziel für nächste Woche: <b>${plural(r.goal, 'Workout', 'Workouts')}</b>${r.have ? ` (Ø ${num(r1(r.avg.workouts))})` : ''}</span></div>
    <button class="btn btn-primary btn-lg btn-block" data-close style="margin-top:var(--s-6)">Fertig</button>
  `);
  sheet.querySelector('.callout').style.marginTop = 'var(--s-4)';
}

/* =====================================================================
   Anschauliche Tonnage
   ===================================================================== */
const TONNAGE = [
  [400000, 'ein Jumbojet', 'Jumbojets'], [150000, 'ein Blauwal', 'Blauwale'], [40000, 'ein Sattelzug', 'Sattelzüge'],
  [12000, 'ein Linienbus', 'Linienbusse'], [6000, 'ein Elefant', 'Elefanten'], [2300, 'ein Nashorn', 'Nashörner'],
  [1000, 'ein Kleinwagen', 'Kleinwagen'], [500, 'ein Eisbär', 'Eisbären'], [250, 'ein Klavier', 'Klaviere'],
  [80, 'ein Kühlschrank', 'Kühlschränke'], [30, 'ein Golden Retriever', 'Golden Retriever']
];
/** „so schwer wie 2 Nashörner“ – oder leer bei sehr wenig Gewicht */
function tonnage(kg) {
  const t = TONNAGE.find(([w]) => kg >= w * 0.9);
  if (!t) return '';
  const n = Math.max(1, Math.round(kg / t[0]));
  return `so schwer wie ${n === 1 ? t[1] : `${n.toLocaleString('de-DE')} ${t[2]}`}`;
}
const tonnageCallout = (kg, lead) => tonnage(kg)
  ? `<div class="callout">${ic('dumbbell', 18)}<span>${lead} <b>${fmtVol(kg)}</b> bewegt – ${tonnage(kg)}.</span></div>` : '';

/* =====================================================================
   Muskel-Heatmap
   ===================================================================== */
const MUSCLES = {
  chest: 'Brust', shoulders: 'Schultern', biceps: 'Bizeps', triceps: 'Trizeps', forearms: 'Unterarme', abs: 'Bauch',
  traps: 'Trapez', lats: 'Latissimus', lowerback: 'Unterer Rücken', glutes: 'Po', quads: 'Oberschenkel', hamstrings: 'Beinbeuger', calves: 'Waden'
};
/* Reihenfolge zählt: Spezielles vor Allgemeinem. [Muster, Hauptmuskeln, Nebenmuskeln] */
const MUSCLE_RULES = [
  [/bein ?curl|leg ?curl|beinbeuger|hamstring/, ['hamstrings']],
  [/beinstreck|leg ?ext/, ['quads']],
  [/wade|calf|calves/, ['calves']],
  [/hip ?thrust|glute|\bpo\b|abdukt|abduct|beckenheb|bruecke|bridge/, ['glutes'], ['hamstrings']],
  [/rumaen|rdl|romanian|stiff|gestreckt/, ['hamstrings', 'glutes'], ['lowerback']],
  [/kreuzheben|deadlift/, ['lowerback', 'glutes', 'hamstrings'], ['traps', 'forearms']],
  [/kniebeug|squat|beinpresse|leg ?press|ausfallschritt|lunge|hackenschmidt|step ?up|bulgar/, ['quads', 'glutes'], ['hamstrings']],
  [/hyperext|rueckenstreck|back ?ext|good ?morning/, ['lowerback'], ['glutes', 'hamstrings']],
  [/shrug|schulterheb|trapez/, ['traps']],
  [/face ?pull|reverse ?(fly|butterfly)|butterfly ?reverse|hintere schulter|rear ?delt/, ['shoulders', 'traps']],
  [/seitheb|lateral|frontheb|front ?raise|upright|aufrecht/, ['shoulders']],
  [/schulterdr|shoulder ?press|military|overhead|ohp|arnold|nackendr/, ['shoulders'], ['triceps']],
  [/klimmz|pull ?up|chin ?up|lat[ -]?(zug|zieh)|lat ?pull|\blat\b|pullover/, ['lats'], ['biceps']],
  [/rudern|\brow/, ['lats', 'traps'], ['biceps']],
  [/\bdips?\b/, ['chest', 'triceps'], ['shoulders']],
  [/bankdr|bench|brustpresse|chest ?press|schraegbank|incline|fliegend|butterfly|\bfly|flies|cable ?cross|liegestuetz|push ?up|brust/, ['chest'], ['triceps', 'shoulders']],
  [/trizeps|tricep|pushdown|french|skull|stirndr|kickback/, ['triceps']],
  [/bizeps|bicep|curl|hammer/, ['biceps'], ['forearms']],
  [/unterarm|forearm|wrist|handgelenk|farmer/, ['forearms']],
  [/bauch|crunch|plank|sit ?up|\babs?\b|leg ?raise|beinheb|russian|rollout|ab ?roll|core|hollow/, ['abs']]
];
const normName = s => s.trim().toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[-_]/g, ' ');
/** Muskelgruppen einer Übung: eigene Zuordnung, sonst automatische Erkennung, sonst null */
function muscleFor(name) {
  const own = data.muscleMap[exKey(name)];
  if (own && own.length) return { p: own, s: [], own: true };
  const n = normName(name);
  const r = MUSCLE_RULES.find(([re]) => re.test(n));
  return r ? { p: r[1], s: r[2] || [] } : null;
}

let heatPeriod = 7;
const heatFactor = days => (days === 7 ? 1 : 4);
const heatLevel = (v, days) => { const f = heatFactor(days); return !v ? 0 : v < 4 * f ? 1 : v < 8 * f ? 2 : v < 12 * f ? 3 : 4; };
const HEAT_OPACITY = [0, 0.3, 0.55, 0.8, 1];
const relDay = s => { const d = Math.round((toDate(today()) - toDate(s)) / 864e5); return d === 0 ? 'heute' : d === 1 ? 'gestern' : `vor ${d} Tagen`; };

function muscleStats(days) {
  const from = addDays(today(), -(days - 1));
  const sets = Object.fromEntries(Object.keys(MUSCLES).map(k => [k, 0]));
  const last = {}, unmapped = new Set();
  for (const w of data.workouts) {
    const od = onlyDone(w);   // gemeinsame Regel, siehe workSets
    for (const ex of w.exercises) {
    const n = workSets(w, ex, od).length;
    if (!n) continue;
    const m = muscleFor(ex.name);
    if (!m) { if (w.date >= from) unmapped.add(ex.name.trim()); continue; }
    for (const g of m.p) if (!last[g] || w.date > last[g]) last[g] = w.date;
    if (w.date < from || w.date > today()) continue;
    m.p.forEach(g => { sets[g] += n; });
    m.s.forEach(g => { sets[g] += n / 2; });   // Nebenmuskeln zählen halb
    }
  }
  return { sets, last, unmapped: [...unmapped] };
}

function bodySvg(side, st, days) {
  const shapes = (side === 'front' ? FRONT_L : BACK_L).map(([g, tag]) => {
    const lvl = heatLevel(st.sets[g], days);
    const fill = lvl ? `fill="var(--accent)" fill-opacity="${HEAT_OPACITY[lvl]}"` : 'fill="var(--border)"';
    return tag.replace(/^<(\w+)/, `<$1 class="mu" data-g="${g}" ${fill}`);
  }).join('');
  const spine = side === 'back' ? '<path class="sil-line" d="M100 132V178"/>' : '<path class="sil-line" d="M100 88V122"/>';
  return `<svg viewBox="0 0 200 420" role="img" aria-label="Muskelgruppen ${side === 'front' ? 'vorne' : 'hinten'}">
    <g class="sil">
      <ellipse cx="100" cy="32" rx="19" ry="23"/><rect x="89" y="46" width="22" height="20" rx="8"/>
      <path d="${BODY_OUTLINE}"/><path d="${BODY_OUTLINE}" ${MIRROR}/>
    </g>
    ${spine}
    <g stroke="var(--bg-surface)" stroke-width="1.5" stroke-linejoin="round">
      <g>${shapes}</g><g ${MIRROR}>${shapes}</g>
    </g>
  </svg>`;
}

function muscleCard() {
  const st = muscleStats(heatPeriod);
  const neglected = Object.keys(MUSCLES).filter(g => st.last[g])
    .map(g => ({ g, d: Math.round((toDate(today()) - toDate(st.last[g])) / 864e5) }))
    .filter(x => x.d >= 7).sort((a, b) => b.d - a.d).slice(0, 3);
  const ranked = Object.keys(MUSCLES).sort((a, b) => st.sets[b] - st.sets[a] || (st.last[b] || '').localeCompare(st.last[a] || ''));
  const max = Math.max(1, ...Object.values(st.sets));
  const trained = ranked.filter(g => st.sets[g] > 0).length;
  const row = g => {
    const v = Math.round(st.sets[g] * 2) / 2, lvl = heatLevel(st.sets[g], heatPeriod);
    return `<button class="mu-row ${v ? '' : 'is-zero'}" data-g="${g}" aria-label="${MUSCLES[g]}: ${num(v)} Sätze">

      <figure class="body-fig">${bodySvg('front', st, heatPeriod)}<figcaption>Vorne</figcaption></figure>

    </div>
    <div class="heat-legend" aria-hidden="true"><span>Weniger</span><i style="background:var(--border)"></i>${HEAT_OPACITY.slice(1).map(o => `<i style="background:var(--accent);opacity:${o}"></i>`).join('')}<span>Mehr</span></div>
    <p class="mu-info" id="mu-info" aria-live="polite">Tippe auf einen Muskel oder eine Zeile für Details. Nebenmuskeln zählen als halber Satz.</p>

      ${ranked.slice(0, 5).map(row).join('')}
      <details class="mu-more"><summary>${ic('chevron-right', 16)}Alle ${Object.keys(MUSCLES).length} Muskelgruppen</summary>${ranked.slice(5).map(row).join('')}</details>

function selectMuscle(g) {
  const st = muscleStats(heatPeriod);
  document.querySelectorAll('.mu').forEach(el => el.classList.toggle('is-selected', el.dataset.g === g));
  document.querySelectorAll('.mu-row').forEach(el => el.classList.toggle('is-selected', el.dataset.g === g));
  const v = Math.round(st.sets[g] * 2) / 2;
  $('mu-info').innerHTML = `<b>${MUSCLES[g]}</b><span>${v ? `${num(v)} ${v === 1 ? 'Satz' : 'Sätze'} in ${heatPeriod} Tagen` : `kein Satz in ${heatPeriod} Tagen`}</span><span aria-hidden="true">·</span><span>${st.last[g] ? 'zuletzt ' + relDay(st.last[g]) : 'noch nie trainiert'}</span>`;
}

function assignSheet(names) {
  let i = 0;
  const sheet = openSheet('Muskelgruppen', '<div id="as"></div>');
  const draw = () => {
    const name = names[i], m = muscleFor(name), cur = new Set(m ? m.p : []);
    sheet.querySelector('#as').innerHTML = `
      <p class="eyebrow">${names.length > 1 ? `Übung ${i + 1} von ${names.length}` : 'Übung'}</p>
      <p class="report-title" style="margin-top:var(--s-1)">${esc(name)}</p>
      <p class="report-text">Welche Muskeln trainiert diese Übung hauptsächlich?</p>
      <div class="chips" role="group" aria-label="Muskelgruppen" style="margin-top:var(--s-4)">
        ${Object.entries(MUSCLES).map(([k, l]) => `<button class="chip" data-mg="${k}" aria-pressed="${cur.has(k)}">${l}</button>`).join('')}
      </div>
      <button class="btn btn-primary btn-lg btn-block" data-act="as-save" style="margin-top:var(--s-6)">${i < names.length - 1 ? 'Speichern und weiter' : 'Speichern'}</button>`;
  };
  sheet.addEventListener('click', e => {
    const c = e.target.closest('[data-mg]');
    if (c) { c.setAttribute('aria-pressed', String(c.getAttribute('aria-pressed') !== 'true')); return; }
    if (!e.target.closest('[data-act="as-save"]')) return;
    const sel = [...sheet.querySelectorAll('[data-mg][aria-pressed="true"]')].map(b => b.dataset.mg);
    const key = exKey(names[i]);
    if (sel.length) data.muscleMap[key] = sel; else delete data.muscleMap[key];
    save();
    if (++i < names.length) draw();
    else { closeSheet(); if (state.view === 'progress') renderProgress(); toast('Muskelgruppen gespeichert', { type: 'success' }); }
  });
  draw();
}

function weekStreak() {
  const mons = [...new Set(data.workouts.map(w => mondayIso(w.date)))].sort();
  let best = 0, run = 0, prev = null;
  for (const m of mons) { run = prev && addDays(prev, 7) === m ? run + 1 : 1; best = Math.max(best, run); prev = m; }
  return best;
}
function calendarCard() {
  const t = today(), start = addDays(mondayIso(t), -52 * 7);
  const map = new Map();
  for (const w of data.workouts) {
    const e = map.get(w.date) || { vol: 0, sets: 0, names: [] };
    e.vol += volume(w); e.sets += workCount(w); e.names.push(w.name || 'Workout');
    map.set(w.date, e);
  }
  const inRange = [...map.entries()].filter(([d]) => d >= start && d <= t);
  const useVol = inRange.some(([, e]) => e.vol > 0);
  const vals = inRange.map(([, e]) => (useVol ? e.vol : e.sets)).filter(v => v > 0).sort((a, b) => a - b);
  const q = p => vals[Math.min(vals.length - 1, Math.floor(p * vals.length))] || 0;
  const cuts = [q(0.25), q(0.5), q(0.75)];
  const lvl = v => (v <= cuts[0] ? 1 : v <= cuts[1] ? 2 : v <= cuts[2] ? 3 : 4);
  let cells = '', months = '', prevMonth = -1;
  for (let wk = 0; wk < 53; wk++) {
    const mon = addDays(start, wk * 7), m = toDate(mon).getMonth();
    if (m !== prevMonth) {
      if (wk < 51) months += `<span class="cal-m" style="grid-column:${wk + 1} / span 3;grid-row:1">${dfmt(mon, { month: 'short' }).replace('.', '')}</span>`;
      prevMonth = m;
    }
    for (let d = 0; d < 7; d++) {
      const day = addDays(mon, d);
      if (day > t) continue;
      const e = map.get(day);
      cells += `<button class="cal-c l${e ? lvl(useVol ? e.vol : e.sets) : 0}" style="grid-column:${wk + 1};grid-row:${d + 2}" data-date="${day}" aria-label="${dfmt(day, { weekday: 'short', day: 'numeric', month: 'short' })}: ${e ? esc(e.names.join(', ')) : 'kein Training'}"></button>`;
    }
  }
  const streak = weekStreak();
  return `
  <h2 class="section-label">Trainingskalender</h2>
  <section class="card card-pad" aria-labelledby="t-cal">
    <div class="card-head"><h3 class="card-title" id="t-cal">Letzte 12 Monate</h3><span class="card-meta">${plural(inRange.length, 'Trainingstag', 'Trainingstage')}</span></div>
    <div class="cal-wrap">
      <div class="cal-days" aria-hidden="true"><span></span><span>Mo</span><span></span><span>Mi</span><span></span><span>Fr</span><span></span><span></span></div>
      <div class="cal-scroll" id="cal-scroll"><div class="cal">${months}${cells}</div></div>
    </div>
    <div class="cal-foot">
      <span class="cal-info" id="cal-info">Längste Serie: ${plural(streak, 'Woche', 'Wochen')} in Folge</span>
      <span class="heat-legend" aria-hidden="true"><span>Weniger</span><i class="cal-c l0"></i><i class="cal-c l1"></i><i class="cal-c l2"></i><i class="cal-c l3"></i><i class="cal-c l4"></i><span>Mehr</span></span>
    </div>
  </section>`;
}
function selectDay(d) {
  document.querySelectorAll('.cal-c.is-sel').forEach(c => c.classList.remove('is-sel'));
  const cell = document.querySelector(`.cal-c[data-date="${d}"]`);
  if (cell) cell.classList.add('is-sel');
  const ws = data.workouts.filter(w => w.date === d);
  const label = `<b style="color:var(--text-primary);font-weight:600">${dfmt(d, { weekday: 'short', day: 'numeric', month: 'short' })}</b>`;
  $('cal-info').innerHTML = ws.length
    ? `${label}<span>${esc(ws.map(w => w.name).join(', '))} · ${fmtVol(ws.reduce((n, w) => n + volume(w), 0))}</span><button class="btn btn-ghost" data-open-w="${esc(ws[0].id)}" style="height:32px;padding:0 var(--s-2)">Öffnen${ic('chevron-right', 16)}</button>`
    : `${label}<span>kein Training</span>`;
}

/* =====================================================================
   Jahresrückblick
   ===================================================================== */
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const WEEKDAYS = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

function yearStats(y) {
  const ys = String(y);
  const ws = data.workouts.filter(w => w.date.startsWith(ys + '-')).sort((a, b) => a.date.localeCompare(b.date) || (a.created || 0) - (b.created || 0));
  const vol = ws.reduce((n, w) => n + volume(w), 0);
  const useVol = vol > 0;
  const months = Array(12).fill(0);
  ws.forEach(w => { months[+w.date.slice(5, 7) - 1] += useVol ? volume(w) : workCount(w); });
  const wdCount = Array(7).fill(0);
  ws.forEach(w => { wdCount[toDate(w.date).getDay()]++; });

  const ex = new Map();
  for (const w of ws) for (const e of w.exercises) {
    const valid = workSets(w, e);
    if (!valid.length) continue;
    const k = exKey(e.name);
    const c = ex.get(k) || { name: e.name.trim(), sessions: 0, sets: 0, bests: [] };
    c.sessions++; c.sets += valid.length;
    c.bests.push(Math.max(...valid.map(s => +s.weight || 0)));
    ex.set(k, c);
  }
  const all = [...ex.values()];
  const fav = all.sort((a, b) => b.sessions - a.sessions || b.sets - a.sets)[0] || null;
  let jump = null;
  for (const c of all) {
    if (c.bests.length < 2 || !c.bests[0]) continue;
    const d = Math.max(...c.bests) - c.bests[0];
    if (d > 0 && (!jump || d > jump.d)) jump = { name: c.name, d, from: c.bests[0], to: Math.max(...c.bests) };
  }
  // Rekorde: chronologisch über alle Workouts, gezählt nur in diesem Jahr
  let prs = 0;
  const bestBy = new Map();
  for (const w of [...data.workouts].sort((a, b) => a.date.localeCompare(b.date) || (a.created || 0) - (b.created || 0))) {
    for (const e of w.exercises) {
      const k = exKey(e.name), valid = workSets(w, e);
      if (!valid.length) continue;
      const weighted = valid.some(s => +s.weight > 0) || (bestBy.get(k) && bestBy.get(k).weighted);
      const top = valid.map(s => setScore(s, weighted)).reduce((a, b) => (beats(b, a) ? b : a));
      const prev = bestBy.get(k);
      if (prev && beats(top, prev.sc) && w.date.startsWith(ys + '-')) prs++;
      if (!prev || beats(top, prev.sc)) bestBy.set(k, { sc: top, weighted });
    }
  }
  const mons = [...new Set(ws.map(w => mondayIso(w.date)))].sort();
  let streak = 0, run = 0, prevM = null;
  for (const m of mons) { run = prevM && addDays(prevM, 7) === m ? run + 1 : 1; streak = Math.max(streak, run); prevM = m; }
  const durs = ws.map(duration).filter(Boolean);
  return {
    y, n: ws.length, days: new Set(ws.map(w => w.date)).size, vol, useVol, months,
    sets: ws.reduce((n, w) => n + workCount(w), 0),
    reps: ws.reduce((n, w) => n + workReps(w), 0),
    hours: durs.reduce((a, b) => a + b, 0) / 36e5, timed: durs.length,
    weekday: wdCount.some(Boolean) ? WEEKDAYS[wdCount.indexOf(Math.max(...wdCount))] : null,
    fav, jump, prs, streak,
    running: y === new Date().getFullYear()
  };
}

function yearCard() {
  const years = [...new Set(data.workouts.map(w => +w.date.slice(0, 4)))].sort((a, b) => b - a);
  if (!years.length) return '';
  const s = yearStats(years[0]);
  return `
  <h2 class="section-label">Jahresrückblick</h2>
  <button class="card card-link year-card" data-year="${s.y}">
    <span class="year-k">${s.running ? 'Bisher' : 'Rückblick'}</span>
    <span class="year-t">Dein Trainingsjahr ${s.y}</span>
    <span class="year-s"><span>${plural(s.n, 'Workout', 'Workouts')}${s.vol ? ` · ${fmtVol(s.vol)} bewegt` : ''}</span><span style="display:flex;align-items:center;gap:var(--s-1);font-weight:600">Ansehen${ic('chevron-right', 16)}</span></span>
  </button>
  ${years.length > 1 ? `<div class="year-more">${years.slice(1).map(y => `<button class="btn btn-secondary" data-year="${y}">${y}</button>`).join('')}</div>` : ''}`;
}

function openYear(y) {
  const s = yearStats(y);
  if (!s.n) return;
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
  const maxM = s.months.indexOf(Math.max(...s.months));
  const slides = [
    { accent: true, html: `<p class="slide-k">Jahresrückblick</p><p class="slide-big">${s.y}</p><p class="slide-t">Dein Trainingsjahr${s.running ? ' bis heute' : ''}.</p><p class="slide-s">Tippe rechts für weiter, links für zurück.</p>` },
    { html: `<p class="slide-k">Du warst dabei</p><p class="slide-big">${s.n}</p><p class="slide-t">${s.n === 1 ? 'Workout' : 'Workouts'} an ${plural(s.days, 'Tag', 'Tagen')}.</p><p class="slide-s">${s.timed ? `Das sind ${num(Math.round(s.hours * 10) / 10)} Stunden Training. ` : ''}${s.weekday ? `Dein Lieblingstag: ${s.weekday}.` : ''}</p>` }
  ];
  if (s.vol) slides.push({ accent: true, html: `<p class="slide-k">Insgesamt bewegt</p><p class="slide-big">${fmtVol(s.vol)}</p><p class="slide-t">${tonnage(s.vol) ? cap(tonnage(s.vol)) + '.' : ''}</p><p class="slide-s">${num(s.sets)} Sätze · ${num(s.reps)} Wiederholungen</p>` });
  if (s.fav) slides.push({ html: `<p class="slide-k">Deine Lieblingsübung</p><p class="slide-name">${esc(s.fav.name)}</p><p class="slide-s">${s.fav.sessions}× trainiert · ${num(s.fav.sets)} Sätze</p>` });
  if (s.months.some(Boolean)) slides.push({
    html: `<p class="slide-k">Dein stärkster Monat</p><p class="slide-name">${MONTHS[maxM]}</p><p class="slide-s">${s.useVol ? fmtVol(s.months[maxM]) + ' Volumen' : plural(s.months[maxM], 'Satz', 'Sätze')}</p>
      <div class="slide-bars" aria-hidden="true">${s.months.map((v, i) => `<span><i class="${i === maxM ? 'is-max' : ''}" style="height:${Math.max(2, v / s.months[maxM] * 100)}%;animation-delay:${i * 30}ms"></i>${MONTHS[i][0]}</span>`).join('')}</div>`
  });
  if (s.jump) slides.push({ accent: true, html: `<p class="slide-k">Größter Sprung</p><p class="slide-big">+${num(s.jump.d)} kg</p><p class="slide-t">${esc(s.jump.name)}</p><p class="slide-s">von ${num(s.jump.from)} auf ${num(s.jump.to)} kg</p>` });
  slides.push({ html: `<p class="slide-k">Neue Rekorde</p><p class="slide-big">${s.prs}</p><p class="slide-t">${s.prs ? 'Mal hast du dich selbst übertroffen.' : 'Nächstes Jahr knackst du die ersten.'}</p><p class="slide-s">Längste Serie: ${plural(s.streak, 'Woche', 'Wochen')} in Folge trainiert.</p>` });
  slides.push({ accent: true, html: `<p class="slide-k">Das war ${s.y}</p><p class="slide-name">${s.running ? 'Weiter so.' : 'Stark.'}</p><p class="slide-t">${s.running ? 'Das Jahr ist noch nicht vorbei.' : 'Auf ein noch stärkeres Jahr.'}</p><button class="btn btn-primary btn-lg story-cta" data-share>Rückblick teilen</button>` });

  const el = document.createElement('div');
  el.className = 'story';
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', `Jahresrückblick ${s.y}`);
  el.innerHTML = `<div class="story-bars" aria-hidden="true">${slides.map(() => '<i></i>').join('')}</div>
    <div class="story-top"><span>Rückblick ${s.y}</span><button class="btn-icon" data-close aria-label="Rückblick schließen">${ic('x')}</button></div>
    <div class="story-stage">${slides.map((sl, i) => `<section class="slide" aria-hidden="true" aria-label="Seite ${i + 1} von ${slides.length}">${sl.html}</section>`).join('')}
      <div class="story-nav"><button data-nav="-1" aria-label="Vorherige Seite"></button><button data-nav="1" aria-label="Nächste Seite"></button></div></div>`;
  document.body.appendChild(el);
  document.body.style.overflow = 'hidden';
  let i = 0;
  const go = n => {
    i = Math.max(0, Math.min(slides.length - 1, n));
    el.classList.toggle('is-accent', !!slides[i].accent);
    el.querySelectorAll('.slide').forEach((sl, k) => { sl.classList.toggle('is-active', k === i); sl.setAttribute('aria-hidden', String(k !== i)); });
    el.querySelectorAll('.story-bars i').forEach((b, k) => b.classList.toggle('is-done', k <= i));
  };
  const close = () => {
    document.removeEventListener('keydown', onKey);
    document.body.style.overflow = '';
    el.classList.remove('is-open');
    setTimeout(() => el.remove(), 200);
  };
  const onKey = e => {
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); i < slides.length - 1 ? go(i + 1) : close(); }
    else if (e.key === 'ArrowLeft') go(i - 1);
  };
  document.addEventListener('keydown', onKey);
  el.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) return close();
    if (e.target.closest('[data-share]')) return shareYear(s);
    const nav = e.target.closest('[data-nav]');
    if (nav) { const t = i + +nav.dataset.nav; if (t >= slides.length) close(); else go(t); }
  });
  go(0);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('is-open')));
  el.querySelector('[data-close]').focus({ preventScroll: true });
}

async function shareYear(s) {
  const lines = [
    `Mein Trainingsjahr ${s.y}${s.running ? ' (bisher)' : ''}:`,
    `${plural(s.n, 'Workout', 'Workouts')} an ${plural(s.days, 'Tag', 'Tagen')}`,
    s.vol ? `${fmtVol(s.vol)} bewegt – ${tonnage(s.vol)}` : '',
    s.fav ? `Lieblingsübung: ${s.fav.name}` : '',
    s.jump ? `Größter Sprung: ${s.jump.name} +${num(s.jump.d)} kg` : '',
    `${s.prs} neue Rekorde`
  ].filter(Boolean).join('\n');
  try {
    if (navigator.share) await navigator.share({ title: `Trainingsjahr ${s.y}`, text: lines });
    else { await navigator.clipboard.writeText(lines); toast('Rückblick in die Zwischenablage kopiert', { type: 'success' }); }
  } catch (err) {
    if (err && err.name !== 'AbortError') toast('Teilen hat nicht geklappt. Versuch es noch einmal.', { type: 'error' });
  }
}

const TOUR = [

  { view: 'workout', target: '#dock', title: 'Übung hinzufügen und beenden', text: 'Unten fügst du Übungen hinzu. Hast du sie schon einmal gemacht, stehen die Sätze vom letzten Mal schon drin. „Beenden“ stoppt die Zeit und öffnet deinen Leistungsbericht.' },

const TOUR_ID = 'tour-demo';
function tourWorkout() {
  return { id: TOUR_ID, tour: true, created: Date.now(), startedAt: Date.now() - 18 * 60000, lastAt: Date.now(), name: 'Push (Beispiel)', date: today(), exercises: [
    { name: 'Bankdrücken', sets: [
      { reps: 10, weight: 40, done: true, warm: true },
      { reps: 8, weight: 80, done: true },
      { reps: 8, weight: 80, done: false },
      { reps: 8, weight: 80, done: false }] },
    { name: 'Schulterdrücken', sets: [{ reps: 10, weight: 40, done: false }, { reps: 10, weight: 40, done: false }] }
  ] };
}
let tourStep = 0, tourFrom = 'more';
function startTour() {
  closeSheet(true);
  tourFrom = state.view === 'workout' ? state.tab : state.view;
  const el = document.createElement('div');
  el.id = 'tour';
  el.className = 'tour';
  el.innerHTML = `<div class="tour-spot" aria-hidden="true"></div>
    <div class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-title" aria-describedby="tour-text">
      <div class="tour-bar" aria-hidden="true"><i></i></div>
      <div class="tour-head"><span class="tour-count" id="tour-count"></span><button class="btn btn-ghost tour-skip" data-tour="end">Beenden</button></div>
      <h2 class="tour-title" id="tour-title"></h2>
      <p class="tour-text" id="tour-text"></p>
      <div class="tour-actions"><button class="btn btn-ghost" data-tour="back">Zurück</button><button class="btn btn-primary" data-tour="next">Weiter</button></div>
    </div>`;
  document.body.appendChild(el);
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-tour]'); if (!b) return;
    if (b.dataset.tour === 'next') tourStep < TOUR.length - 1 ? tourGo(tourStep + 1) : endTour();
    else if (b.dataset.tour === 'back') tourGo(Math.max(0, tourStep - 1));
    else endTour();
  });
  el.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  window.addEventListener('resize', tourPlace);
  document.addEventListener('keydown', tourKeys);
  requestAnimationFrame(() => el.classList.add('is-open'));
  tourGo(0);
}
function tourKeys(e) {
  if (!$('tour')) return;
  if (e.key === 'Escape') endTour();
  else if (e.key === 'ArrowRight') $('tour').querySelector('[data-tour="next"]').click();
  else if (e.key === 'ArrowLeft') $('tour').querySelector('[data-tour="back"]').click();
}
function tourGo(i) {
  tourStep = i;
  const s = TOUR[i], el = $('tour');
  // Beispiel-Workout nur während der Workout-Schritte
  const demo = data.workouts.find(w => w.id === TOUR_ID);
  if (s.view === 'workout') {
    if (!demo) data.workouts.push(tourWorkout());
    if (state.view !== 'workout') { state.workoutId = TOUR_ID; show('workout'); }
  } else {
    if (demo) { data.workouts = data.workouts.filter(w => w.id !== TOUR_ID); state.workoutId = null; }
    if (state.view !== s.view) show(s.view);
  }
  el.querySelector('#tour-count').textContent = `${i + 1} / ${TOUR.length}`;
  el.querySelector('#tour-title').textContent = s.title;
  el.querySelector('#tour-text').textContent = s.text;
  el.querySelector('.tour-bar i').style.transform = `scaleX(${(i + 1) / TOUR.length})`;
  el.querySelector('[data-tour="back"]').disabled = i === 0;
  el.querySelector('[data-tour="next"]').textContent = i === 0 ? 'Los geht’s' : i === TOUR.length - 1 ? 'Fertig' : 'Weiter';
  const t = s.target && document.querySelector(s.target);
  el.classList.toggle('no-target', !t);
  if (t) {
    const r = tourRect(s, t), fixed = getComputedStyle(t).position === 'fixed' || t.closest('.dock, .bottom, .nav');
    if (!fixed && r.height > innerHeight * 0.45) window.scrollTo({ top: Math.max(0, scrollY + r.top - 16), behavior: 'auto' });   // hoch: ganz nach oben
    else if (!fixed && (r.top < 80 || r.bottom > innerHeight * 0.55)) window.scrollTo({ top: Math.max(0, scrollY + r.top - 96), behavior: 'auto' });
  }
  // nach dem Seitenwechsel (Einblend-Animation) messen
  clearTimeout(tourGo.t);
  tourGo.t = setTimeout(tourPlace, reduced() ? 0 : 340);
  tourPlace();
  el.querySelector('[data-tour="next"]').focus({ preventScroll: true });
}
function tourPlace() {
  const el = $('tour'); if (!el) return;
  const s = TOUR[tourStep], t = s.target && document.querySelector(s.target);
  const spot = el.querySelector('.tour-spot'), card = el.querySelector('.tour-card');
  if (!t) { el.classList.add('no-target'); card.classList.remove('at-top'); return; }
  const r = tourRect(s, t), pad = 6;
  // Hohe Elemente (z. B. Körperkarte) stehen oben, die Erklärung darunter. Nur wenn beides nicht
  // auf den Bildschirm passt (sehr kleine Handys), wird der Spot unten gekürzt.
  const tall = r.height > innerHeight * 0.45;
  const room = innerHeight - card.offsetHeight - 16 - parseFloat(getComputedStyle(card).bottom || 16) - r.top - pad;
  const h = tall ? Math.min(r.height, room) : r.height;
  Object.assign(spot.style, { transform: `translate(${r.left - pad}px, ${r.top - pad}px)`, width: `${r.width + pad * 2}px`, height: `${h + pad * 2}px` });
  card.classList.toggle('at-top', !tall && r.top + r.height / 2 > innerHeight / 2);
}
/** Hervorgehobener Bereich: das Ziel, optional nur bis zum Ende eines inneren Elements (until) */
function tourRect(s, t) {
  const r = t.getBoundingClientRect(), u = s.until && document.querySelector(s.until);
  const bottom = u ? u.getBoundingClientRect().bottom + 12 : r.bottom;
  return { left: r.left, top: r.top, width: r.width, height: bottom - r.top, bottom };
}
function endTour() {
  const el = $('tour'); if (!el) return;
  el.remove();
  window.removeEventListener('resize', tourPlace);
  document.removeEventListener('keydown', tourKeys);
  if (data.workouts.some(w => w.id === TOUR_ID)) { data.workouts = data.workouts.filter(w => w.id !== TOUR_ID); state.workoutId = null; }
  show(tourFrom === 'workout' ? 'more' : tourFrom);
  setTimeout(applyUpdate, 400);
}

/* =====================================================================
   Backup: Export (Teilen auf dem Handy), Erinnerung, Import mit Prüfung
   ===================================================================== */
const BACKUP_EVERY = 14;   // Tage, nach denen an ein Backup erinnert wird
const BACKUP_SNOOZE = 3;   // Tage Ruhe nach „Später“

/** Tage seit dem letzten Backup (null = noch nie) */
const backupAge = () => (data.settings.lastBackup ? Math.floor((Date.now() - data.settings.lastBackup) / 864e5) : null);
function backupLabel() {
  const d = backupAge();
  return d === null ? 'Noch kein Backup erstellt' : d === 0 ? 'Letztes Backup: heute' : d === 1 ? 'Letztes Backup: gestern' : `Letztes Backup: vor ${d} Tagen`;
}
/** Erinnerung auf der Startseite: ab 3 Workouts, wenn es kein Backup gibt oder es älter als 14 Tage ist und seitdem trainiert wurde */
function backupCard() {
  const s = data.settings, age = backupAge();
  if (data.workouts.length < 3) return '';
  if (age !== null && (age < BACKUP_EVERY || !data.workouts.some(w => (w.finishedAt || w.created || 0) > s.lastBackup))) return '';
  if (s.backupNag && Date.now() - s.backupNag < BACKUP_SNOOZE * 864e5) return '';
  const newer = age === null ? data.workouts.length : data.workouts.filter(w => (w.finishedAt || w.created || 0) > s.lastBackup).length;
  return `<div class="row notice" role="group" aria-labelledby="t-backup">
    <span class="notice-icon">${ic('download', 18)}</span>
    <span class="row-main"><span class="row-title" id="t-backup">${age === null ? 'Noch kein Backup' : 'Backup fällig'}</span>
      <span class="row-sub">${plural(newer, 'Workout', 'Workouts')} ungesichert</span></span>
    <button class="btn btn-secondary notice-btn" data-act="backup">Sichern</button>
    <button class="btn-icon notice-x" data-act="backup-later" aria-label="Erinnerung für ${BACKUP_SNOOZE} Tage ausblenden">${ic('x', 18)}</button>
  </div>`;
}

async function exportData() {
  const name = `training-backup-${today()}.json`, json = JSON.stringify(data, null, 2);
  const done = () => {
    data.settings.lastBackup = Date.now(); delete data.settings.backupNag; save();
    if (state.view === 'home' || state.view === 'more') render();
  };
  const r = await deliverFile(name, json, 'application/json', 'Trainings-Backup');
  if (r === 'aborted') return;                               // abgebrochen: nichts tun
  done(); toast(r === 'shared' ? 'Backup gesichert' : 'Backup gespeichert', { type: 'success' });
}

/** Datei ausliefern: auf Touch-Geräten über das Teilen-Menü (In Dateien sichern, Mail, Cloud …), sonst als Download */
async function deliverFile(name, content, mime, title) {
  const file = typeof File === 'function' ? new File([content], name, { type: mime }) : null;
  if (file && matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: title || name }); return 'shared'; }
    catch (err) { if (err && err.name === 'AbortError') return 'aborted'; /* anderer Fehler: auf Download ausweichen */ }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  return 'downloaded';
}

/** Alle Sätze als Tabelle für Excel oder eigene Auswertungen. Semikolon und Dezimalkomma, damit deutsches Excel es direkt versteht. */
function csvText() {
  const q = v => {
    let s = String(v ?? '');
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;                  // Formeln in Namen entschärfen
    return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const dec = v => (v === '' || v == null ? '' : String(+v).replace('.', ','));
  const rows = [['Datum', 'Workout', 'Übung', 'Satz', 'Typ', 'Wiederholungen', 'Gewicht (kg)', 'Abgehakt', 'Notiz']];
  const ws = data.workouts.filter(w => !w.tour).sort((a, b) => a.date.localeCompare(b.date) || (a.created || 0) - (b.created || 0));
  for (const w of ws) for (const e of w.exercises) {
    let n = 0;
    e.sets.forEach((s, i) => rows.push([w.date, w.name, e.name, s.warm ? 'A' : ++n, s.warm ? 'Aufwärmen' : 'Arbeit', dec(s.reps), dec(s.weight), s.done ? 'ja' : 'nein', i === 0 ? (e.note || '') : '']));
  }
  return '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n') + '\r\n';
}
async function exportCsv() {
  if (!data.workouts.some(w => !w.tour && setCount(w))) return toast('Noch keine Sätze zum Exportieren.');
  const r = await deliverFile(`training-saetze-${today()}.csv`, csvText(), 'text/csv', 'Trainings-Sätze');
  if (r === 'aborted') return;
  toast(r === 'shared' ? 'Tabelle geteilt' : 'Tabelle gespeichert', { type: 'success' });
}

$('import-file').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const fail = msg => { renderMore(); toast(msg, { type: 'error' }); };
  if (file.size > 20 * 1024 * 1024) return fail('Die Datei ist zu groß für ein Backup. Wähle eine Datei, die du über „Backup exportieren“ erstellt hast.');
  const st = $('import-state');
  if (st) st.innerHTML = '<span class="btn is-loading" style="height:16px;padding:0;width:16px" aria-label="Wird geladen"></span>';
  let raw;
  try { raw = JSON.parse(await file.text()); } catch { raw = null; }
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.workouts)) return fail('Diese Datei ist kein gültiges Backup. Wähle eine Datei, die du über „Backup exportieren“ erstellt hast.');
  const { data: clean, fixed } = sanitizeData(raw);
  if (raw.workouts.length && !clean.workouts.length) return fail('In dieser Datei ist kein lesbares Workout. Es wurde nichts geändert.');
  renderMore();
  importSheet(clean, fixed);
});

/** Stand vor dem letzten Import (Sicherheitskopie im Browser-Speicher) */
const PRE_IMPORT = KEY + '-vor-import';
function preImport() {
  try { const p = JSON.parse(localStorage.getItem(PRE_IMPORT)); return p && Array.isArray(p.data?.workouts) ? p : null; } catch { return null; }
}
/** Kurzbeschreibung eines Datenstands: Anzahl und letztes Workout */
function dataSummary(d) {
  const last = [...d.workouts].sort(byDateDesc)[0];
  return { n: d.workouts.length, last: last ? dfmt(last.date, { day: 'numeric', month: 'short', year: 'numeric' }) : null };
}
function importSheet(clean, fixed) {
  const here = dataSummary(data), file = dataSummary(clean);
  const col = (label, s) => `<div class="cmp-col"><span class="cmp-label">${label}</span>
    <span class="cmp-num">${s.n}</span><span class="cmp-sub">${s.n === 1 ? 'Workout' : 'Workouts'}${s.last ? `<br>letztes am ${s.last}` : ''}</span></div>`;
  const sheet = openSheet('Backup importieren', `
    <div class="cmp">${col('Auf diesem Gerät', here)}<span class="cmp-arrow" aria-hidden="true">${ic('chevron-right', 18)}</span>${col('In der Datei', file)}</div>
    <p class="sheet-text">Die Datei ersetzt alle Daten auf diesem Gerät. Den jetzigen Stand legen wir vorher als Sicherheitskopie ab. Du kannst ihn in den Einstellungen wiederherstellen.</p>
    ${fixed ? `<p class="sheet-text">${plural(fixed, 'Eintrag in der Datei war', 'Einträge in der Datei waren')} fehlerhaft und ${fixed === 1 ? 'wird' : 'werden'} bereinigt oder übersprungen.</p>` : ''}
    ${here.n > file.n ? `<p class="field-error">${ic('alert', 16)}<span>Die Datei enthält ${plural(here.n - file.n, 'Workout', 'Workouts')} weniger als dieses Gerät.</span></p>` : ''}
    <div class="sheet-actions">
      <button class="btn btn-primary btn-lg btn-block" data-imp="go">${plural(file.n, 'Workout', 'Workouts')} importieren</button>
      <button class="btn btn-ghost btn-lg btn-block" data-close>Abbrechen</button>
    </div>`);
  sheet.addEventListener('click', e => {
    if (!e.target.closest('[data-imp="go"]')) return;
    try { localStorage.setItem(PRE_IMPORT, JSON.stringify({ at: Date.now(), data })); } catch {}
    const before = JSON.stringify(data);
    clean.settings.lastBackup = Date.now();     // die importierte Datei ist selbst ein Backup
    delete clean.settings.backupNag;
    data = clean; save(); applyTheme(); closeSheet(); render();
    toast(`${plural(data.workouts.length, 'Workout', 'Workouts')} importiert`, { type: 'success', action: { label: 'Rückgängig', fn: () => {
      data = sanitizeData(JSON.parse(before)).data; save(); applyTheme(); render(); toast('Import rückgängig gemacht');
    } } });
  });
}
function restorePreImport() {
  const p = preImport(); if (!p) return;
  const s = dataSummary(p.data);
  const sheet = openSheet('Stand vor dem Import', `
    <p class="sheet-text">Gesichert am ${new Date(p.at).toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' })} um ${fmtTime(p.at)} Uhr: ${plural(s.n, 'Workout', 'Workouts')}${s.last ? `, das letzte am ${s.last}` : ''}.</p>
    <p class="sheet-text">Er ersetzt die jetzigen Daten (${plural(data.workouts.length, 'Workout', 'Workouts')}). Die jetzigen Daten werden dabei zur neuen Sicherheitskopie.</p>
    <div class="sheet-actions">
      <button class="btn btn-primary btn-lg btn-block" data-imp="restore">Wiederherstellen</button>
      <button class="btn btn-ghost btn-lg btn-block" data-close>Abbrechen</button>
    </div>`);
  sheet.addEventListener('click', e => {
    if (!e.target.closest('[data-imp="restore"]')) return;
    try { localStorage.setItem(PRE_IMPORT, JSON.stringify({ at: Date.now(), data })); } catch {}
    data = sanitizeData(p.data).data; save(); applyTheme(); closeSheet(); render();
    toast(`${plural(data.workouts.length, 'Workout', 'Workouts')} wiederhergestellt`, { type: 'success' });
  });
}

/* =====================================================================
   Pausentimer
   ===================================================================== */
let timer = null;
function startTimer(sec, src) {
  stopTimer();
  timer = { end: Date.now() + sec * 1000, total: sec, src };
  timer.iv = setInterval(tickTimer, 250);
  $('timer-wrap').classList.remove('hidden');
  document.body.classList.add('has-timer');
  tickTimer();
  syncTimerBar();
}
function stopTimer() {
  if (timer) { clearInterval(timer.iv); clearTimeout(timer.overT); }
  timer = null;
  document.querySelector('.timer').classList.remove('is-over');
  document.querySelector('.timer-label').textContent = 'Pause';
  const bar = $('timer-bar'); bar.style.transition = 'none'; bar.style.transform = '';
  $('timer-wrap').classList.add('hidden');
  document.body.classList.remove('has-timer');
}
/** Balken einmal setzen und den Rest dem Browser überlassen (keine JS-Arbeit pro Frame) */
function syncTimerBar() {
  if (!timer || timer.over) return;
  const bar = $('timer-bar'), left = Math.max(0, timer.end - Date.now());
  const ratio = Math.min(1, left / (timer.total * 1000));
  bar.style.transition = 'none';
  bar.style.transform = `scaleX(${ratio})`;
  if (reduced()) return;                 // reduzierte Bewegung: tickTimer setzt den Balken stufenweise
  void bar.offsetWidth;                  // Startwert festschreiben, sonst animiert der Browser vom alten Wert
  bar.style.transition = `transform ${left}ms linear`;
  bar.style.transform = 'scaleX(0)';
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncTimerBar(); });
function tickTimer() {
  if (!timer || timer.over) return;
  const left = Math.max(0, Math.ceil((timer.end - Date.now()) / 1000));
  $('timer-time').textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  if (reduced()) $('timer-bar').style.transform = `scaleX(${Math.max(0, Math.min(1, (timer.end - Date.now()) / (timer.total * 1000)))})`;
  if (left <= 0) timerOver();
}
/** Pause vorbei: Der Timer bleibt kurz als klarer Endzustand stehen („Los“ auf Ember-Grund), dann verschwindet er */
function timerOver() {
  clearInterval(timer.iv);
  timer.over = true;
  document.querySelector('.timer').classList.add('is-over');
  document.querySelector('.timer-label').textContent = 'Pause vorbei';
  $('timer-time').textContent = 'Los';
  beep();
  if (navigator.vibrate) navigator.vibrate([180, 90, 180]);
  $('live').textContent = ''; requestAnimationFrame(() => { $('live').textContent = 'Pause vorbei. Nächster Satz.'; });
  timer.overT = setTimeout(stopTimer, 4000);
}
document.querySelector('.timer').addEventListener('click', e => {
  const b = e.target.closest('[data-t]'); if (!b || !timer) return;
  if (b.dataset.t === 'skip' || timer.over) return stopTimer();
  const d = +b.dataset.t;
  timer.end = Math.max(Date.now() + 1000, timer.end + d * 1000);
  timer.total = Math.max(timer.total + d, 1);
  tickTimer();
  syncTimerBar();
  rememberRest();
});
/** Wer die Pause mit ±15 ändert, meint die Übung: Die neue Dauer gilt künftig für sie (gleich dem Standard: wieder Standard) */
function rememberRest() {
  const src = timer && timer.src; if (!src) return;
  const w = data.workouts.find(x => x.id === src.wid), ex = w && w.exercises.find(e => exKey(e.name) === src.key);
  if (!ex) return;
  const sec = Math.min(900, Math.max(15, Math.round(timer.total)));
  if (sec === data.settings.rest) delete ex.rest; else ex.rest = sec;
  save();
  const meta = document.querySelector(`[data-count="${w.exercises.indexOf(ex)}"]`);
  if (meta && state.view === 'workout' && state.workoutId === w.id) renderProgressBlock();
}
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.24].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.18, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.18);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2);
    });
  } catch {}
}

/* =====================================================================
   Sheet, Toast, Rückgängig
   ===================================================================== */
let lastFocus = null;
function openSheet(title, html, { full = false } = {}) {
  closeSheet(true);
  lastFocus = document.activeElement;
  const bg = document.createElement('div');
  bg.className = 'sheet-backdrop' + (full ? ' is-full' : ''); bg.id = 'sheet';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head"><h2 class="sheet-title truncate" id="sheet-title">${esc(title)}</h2>
      <button class="btn-icon" data-close aria-label="Schließen">${ic('x')}</button></div>
    <div class="sheet-body">${html}</div></div>`;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) closeSheet(); });
  document.body.appendChild(bg);
  lockScroll();
  dragToClose(bg);
  countUp(bg);
  requestAnimationFrame(() => requestAnimationFrame(() => bg.classList.add('is-open')));
  bg.firstElementChild.focus({ preventScroll: true });
  return bg.querySelector('.sheet-body');
}
/* iOS ignoriert overflow:hidden am body; daher die Seite fixieren und die Scrollposition merken */
let lockedY = null;
function lockScroll() {
  if (lockedY !== null) return;
  lockedY = window.scrollY;
  document.body.style.top = `-${lockedY}px`;
  document.body.classList.add('scroll-locked');
}
function unlockScroll() {
  if (lockedY === null) return;
  document.body.classList.remove('scroll-locked');
  document.body.style.top = '';
  window.scrollTo(0, lockedY);
  lockedY = null;
}
/** Sheet nach unten ziehen zum Schließen: am Griff/Kopf immer, im Inhalt nur, wenn er ganz oben steht */
function dragToClose(bg) {
  const sheet = bg.firstElementChild, body = sheet.querySelector('.sheet-body');
  const bottomSheet = () => !matchMedia('(min-width: 640px)').matches;
  let y0 = 0, t0 = 0, dy = 0, lastDy = 0, inBody = false, dragging = false, tracking = false;
  sheet.addEventListener('touchstart', e => {
    if (!bottomSheet() || e.touches.length > 1) return;
    tracking = true; dragging = false; dy = 0; lastDy = 0;
    y0 = e.touches[0].clientY; t0 = performance.now();
    inBody = !!e.target.closest('.sheet-body');
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (!tracking) return;
    lastDy = dy;
    dy = e.touches[0].clientY - y0;
    if (!dragging) {
      if (dy < -4 || (inBody && body.scrollTop > 0)) { tracking = false; return; }   // normales Scrollen
      if (dy > 0) e.preventDefault();             // iOS: sonst übernimmt das Gummiband-Scrollen die Geste
      if (dy < 8) return;
      dragging = true; y0 += dy; dy = 0;                                             // ab hier ohne Sprung folgen
      sheet.classList.add('is-dragging');
      if (document.activeElement && sheet.contains(document.activeElement) && document.activeElement.matches('input, textarea')) document.activeElement.blur();
    }
    e.preventDefault();
    const off = dy > 0 ? dy : dy / 4;                                                // nach oben nur mit Widerstand
    sheet.style.transform = `translateY(${off}px)`;
    bg.style.setProperty('--drag', Math.min(1, Math.max(0, off) / sheet.offsetHeight));
  }, { passive: false });
  const end = () => {
    if (!tracking) return;
    tracking = false;
    if (!dragging) return;
    dragging = false;
    sheet.classList.remove('is-dragging');
    const v = dy / Math.max(1, performance.now() - t0);
    const goingDown = dy >= lastDy;                                                  // am Ende nicht wieder hochgezogen
    if (dy > sheet.offsetHeight * 0.25 || (dy > 40 && v > 0.11 && goingDown)) {
      sheet.style.transform = 'translateY(100%)';
      closeSheet();
    } else {
      sheet.style.transform = '';
      bg.style.removeProperty('--drag');
    }
  };
  sheet.addEventListener('touchend', end);
  sheet.addEventListener('touchcancel', end);
  // iOS: Wischen außerhalb des scrollbaren Inhalts (Hintergrund, Kopf) darf nie die Seite dahinter bewegen
  bg.addEventListener('touchmove', e => {
    const b = e.target.closest('.sheet-body');
    if (!b || b.scrollHeight <= b.clientHeight) { if (e.cancelable) e.preventDefault(); }
  }, { passive: false });
}
function closeSheet(immediate) {
  const bg = $('sheet');
  if (!bg) return;
  bg.removeAttribute('id');
  unlockScroll();
  if (immediate || reduced()) bg.remove();
  else { bg.classList.remove('is-open'); setTimeout(() => bg.remove(), 250); }
  if (!immediate && lastFocus && lastFocus.isConnected) lastFocus.focus({ preventScroll: true });
  if (!immediate) setTimeout(applyUpdate, 400);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('sheet')) closeSheet();
  if (e.key === 'Tab' && $('sheet')) {           // Fokus im Dialog halten
    const f = [...$('sheet').querySelectorAll('button:not([disabled]), input, [tabindex="-1"]')].filter(el => el.offsetParent !== null);
    if (!f.length) return;
    const firstEl = f[0], lastEl = f.at(-1);
    if (e.shiftKey && document.activeElement === firstEl) { e.preventDefault(); lastEl.focus(); }
    else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); firstEl.focus(); }
  }
});

let toastEl = null, toastTimer = null;
function toast(msg, { type = 'info', action } = {}) {
  if (toastEl) { const old = toastEl; old.classList.remove('is-shown'); setTimeout(() => old.remove(), 200); }
  clearTimeout(toastTimer);
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  if (action || type === 'error') t.setAttribute('role', type === 'error' ? 'alert' : 'status');
  else { t.setAttribute('aria-hidden', 'true'); $('live').textContent = ''; requestAnimationFrame(() => { $('live').textContent = msg; }); }
  t.innerHTML = `${type === 'success' ? ic('check-circle', 18) : type === 'error' ? ic('alert', 18) : type === 'pr' ? ic('trophy', 18) : ''}<span class="toast-msg">${esc(msg)}</span>${action ? `<button class="toast-action">${esc(action.label)}</button>` : ''}`;
  if (action) t.querySelector('button').addEventListener('click', () => { action.fn(); hide(); });
  document.body.appendChild(t);
  toastEl = t;
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('is-shown')));
  const hide = () => { t.classList.remove('is-shown'); setTimeout(() => t.remove(), 200); if (toastEl === t) toastEl = null; };
  toastTimer = setTimeout(hide, action ? 5000 : type === 'error' ? 6500 : 2400);
}
function withUndo(msg, fn) {
  const snapshot = JSON.stringify(data.workouts);
  fn(); save(); render();
  toast(msg, { action: { label: 'Rückgängig', fn: () => { data.workouts = JSON.parse(snapshot); save(); render(); } } });
}

/* =====================================================================
   Start
   ===================================================================== */
applyTheme();
show('home');
autoFinishStale();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') autoFinishStale(); });

/* Offline zuerst: Die App kommt sofort aus dem Cache. Liegt eine neue Version bereit,
   wird sie in einem ruhigen Moment geladen, nie mitten im Workout, in einem Fenster oder während einer Eingabe. */
let updateReady = false;
const calm = () => state.view !== 'workout' && !$('sheet') && !document.querySelector('.story.is-open') && !$('tour')
  && !(document.activeElement && document.activeElement.matches('input, textarea, select'));
function applyUpdate() { if (updateReady && calm()) location.reload(); }
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || updateReady) return;          // erste Installation: nichts neu laden
    updateReady = true;
    applyUpdate();
  });
  navigator.serviceWorker.register('sw.js').then(reg => {
    // installierte Apps auf dem iPhone laden beim Zurückholen nicht neu, also selbst nach Updates fragen
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { reg.update().catch(() => {}); applyUpdate(); }
    });
  }).catch(() => {});
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
