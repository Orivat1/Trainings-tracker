/* =====================================================================
   Übungs-Bibliothek: ein Name je Übung, umbenennen und zusammenführen ohne Verlust des Verlaufs
   ===================================================================== */
/** Alle Übungen mit Anzahl Einheiten; angezeigt wird die zuletzt verwendete Schreibweise */
function exerciseCatalog() {
  const map = new Map();
  const add = (name, date) => {
    const k = exKey(name); if (!k) return;
    const c = map.get(k) || { key: k, name: name.trim(), n: 0, last: '' };
    if (date) { c.n++; if (date >= c.last) { c.last = date; c.name = name.trim(); } }
    map.set(k, c);
  };
  for (const w of data.workouts) for (const e of w.exercises) add(e.name, w.date);
  for (const r of data.routines) for (const e of r.exercises) add(e.name, '');
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name, 'de'));
}
/** Lockerer Vergleich für Tippfehler und Plural: „Kniebeugen“ ≈ „Kniebeuge“, „Bankdrüken“ ≈ „Bankdrücken“ */
const looseKey = s => normName(exKey(s)).replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim().replace(/(en|n|e|s)$/, '');
function editDistance(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }
  }
  return d[b.length];
}
function similarNames(a, b) {
  const x = looseKey(a), y = looseKey(b);
  if (!x || !y || exKey(a) === exKey(b)) return false;
  if (x === y) return true;
  const len = Math.min(x.length, y.length);
  return len >= 4 && editDistance(x, y) <= (len >= 6 ? 2 : 1);
}
/** Wahrscheinliche Doppelungen: die seltener genutzte Schreibweise wird in die häufigere überführt */
function duplicatePairs(cat = exerciseCatalog()) {
  const pairs = [];
  for (let i = 0; i < cat.length; i++) for (let j = i + 1; j < cat.length; j++) {
    if (!similarNames(cat[i].name, cat[j].name)) continue;
    const [from, to] = cat[i].n < cat[j].n ? [cat[i], cat[j]] : [cat[j], cat[i]];
    pairs.push({ from, to });
  }
  return pairs;
}
/** Übung überall umbenennen; heißt das Ziel wie eine bestehende Übung, werden beide zusammengeführt */
function renameExercise(fromKey, toName) {
  toName = toName.trim().slice(0, 100);
  const toKey = exKey(toName);
  if (!toKey) return;
  for (const w of data.workouts) {
    const i = w.exercises.findIndex(e => exKey(e.name) === fromKey);
    if (i < 0) continue;
    const j = toKey === fromKey ? -1 : w.exercises.findIndex(e => exKey(e.name) === toKey);
    if (j >= 0) {                                               // beide im selben Workout: Sätze zusammenlegen
      const [a, b] = i < j ? [i, j] : [j, i];
      w.exercises[a].sets.push(...w.exercises[b].sets);
      w.exercises[a].name = toName;
      w.exercises.splice(b, 1);
    } else w.exercises[i].name = toName;
  }
  for (const w of data.workouts) for (const e of w.exercises) if (exKey(e.name) === toKey) e.name = toName;   // einheitliche Schreibweise
  for (const r of data.routines) {
    r.exercises.forEach(e => { if (exKey(e.name) === fromKey || exKey(e.name) === toKey) e.name = toName; });
    r.exercises = r.exercises.filter((e, i, all) => all.findIndex(x => exKey(x.name) === exKey(e.name)) === i);
  }
  if (fromKey !== toKey && data.muscleMap[fromKey]) {
    if (!data.muscleMap[toKey]) data.muscleMap[toKey] = data.muscleMap[fromKey];
    delete data.muscleMap[fromKey];
  }
}
/** Änderung mit Rückgängig (Workouts, Routinen und Muskelzuordnung gemeinsam) */
function withLibraryUndo(msg, fn) {
  const snap = JSON.stringify({ workouts: data.workouts, routines: data.routines, muscleMap: data.muscleMap });
  fn(); save(); render();
  toast(msg, { action: { label: 'Rückgängig', fn: () => { Object.assign(data, JSON.parse(snap)); save(); render(); } } });
}

function exerciseLibrary() {
  const cat = exerciseCatalog(), dups = duplicatePairs(cat);
  const muscles = name => (m => (m ? m.p.map(g => MUSCLES[g]).join(', ') : 'Keine Muskelgruppe'))(muscleFor(name));
  const sheet = openSheet('Übungen', `
    ${dups.length ? `
      <h3 class="section-label" style="margin-top:0">Mögliche Doppelungen</h3>
      <div class="list-inset">
        ${dups.map((p, i) => `<div class="row">
          <span class="row-main"><span class="row-title">${esc(p.from.name)} → ${esc(p.to.name)}</span><span class="row-sub">${p.from.n}× und ${p.to.n}× trainiert</span></span>
          <button class="btn btn-secondary" style="height:36px;padding:0 var(--s-3)" data-merge="${i}">Zusammenführen</button>
        </div>`).join('')}
      </div>` : ''}
    <p class="sheet-text">Tippe auf eine Übung, um sie umzubenennen. Gibst du den Namen einer anderen Übung ein, werden beide samt Verlauf zusammengeführt.</p>
    <div class="list-inset">
      ${cat.map(c => `<button class="row" data-ex="${esc(c.key)}">
        <span class="row-main"><span class="row-title">${esc(c.name)}</span><span class="row-sub">${c.n ? `${c.n}× · ` : 'Nur in Routinen · '}${esc(muscles(c.name))}</span></span>
        <span class="row-chev">${ic('chevron-right', 16)}</span>
      </button>`).join('') || '<p class="sheet-text">Noch keine Übungen.</p>'}
    </div>`);
  sheet.addEventListener('click', e => {
    const m = e.target.closest('[data-merge]');
    if (m) {
      const p = dups[+m.dataset.merge];
      closeSheet(true);
      withLibraryUndo(`„${p.from.name}“ in „${p.to.name}“ zusammengeführt`, () => renameExercise(p.from.key, p.to.name));
      return exerciseLibrary();
    }
    const x = e.target.closest('[data-ex]');
    if (x) exerciseEditor(cat.find(c => c.key === x.dataset.ex));
  });
}
function exerciseEditor(c) {
  const others = exerciseCatalog().filter(o => o.key !== c.key);
  const sheet = openSheet(c.name, `
    <div>
      <label class="label" for="ex-rename">Name</label>
      <input class="input" id="ex-rename" value="${esc(c.name)}" maxlength="100" autocomplete="off" list="ex-rename-list" enterkeyhint="done">
      <datalist id="ex-rename-list">${others.map(o => `<option value="${esc(o.name)}">`).join('')}</datalist>
    </div>
    <p class="sheet-text" id="ex-rename-hint">${c.n ? `${c.n}× trainiert. Der Verlauf bleibt beim Umbenennen erhalten.` : 'Wird nur in Routinen verwendet.'}</p>
    <div class="sheet-actions">
      <button class="btn btn-primary btn-lg btn-block" data-act="rename">Speichern</button>
      <button class="btn btn-secondary btn-lg btn-block" data-act="muscles">${ic('dumbbell', 18)}Muskelgruppen festlegen</button>
    </div>`);
  const input = sheet.querySelector('#ex-rename'), hint = sheet.querySelector('#ex-rename-hint'), btn = sheet.querySelector('[data-act="rename"]');
  const target = () => others.find(o => o.key === exKey(input.value));
  const update = () => {
    const t = target();
    btn.textContent = t ? `Mit „${t.name}“ zusammenführen` : 'Speichern';
    hint.textContent = t ? `„${t.name}“ gibt es schon (${t.n}×). Beide Verläufe werden zu einer Übung zusammengelegt.`
      : c.n ? `${c.n}× trainiert. Der Verlauf bleibt beim Umbenennen erhalten.` : 'Wird nur in Routinen verwendet.';
  };
  input.addEventListener('input', update);
  const commit = () => {
    const name = input.value.trim();
    if (!name || name === c.name) return closeSheet();
    const t = target();
    closeSheet(true);
    withLibraryUndo(t ? `„${c.name}“ in „${t.name}“ zusammengeführt` : `Umbenannt in „${name}“`, () => renameExercise(c.key, t ? t.name : name));
    exerciseLibrary();
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); });
  sheet.addEventListener('click', e => {
    if (e.target.closest('[data-act="rename"]')) return commit();
    if (e.target.closest('[data-act="muscles"]')) { closeSheet(true); assignSheet([c.name]); }
  });
}

/* =====================================================================
   Routinen: feste Pläne mit Ziel-Sätzen und -Wiederholungen
   ===================================================================== */
const routineFor = name => (name && exKey(name) ? data.routines.find(r => exKey(r.name) === exKey(name) && r.exercises.length) : null);
const routineSummary = r => `${plural(r.exercises.length, 'Übung', 'Übungen')} · ${r.exercises.map(e => e.name).join(', ')}`;
const firstNum = s => { const m = String(s || '').match(/\d+/); return m ? +m[0] : ''; };
/** Workout aus Routine: Satzanzahl aus dem Plan, Werte vom letzten Mal (sonst Ziel-Wdh.), Aufwärmsätze vom letzten Mal */
function workoutFromRoutine(r, date) {
  const w = { id: uid(), created: Date.now(), name: r.name, date, routine: r.id, exercises: [] };
  w.exercises = r.exercises.map(re => {
    const prev = previousExercise(re.name, w);
    const warm = prev ? prev.sets.filter(s => s.warm).map(copySet) : [];
    const work = prev ? prev.sets.filter(s => !s.warm) : [];
    const sets = Array.from({ length: re.sets }, (_, i) => {
      const p = work[i] || work.at(-1);
      return { reps: p ? p.reps : firstNum(re.reps), weight: p ? p.weight : '', done: false };
    });
    return { name: re.name, sets: warm.concat(sets), ...(re.reps ? { goal: `${re.sets} × ${re.reps}` } : {}), ...carry(prev) };
  });
  return w;
}
/** Aktuelles Workout als Routine speichern (gleichnamige Routine wird aktualisiert) */
function saveRoutineFrom(w) {
  const common = arr => { const c = new Map(); arr.forEach(v => c.set(v, (c.get(v) || 0) + 1)); return [...c].sort((a, b) => b[1] - a[1])[0]?.[0]; };
  const exercises = w.exercises.filter(e => e.name.trim()).map(e => {
    const work = e.sets.filter(s => !s.warm);
    const reps = common(work.map(s => +s.reps).filter(Boolean));
    return { name: e.name.trim(), sets: Math.min(20, Math.max(1, work.length)), reps: reps ? String(reps) : '' };
  });
  if (!exercises.length) return toast('Füge zuerst Übungen hinzu.');
  let r = routineFor(w.name) || data.routines.find(x => exKey(x.name) === exKey(w.name));
  const existed = !!r;
  if (r) r.exercises = exercises;
  else { r = { id: uid(), name: (w.name || 'Routine').trim(), exercises }; data.routines.push(r); }
  w.routine = r.id;
  save();
  toast(existed ? `Routine „${r.name}“ aktualisiert` : `Als Routine „${r.name}“ gespeichert`, { type: 'success', action: { label: 'Bearbeiten', fn: () => routineEditor(r.id) } });
}

function plansBlock() {

function addPlan(i) {
  const p = PLANS[i]; let n = 0;
  for (const r of p.routines) {
    if (data.routines.some(x => exKey(x.name) === exKey(r.name))) continue;
    data.routines.push({ id: uid(), name: r.name, exercises: r.ex.map(([name, sets, reps]) => ({ name, sets, reps })) });
    n++;
  }
  save(); render();
  toast(n ? `${plural(n, 'Routine', 'Routinen')} angelegt` : 'Diese Routinen gibt es schon', { type: n ? 'success' : 'info' });
}

function routineEditor(id, { focusName = false } = {}) {
  const r = data.routines.find(x => x.id === id);
  if (!r) return;
  const names = suggestNames();
  const body = openSheet('Routine', '<div id="re-body"></div>');
  const draw = () => {
    body.querySelector('#re-body').innerHTML = `
      <div>
        <label class="label" for="re-name">Name</label>
        <input class="input" id="re-name" value="${esc(r.name)}" maxlength="100" autocomplete="off">
      </div>
      <div class="re-list">
        ${r.exercises.map((e, i) => `<div class="re-ex">
          <div class="re-ex-head"><b class="truncate">${esc(e.name)}</b>
            ${i > 0 ? `<button class="btn-icon" data-up="${i}" aria-label="${esc(e.name)} nach oben">${ic('arrow-up', 18)}</button>` : ''}
            <button class="btn-icon" data-del="${i}" aria-label="${esc(e.name)} entfernen">${ic('x', 18)}</button></div>

            <span class="re-k">Wdh.</span>
            <input class="num-input re-reps" data-reps="${i}" value="${esc(e.reps)}" placeholder="8–10" maxlength="12" inputmode="text" aria-label="${esc(e.name)}: Ziel-Wiederholungen">
          </div>
        </div>`).join('')}
      </div>
      <div class="re-add">
        <input class="input" id="re-new" placeholder="Übung hinzufügen" list="re-names" autocomplete="off" enterkeyhint="done">
        <datalist id="re-names">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
        <button class="btn btn-secondary" data-act="re-add" aria-label="Übung hinzufügen">${ic('plus', 18)}</button>
      </div>
      <div class="sheet-actions">
        ${r.exercises.length ? `<button class="btn btn-primary btn-lg btn-block" data-act="re-start">${ic('plus', 18)}Routine heute starten</button>` : ''}
        <button class="btn btn-ghost btn-lg btn-block is-danger-text" data-act="re-delete">Routine löschen</button>
      </div>`;
  };
  draw();
  const addEx = () => {
    const inp = body.querySelector('#re-new'), name = inp.value.trim();
    if (!name) return inp.focus();
    if (r.exercises.some(e => exKey(e.name) === exKey(name))) { toast(`„${name}“ ist schon in der Routine`); return; }
    const known = exerciseCatalog().find(c => exKey(c.name) === exKey(name));
    r.exercises.push({ name: known ? known.name : name, sets: 3, reps: '' });
    save(); draw(); body.querySelector('#re-new').focus();
  };
  body.addEventListener('input', e => {
    if (e.target.id === 're-name') { r.name = e.target.value.slice(0, 100); save(); }
    else if (e.target.dataset.reps !== undefined) { r.exercises[+e.target.dataset.reps].reps = e.target.value.trim().slice(0, 12); save(); }
  });
  body.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 're-new') addEx(); });
  body.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (d.inc !== undefined) r.exercises[+d.inc].sets = Math.min(20, r.exercises[+d.inc].sets + 1);
    else if (d.dec !== undefined) r.exercises[+d.dec].sets = Math.max(1, r.exercises[+d.dec].sets - 1);
    else if (d.up !== undefined) { const i = +d.up; [r.exercises[i - 1], r.exercises[i]] = [r.exercises[i], r.exercises[i - 1]]; }
    else if (d.del !== undefined) r.exercises.splice(+d.del, 1);
    else if (d.act === 're-add') return addEx();
    else if (d.act === 're-start') { if (!r.name.trim()) r.name = 'Routine'; save(); return startWorkout(null, { routine: r }); }
    else if (d.act === 're-delete') {
      closeSheet(true);
      const snap = JSON.stringify(data.routines);
      data.routines = data.routines.filter(x => x.id !== r.id); save(); render();
      return toast(`Routine „${r.name}“ gelöscht`, { action: { label: 'Rückgängig', fn: () => { data.routines = JSON.parse(snap); save(); render(); } } });
    } else return;
    save(); draw();
  });
  if (focusName) requestAnimationFrame(() => { const n = body.querySelector('#re-name'); n.focus(); n.select(); });
}

  $('w-name').value = w.name;

function updateTimeChip() {
  const w = current(), el = $('w-time');
  if (!w || !w.startedAt) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const live = isActive(w);
  el.classList.toggle('is-live', live);
  el.innerHTML = live
    ? `<span class="live-dot" aria-hidden="true"></span><span>${fmtClock(Date.now() - w.startedAt)}</span><span class="sr-only">Workout läuft</span>`
    : `${ic('timer', 16)}<span>${fmtDur(duration(w))}</span>`;
}

function renderProgressBlock() {
  const w = current(), total = setCount(w), done = doneCount(w);
  const box = $('w-progress');
  if (!box.firstElementChild) {
    box.innerHTML = `<div class="w-progress-meta"><span id="wp-sets"></span><span id="wp-side"></span></div>
      <div class="bar" role="progressbar" aria-label="Erledigte Sätze" aria-valuemin="0" id="wp-bar"><i></i></div>`;
  }
  $('wp-sets').innerHTML = total ? `<b>${done}</b> von ${plural(total, 'Satz', 'Sätzen')} erledigt` : 'Noch keine Sätze';
  $('wp-side').textContent = `${plural(w.exercises.length, 'Übung', 'Übungen')} · ${fmtVol(volume(w))}`;
  const bar = $('wp-bar');
  bar.setAttribute('aria-valuemax', total); bar.setAttribute('aria-valuenow', done);
  const ratio = total ? done / total : 0;
  if (bar.dataset.wid === w.id && ratio > +bar.dataset.ratio) replay(bar, 'is-advancing', 750);
  bar.dataset.ratio = ratio; bar.dataset.wid = w.id;
  bar.firstElementChild.style.transform = `scaleX(${ratio})`;
  document.querySelectorAll('[data-count]').forEach(el => {
    const ex = w.exercises[+el.dataset.count];
    const d = ex.sets.filter(s => s.done).length;
    el.textContent = `${d}/${ex.sets.length} ${ex.sets.length === 1 ? 'Satz' : 'Sätze'} · ${repCount(workSets(w, ex))} Wdh.${ex.goal ? ` · Ziel ${ex.goal}` : ''}${ex.rest ? ` · Pause ${fmtMin(ex.rest)}` : ''}`;
  });
}

        ${ex.sets.map((s, si) => {
          const p = prev && prev.sets[si];

            <input class="num-input" type="number" min="0" inputmode="numeric" value="${esc(s.reps)}" placeholder="0" data-f="reps" data-ei="${ei}" data-si="${si}" aria-label="${esc(ex.name)}, Satz ${si + 1}: Wiederholungen">

function setExError(msg) {
  $('ex-error').innerHTML = `${ic('alert', 16)}<span>${esc(msg)}</span>`;
  $('ex-error').classList.remove('hidden');
  $('new-ex').setAttribute('aria-invalid', 'true');
}
function clearExError() {
  hideSimilar();
  $('ex-error').classList.add('hidden');
  $('new-ex').removeAttribute('aria-invalid');
}
function addExercise(force = false) {
  let name = $('new-ex').value.trim();
  if (!name) { setExError('Gib zuerst einen Namen für die Übung ein.'); $('new-ex').focus(); return; }
  const w = current();
  const cat = exerciseCatalog();
  const known = cat.find(c => c.key === exKey(name));
  if (known) name = known.name;                                  // gleiche Schreibweise wie bisher
  else if (!force) {                                             // Tippfehler oder Plural? Erst nachfragen
    const sim = cat.filter(c => similarNames(c.name, name)).sort((a, b) => b.n - a.n)[0];
    if (sim) return showSimilar(name, sim);
  }
  hideSimilar();
  if (w.exercises.some(e => exKey(e.name) === exKey(name))) {
    setExError(`„${name}“ ist schon in diesem Workout. Füge dort einfach weitere Sätze hinzu.`); return;
  }
  clearExError();
  const prev = previousExercise(name, w);
  const sets = prev ? prev.sets.map(copySet) : [{ reps: '', weight: '', done: false }];
  w.exercises.push({ name, sets, ...carry(prev) });
  state.justAdded = [w.exercises.length - 1];
  $('new-ex').value = '';
  touch(w); save(); renderExercises();
  requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: reduced() ? 'auto' : 'smooth' }));
}
function showSimilar(name, sim) {

function hideSimilar() { $('ex-similar').classList.add('hidden'); }
$('ex-similar').addEventListener('click', e => {

});
$('new-ex').addEventListener('input', hideSimilar);
$('add-ex').addEventListener('click', () => addExercise());
$('new-ex').addEventListener('keydown', e => { if (e.key === 'Enter') addExercise(); });
$('new-ex').addEventListener('input', clearExError);

$('v-workout').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const w = current(), act = b.dataset.act, ei = +b.dataset.ei, si = +b.dataset.si;
  if (act === 'back') return closeWorkout();
  if (act === 'w-menu') return workoutMenu();
  if (act === 'ex-menu') return exerciseMenu(ei);
  if (act === 'focus-add') return $('new-ex').focus();
  if (act === 'finish') return finishWorkout();
  if (act === 'summary') return openSummary(w);
  if (act === 'set-menu') return setMenu(ei, si);
  if (act === 'note') return noteSheet(ei);
  if (act === 'stall') {
    const st = stagnation(w.exercises[ei], w);
    if (!st) return;
    w.exercises[ei].sets.forEach(s => { if (!s.done && !s.warm) s.weight = st.target; });
    touch(w); save(); renderExercises();
    toast(`${w.exercises[ei].name}: ${num(st.target)} kg eingetragen`);
    return;
  }
  if (act === 'add-set') {
    const sets = w.exercises[ei].sets, last = sets.at(-1);
    sets.push(last ? { reps: last.reps, weight: last.weight, done: false } : { reps: '', weight: '', done: false });
    state.justAdded = [ei, sets.length - 1];
  } else if (act === 'prev') {
    const p = previousExercise(w.exercises[ei].name, w).sets[si];
    Object.assign(w.exercises[ei].sets[si], { reps: p.reps, weight: p.weight });
  } else if (act === 'done') {
    const s = w.exercises[ei].sets[si];
    const wasComplete = setCount(w) > 0 && doneCount(w) === setCount(w);
    s.done = !s.done;
    if (s.done) {
      state.justDone = [ei, si];
      if (navigator.vibrate) navigator.vibrate(12);
      if (!w.startedAt && w.date === today()) w.startedAt = Date.now();
      touch(w);
      const nowComplete = doneCount(w) === setCount(w);
      if (nowComplete && !wasComplete) {
        stopTimer();
        if (isActive(w)) toast('Alle Sätze erledigt. Starke Leistung!', { type: 'success', action: { label: 'Beenden', fn: finishWorkout } });
        else toast('Alle Sätze erledigt. Starke Leistung!', { type: 'success' });
      } else {
        if (data.settings.autoRest) startTimer(w.exercises[ei].rest || data.settings.rest, { wid: w.id, key: exKey(w.exercises[ei].name) });
      }
    }
  } else return;
  save(); renderExercises();
});

/** Wert eines Zahlenfelds in den Satz übernehmen (Tippen und ±-Schritte teilen sich diesen Weg) */
function commitField(el) {
  const s = current().exercises[+el.dataset.ei].sets[+el.dataset.si];
  s[el.dataset.f] = el.value === '' ? '' : Math.max(0, Number(el.value));
  touch(current()); save(); renderProgressBlock(); updatePR(+el.dataset.ei);
}
$('ex-list').addEventListener('input', e => { if (e.target.dataset.f) commitField(e.target); });

/* ±-Schritte: unter dem Satz mit dem aktiven Zahlenfeld. Die Tastatur bleibt offen, ein Tipp ändert den Wert. */
const STEPS = { weight: [-2.5, -1.25, 1.25, 2.5], reps: [-1, 1] };
let stepper = null;
function hideStepper() { if (stepper) stepper.remove(); stepper = null; }
function showStepper(input) {
  hideStepper();
  const f = input.dataset.f, row = input.closest('.set-swipe');
  if (!row || !STEPS[f]) return;
  const fmt = d => (d < 0 ? '−' : '+') + num(Math.abs(d));
  stepper = document.createElement('div');
  stepper.className = 'set-stepper';
  stepper.innerHTML = `<span class="set-stepper-k">${f === 'weight' ? 'kg' : 'Wdh.'}</span>${STEPS[f].map(d =>
    `<button type="button" class="stp ${d < 0 ? 'stp-minus' : ''}" data-st="${d}" aria-label="${d < 0 ? 'Weniger' : 'Mehr'}: ${num(Math.abs(d))} ${f === 'weight' ? 'kg' : 'Wiederholung' + (Math.abs(d) === 1 ? '' : 'en')}">${fmt(d)}</button>`).join('')}`;
  stepper._input = input;
  row.after(stepper);
  stepper.scrollIntoView({ block: 'nearest', behavior: 'auto' });
}
// Die Schritt-Tasten nehmen dem Feld den Fokus nicht ab: sonst schließt sich die Tastatur vor dem Tipp
for (const t of ['pointerdown', 'mousedown']) $('ex-list').addEventListener(t, e => { if (e.target.closest('.set-stepper')) e.preventDefault(); });
$('ex-list').addEventListener('click', e => {
  const b = e.target.closest('[data-st]');
  if (!b || !stepper || !stepper.isConnected) return;
  const input = stepper._input, f = input.dataset.f;
  let cur = input.value === '' ? NaN : Number(input.value);
  if (isNaN(cur)) {                                           // leeres Feld: beim Wert des Satzes davor beginnen
    const sets = current().exercises[+input.dataset.ei].sets;
    cur = +(sets[+input.dataset.si - 1] || {})[f] || 0;
  }
  const next = Math.max(0, Math.round((cur + +b.dataset.st) * 100) / 100);
  input.value = next;
  commitField(input);
  if (navigator.vibrate) navigator.vibrate(8);
});
$('ex-list').addEventListener('focusout', () => setTimeout(() => {
  if (!(document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('num-input'))) hideStepper();
}, 0));

/** Rekord-Markierung live aktualisieren, ohne die Eingabe neu zu rendern */
function updatePR(ei) {
  const w = current(), card = $('ex-list').querySelector(`.ex[data-ei="${ei}"]`);
  if (!card) return;
  const { idx } = prInfo(w.exercises[ei], w);
  card.classList.toggle('has-pr', idx >= 0);
  card.querySelectorAll('.set').forEach(row => row.classList.toggle('is-pr', +row.dataset.si === idx));
  const hunt = card.querySelector('.hunt');
  if (hunt) {
    const si = +hunt.dataset.si, txt = huntText(w.exercises[ei], w, si);
    hunt.querySelector('span').textContent = txt;
    hunt.classList.toggle('hidden', !txt || idx === si);
  }
}
$('ex-list').addEventListener('focusin', e => { if (e.target.classList.contains('num-input')) { e.target.select(); showStepper(e.target); } });

$('w-name').addEventListener('input', e => { current().name = e.target.value; $('tb-title').textContent = e.target.value; save(); });
$('w-name').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('w-name').addEventListener('blur', e => { if (!e.target.value.trim()) { current().name = 'Workout'; e.target.value = 'Workout'; $('tb-title').textContent = 'Workout'; save(); } });
$('w-date').addEventListener('change', e => {

});
window.addEventListener('scroll', () => $('topbar').classList.toggle('is-scrolled', window.scrollY > 64), { passive: true });

function workoutMenu() {

    <div class="menu">
      ${isActive(w) ? `<button class="menu-item" data-m="finish">${ic('flag')}<span>Workout beenden<small>Zeit stoppen und Leistungsbericht erstellen</small></span></button>` : ''}
      ${w.finishedAt ? `<button class="menu-item" data-m="summary">${ic('list')}<span>Leistungsbericht ansehen</span></button>
        <button class="menu-item" data-m="resume">${ic('resume')}<span>Wieder aufnehmen<small>Die Zeitmessung läuft weiter</small></span></button>` : ''}
      <button class="menu-item" data-m="repeat">${ic('repeat')}<span>Heute wiederholen<small>Neues Workout mit denselben Übungen und Sätzen</small></span></button>

      <button class="menu-item is-danger" data-m="delete">${ic('trash')}<span>Workout löschen</span></button>
    </div>`);
  sheet.addEventListener('click', e => {

function exerciseMenu(ei) {
  const w = current(), ex = w.exercises[ei];
  const sheet = openSheet(ex.name, `
    <div class="menu">

      <button class="menu-item" data-m="rest">${ic('timer')}<span>Pause für diese Übung<small>${ex.rest ? fmtMin(ex.rest) : `Standard (${fmtMin(data.settings.rest)})`}</small></span></button>
      <button class="menu-item" data-m="muscles">${ic('dumbbell')}<span>Muskelgruppen festlegen<small>${(m => (m ? m.p.map(g => MUSCLES[g]).join(', ') : 'Noch nicht zugeordnet'))(muscleFor(ex.name))}</small></span></button>

      const j = a === 'up' ? ei - 1 : ei + 1;
      [w.exercises[ei], w.exercises[j]] = [w.exercises[j], w.exercises[ei]];

    } else if (a === 'muscles') assignSheet([ex.name]);

/** Satz-Menü: über die Satznummer erreichbar */
function setMenu(ei, si) {
  const w = current(), ex = w.exercises[ei], s = ex.sets[si];
  const no = s.warm ? null : ex.sets.slice(0, si + 1).filter(x => !x.warm).length;
  const sheet = openSheet(`${ex.name} · ${s.warm ? 'Aufwärmsatz' : 'Satz ' + no}`, `
    <div class="menu">
      <button class="menu-item" data-m="warm">${ic(s.warm ? 'dumbbell' : 'flame')}<span>${s.warm ? 'Als Arbeitssatz zählen' : 'Als Aufwärmsatz markieren'}<small>${s.warm ? 'Zählt wieder in Volumen, Sätze und Rekorde' : 'Zählt nicht in Volumen, Sätze und Rekorde'}</small></span></button>
      <button class="menu-item" data-m="above">${ic('arrow-up')}<span>Satz davor einfügen</span></button>
      <button class="menu-item" data-m="dup">${ic('copy')}<span>Satz duplizieren<small>${s.reps !== '' || s.weight !== '' ? esc(fmtSetShort(s)) + ' als nächster Satz' : 'Als nächster Satz'}</small></span></button>
      <button class="menu-item is-danger" data-m="delete">${ic('trash')}<span>Satz löschen</span></button>
    </div>`);
  sheet.addEventListener('click', e => {
    const m = e.target.closest('[data-m]'); if (!m) return;
    closeSheet();
    const a = m.dataset.m;
    if (a === 'delete') return withUndo('Satz gelöscht', () => ex.sets.splice(si, 1));
    if (a === 'warm') { if (s.warm) delete s.warm; else s.warm = true; }
    else if (a === 'above') { ex.sets.splice(si, 0, { reps: s.reps, weight: s.weight, done: false, ...(s.warm ? { warm: true } : {}) }); state.justAdded = [ei, si]; }
    else if (a === 'dup') { ex.sets.splice(si + 1, 0, copySet(s)); state.justAdded = [ei, si + 1]; }
    touch(w); save(); renderExercises();
  });
}

/* ---------- Übung ersetzen, Notiz, Pause je Übung ---------- */
const fmtMin = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
/** Häufige Übungen als Namensvorschläge, damit auch am Anfang nichts frei getippt werden muss */
const STARTER_EXERCISES = ['Bankdrücken', 'Schrägbankdrücken', 'Kurzhantel-Bankdrücken', 'Fliegende', 'Dips', 'Liegestütze', 'Schulterdrücken', 'Seitheben',
  'Face Pulls', 'Klimmzüge', 'Latzug', 'Rudern vorgebeugt', 'Rudern am Kabel', 'Kreuzheben', 'Rumänisches Kreuzheben', 'Kniebeugen', 'Frontkniebeugen',
  'Beinpresse', 'Ausfallschritte', 'Beinstrecken', 'Beinbeugen', 'Hip Thrusts', 'Wadenheben', 'Bizeps-Curls', 'Hammer-Curls', 'Trizepsdrücken',
  'French Press', 'Crunches', 'Plank'];
/** Eigene Übungen zuerst in ihrer Schreibweise, dazu die Startliste (ohne Doppelte) */
function suggestNames() {
  const m = new Map();
  for (const w of data.workouts) for (const e of w.exercises) { const k = exKey(e.name); if (k && !m.has(k)) m.set(k, e.name); }
  for (const n of STARTER_EXERCISES) if (!m.has(exKey(n))) m.set(exKey(n), n);
  return [...m.values()].sort((a, b) => a.localeCompare(b, 'de'));
}

function replaceSheet(ei) {
  const w = current(), ex = w.exercises[ei];
  const sheet = openSheet('Übung ersetzen', `
    <p class="sheet-text">Statt <b>${esc(ex.name)}</b>: Die Reihenfolge bleibt. Hast du die neue Übung schon gemacht, stehen die Werte vom letzten Mal drin, sonst bleibt die Satzzahl und das Gewicht ist leer.</p>
    <div>
      <label class="label" for="rp-name">Neue Übung</label>
      <input class="input" id="rp-name" placeholder="Name der Übung" list="rp-names" maxlength="100" autocomplete="off" enterkeyhint="done">
      <datalist id="rp-names">${suggestNames().map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      <p class="field-error hidden" id="rp-err" role="alert"></p>
    </div>
    <button class="btn btn-primary btn-lg btn-block" data-act="rp-go">Ersetzen</button>`);
  const input = sheet.querySelector('#rp-name'), err = sheet.querySelector('#rp-err');
  const go = () => {
    let name = input.value.trim().slice(0, 100);
    if (!name) { input.focus(); return; }
    const known = exerciseCatalog().find(c => c.key === exKey(name));
    if (known) name = known.name;
    const fail = msg => { err.textContent = msg; err.classList.remove('hidden'); input.focus(); };
    if (exKey(name) === exKey(ex.name)) return fail('Das ist schon die aktuelle Übung.');
    if (w.exercises.some((e, i) => i !== ei && exKey(e.name) === exKey(name))) return fail(`„${name}“ ist schon in diesem Workout.`);
    const prev = previousExercise(name, w);
    closeSheet(true);
    withUndo(`Ersetzt durch ${name}`, () => {
      const sets = prev ? prev.sets.map(copySet) : ex.sets.map(s => ({ reps: s.reps, weight: '', done: false, ...(s.warm ? { warm: true } : {}) }));
      Object.keys(ex).forEach(k => delete ex[k]);
      Object.assign(ex, { name, sets }, carry(prev));
    });
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  input.addEventListener('input', () => err.classList.add('hidden'));
  sheet.addEventListener('click', e => { if (e.target.closest('[data-act="rp-go"]')) go(); });
  requestAnimationFrame(() => input.focus());
}

function noteSheet(ei) {
  const w = current(), ex = w.exercises[ei];

    <div>
      <label class="label" for="nt-text">Notiz</label>

function restSheet(ei) {

/* ---------- Beenden & Zusammenfassung ---------- */
function finishWorkout() {
  const w = current();
  if (!w || !isActive(w)) return;
  const done = doneCount(w), open = setCount(w) - done;
  if (!open) return completeWorkout(w);
  const sheet = openSheet('Workout beenden', `
    <div class="open-sets"><span class="open-sets-num">${open}</span>
      <span class="open-sets-text">${open === 1 ? 'Satz ist' : 'Sätze sind'} noch nicht abgehakt. ${done
        ? 'In den Bericht und die Statistik kommen nur abgehakte Sätze.'
        : 'Hast du alles geschafft, hake die Sätze in einem Rutsch ab.'}</span></div>
    <div class="sheet-actions">
      ${done ? `<button class="btn btn-primary btn-lg btn-block" data-f="drop">Offene verwerfen und beenden</button>
        <button class="btn btn-secondary btn-lg btn-block" data-f="all">Alle abhaken und beenden</button>`
        : `<button class="btn btn-primary btn-lg btn-block" data-f="all">Alle abhaken und beenden</button>`}
      <button class="btn btn-ghost btn-lg btn-block" data-f="back">Weiter trainieren</button>
    </div>`);
  sheet.addEventListener('click', e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    if (b.dataset.f === 'back') return closeSheet();
    closeSheet(true);
    if (b.dataset.f === 'all') { w.exercises.forEach(ex => ex.sets.forEach(s => { s.done = true; })); return completeWorkout(w); }
    const before = JSON.stringify(w.exercises);
    w.exercises = w.exercises.map(ex => ({ ...ex, sets: ex.sets.filter(s => s.done) })).filter(ex => ex.sets.length);
    completeWorkout(w);
    toast(`${plural(open, 'offener Satz', 'offene Sätze')} verworfen`, { action: { label: 'Rückgängig', fn: () => {
      w.exercises = JSON.parse(before); save(); if (state.view === 'workout') renderWorkout();
      if ($('sheet')) openSummary(w);
    } } });
  });
}
function completeWorkout(w) {
  w.finishedAt = Date.now();
  delete w.autoFinished;
  save(); stopTimer(); renderWorkout();
  window.scrollTo({ top: 0, behavior: 'auto' });
  if (navigator.vibrate) navigator.vibrate([20, 60, 20]);
  openSummary(w);
}

/* ---------- Vergessenes „Beenden“ abfangen ---------- */
const STALE_AFTER = 2 * 3600e3;    // 2 Stunden ohne Aktivität = Workout vergessen
const LAST_SET = 2 * 60e3;         // Zeit für den letzten Satz nach dem Abhaken

/** Übliche Workout-Dauer des Nutzers (Median der letzten 10 regulär beendeten, sonst 60 min) */
function typicalDuration() {
  const ds = data.workouts.filter(w => duration(w) && !w.autoFinished).sort((a, b) => b.finishedAt - a.finishedAt).slice(0, 10).map(duration).sort((a, b) => a - b);
  return ds.length ? ds[Math.floor(ds.length / 2)] : 3600e3;
}
/** Beendet Workouts, die seit über 2 Stunden ohne Aktivität laufen, und datiert das Ende auf die letzte Aktivität */
function autoFinishStale() {
  const now = Date.now(), ended = [];
  for (const w of data.workouts) {
    if (!isActive(w) || now - (w.lastAt || w.startedAt) < STALE_AFTER) continue;
    if (w.lastAt) w.finishedAt = Math.min(now, w.lastAt + LAST_SET);
    else if (doneCount(w) > 0) w.finishedAt = Math.min(now, w.startedAt + typicalDuration());   // ältere Daten ohne Aktivitätszeit: Schätzung
    else { delete w.startedAt; ended.push(w); continue; }                                        // nichts gemacht: ohne Zeitmessung
    w.finishedAt = Math.max(w.finishedAt, w.startedAt + 60e3);
    w.autoFinished = true;
    ended.push(w);
  }
  if (!ended.length) return;
  save();
  if (timer && ended.some(w => w.id === state.workoutId)) stopTimer();
  render();
  const w = ended.find(x => x.finishedAt) || ended[0];
  const when = w.date === today() ? '' : w.date === addDays(today(), -1) ? ' von gestern' : ` vom ${fmtPick(w.date)}`;
  toast(ended.length > 1 ? `${ended.length} vergessene Workouts automatisch beendet`
    : w.finishedAt ? `„${w.name || 'Workout'}“${when} automatisch beendet, Ende ${fmtTime(w.finishedAt)} Uhr`
    : `„${w.name || 'Workout'}“${when} ohne erledigte Sätze beendet`,
    w.finishedAt ? { action: { label: 'Bericht', fn: () => openSummary(w) } } : {});
}

/* ---------- Leistungsbericht ---------- */
/** Bester Satz einer Übung (abgehakte Sätze, sonst alle mit Wiederholungen) */
function exBest(sets, onlyDone = false) {
  sets = sets.filter(s => !s.warm);
  const done = sets.filter(s => s.done && (+s.reps || 0) > 0);
  const use = done.length || onlyDone ? done : sets.filter(s => (+s.reps || 0) > 0);
  if (!use.length) return null;
  const r = { maxKg: 0, repsAtMax: 0, maxReps: 0, vol: 0 };
  for (const s of use) {
    const kg = +s.weight || 0, reps = +s.reps || 0;
    if (kg > r.maxKg || (kg === r.maxKg && reps > r.repsAtMax)) { r.maxKg = kg; r.repsAtMax = reps; }
    r.maxReps = Math.max(r.maxReps, reps);
    r.vol += kg * reps;
  }
  return r;
}

function workoutReport(w) {
  const key = (w.name || '').trim().toLowerCase();
  const prev = sorted().find(x => x.id !== w.id && (x.name || '').trim().toLowerCase() === key &&
    (x.date < w.date || (x.date === w.date && (x.created || 0) < (w.created || 0))));
  const anyDone = doneCount(w) > 0;   // wurde abgehakt, zählen nur erledigte Sätze
  const exercises = w.exercises.map(ex => {
    const cur = exBest(ex.sets, anyDone);
    const before = previousExercise(ex.name, w);
    const old = before ? exBest(before.sets) : null;
    const cmp = cur && old ? compareEx(cur, old) : null;
    const pi = prInfo(ex, w);
    const pr = !!cur && pi.idx >= 0 && (!anyDone || ex.sets[pi.idx].done);
    const prSet = pr ? ex.sets[pi.idx] : null;
    const prWas = pr ? (pi.weighted ? `${num(pi.best[0])} kg × ${pi.best[1]}` : `${pi.best[0]} Wdh.`) : '';
    return { name: ex.name, cur, old, cmp, pr, prSet, prWas, done: ex.sets.filter(s => s.done).length, total: ex.sets.length,
      volPct: cur && old && old.vol ? Math.round((cur.vol - old.vol) / old.vol * 100) : null };
  });
  const compared = exercises.filter(e => e.cmp);
  const up = compared.filter(e => e.cmp.dir > 0).length;
  const down = compared.filter(e => e.cmp.dir < 0).length;
  const prs = exercises.filter(e => e.pr);
  const total = setCount(w), done = doneCount(w);
  const completion = total ? done / total : 0;
  const reps = workReps(w);

  let title, text, tone;
  if (!total) { title = 'Training ohne Sätze'; text = 'Trag beim nächsten Mal deine Sätze ein, dann bekommst du hier deine Auswertung.'; tone = 'eq'; }
  else if (completion < 0.5) { title = 'Kurzes Training'; text = `Du hast ${done} von ${plural(total, 'Satz', 'Sätzen')} erledigt.`; tone = 'eq'; }
  else if (!compared.length) { title = 'Training abgeschlossen'; text = 'Beim nächsten Mal siehst du hier, wie du dich im Vergleich gesteigert hast.'; tone = 'up'; }
  else if (up && !down) { title = 'Starkes Training'; text = `${up} von ${plural(compared.length, 'Übung', 'Übungen')} gesteigert, keine schwächer als letztes Mal.`; tone = 'up'; }
  else if (up > down) { title = 'Gutes Training'; text = `${up} ${up === 1 ? 'Übung' : 'Übungen'} besser, ${down} schwächer als letztes Mal.`; tone = 'up'; }
  else if (down > up) { title = 'Etwas schwächer als letztes Mal'; text = `${down} ${down === 1 ? 'Übung' : 'Übungen'} unter dem letzten Stand. Die Tagesform schwankt – dranbleiben lohnt sich.`; tone = 'down'; }
  else { title = 'Solides Training'; text = up ? `${up} ${up === 1 ? 'Übung' : 'Übungen'} besser, ${down} schwächer – unterm Strich auf Kurs.` : 'Du hast dein Niveau vom letzten Mal gehalten.'; tone = 'eq'; }
  if (prs.length) text += ` Dazu ${prs.length === 1 ? 'ein neuer Rekord' : `${prs.length} neue Rekorde`}!`;

  return { prev, exercises, compared, up, down, prs, total, done, completion, reps, title, text, tone };
}

/** Button oben im beendeten Workout */
function reportButton(w) {
  const r = workoutReport(w);

    <span class="report-btn-icon tone-${r.prs.length ? 'pr' : r.tone}">${ic(r.prs.length ? 'trophy' : r.tone === 'down' ? 'down' : r.tone === 'up' ? 'up' : 'flag', 22)}</span>
    <span class="row-main">

  `, { full: true });
  sheet.addEventListener('click', e => {

/* ---------- Wischen zum Löschen (Touch) ---------- */
const SWIPE_DELETE = 96;
let sw = null, dr = null, suppressClick = false;
const exList = $('ex-list');

exList.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' || e.target.closest('[data-drag]')) return;
  const start = e.target.closest('[data-swipe-start]');
  if (!start) return;
  const el = start.hasAttribute('data-swipe') ? start : start.closest('[data-swipe]');
  sw = { el, wrap: el.parentElement, x: e.clientX, y: e.clientY, dx: 0, active: false, id: e.pointerId, sx: 0, st: performance.now() };
});
exList.addEventListener('pointermove', e => {
  if (!sw || e.pointerId !== sw.id) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.active) {
    if (dx < -10 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      sw.active = true;
      try { sw.el.setPointerCapture(sw.id); } catch {}
      sw.wrap.classList.add('is-swiping');
      if (sw.el.contains(document.activeElement)) document.activeElement.blur();
    } else if (Math.abs(dy) > 10 || dx > 10) sw = null;
    return;
  }
  const now = performance.now();
  if (now - sw.st > 100) { sw.sx = sw.dx; sw.st = now; }                 // Stichprobe für die Wurf-Geschwindigkeit
  sw.dx = Math.min(0, dx);
  sw.el.style.transform = `translateX(${sw.dx}px)`;
  sw.wrap.classList.toggle('will-delete', sw.dx < -SWIPE_DELETE);
});
function endSwipe() {
  if (!sw) return;
  const s = sw; sw = null;
  if (!s.active) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
  s.el.style.transition = 'transform var(--dur) var(--ease-out)';
  const v = (s.sx - s.dx) / Math.max(1, performance.now() - s.st);       // px/ms nach links in den letzten ~100 ms
  if (s.dx < -SWIPE_DELETE || (s.dx < -48 && v > 0.5)) {
    s.el.style.transform = 'translateX(-110%)';
    setTimeout(() => {
      const w = current(), ei = +s.el.dataset.ei;
      if (s.el.dataset.kind === 'set') withUndo('Satz gelöscht', () => w.exercises[ei].sets.splice(+s.el.dataset.si, 1));
      else withUndo(`${w.exercises[ei].name} gelöscht`, () => w.exercises.splice(ei, 1));
    }, reduced() ? 0 : 180);
  } else {
    s.el.style.transform = '';
    s.wrap.classList.remove('will-delete');
    setTimeout(() => { s.wrap.classList.remove('is-swiping'); s.el.style.transition = ''; }, 200);
  }
}
exList.addEventListener('pointerup', e => { endSwipe(); endDrag(e); });
exList.addEventListener('pointercancel', e => { endSwipe(); endDrag(e); });
exList.addEventListener('click', e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);

/* ---------- Übungen per Griff umsortieren ---------- */
exList.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]');
  if (!h) return;
  e.preventDefault();
  const wraps = [...exList.querySelectorAll('.ex-wrap')];
  const from = wraps.indexOf(h.closest('.ex-wrap'));
  dr = { wraps, from, to: from, rects: wraps.map(x => x.getBoundingClientRect()), y: e.clientY, id: e.pointerId, moved: false };
  try { h.setPointerCapture(e.pointerId); } catch {}
  wraps[from].classList.add('is-dragging');
  wraps.forEach((x, i) => { if (i !== from) x.classList.add('is-shifting'); });
  if (navigator.vibrate) navigator.vibrate(8);
});
exList.addEventListener('pointermove', e => {
  if (!dr || e.pointerId !== dr.id) return;
  const dy = e.clientY - dr.y;
  if (Math.abs(dy) > 4) dr.moved = true;
  const r0 = dr.rects[dr.from];
  dr.wraps[dr.from].style.transform = `translateY(${dy}px)`;
  const mid = r0.top + r0.height / 2 + dy;
  let to = dr.from;
  dr.rects.forEach((r, i) => {
    const m = r.top + r.height / 2;
    if (i < dr.from && mid < m) to = Math.min(to, i);
    if (i > dr.from && mid > m) to = Math.max(to, i);
  });
  dr.to = to;
  const shift = r0.height + 12;
  dr.wraps.forEach((x, i) => {
    if (i === dr.from) return;
    let t = 0;
    if (dr.from < to && i > dr.from && i <= to) t = -shift;
    if (dr.from > to && i >= to && i < dr.from) t = shift;
    x.style.transform = t ? `translateY(${t}px)` : '';
  });
});
function endDrag(e) {
  if (!dr || (e && e.pointerId !== dr.id)) return;
  const { from, to, moved } = dr; dr = null;
  if (moved) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 60); }
  if (from !== to) {
    const w = current();
    const [m] = w.exercises.splice(from, 1);
    w.exercises.splice(to, 0, m);
    save();
  }
  renderExercises();
}

/* =====================================================================
   Fortschritt
   ===================================================================== */
function exerciseHistory() {
  const map = new Map();
  for (const w of [...data.workouts].sort((a, b) => a.date.localeCompare(b.date))) {
    const od = onlyDone(w);
    for (const ex of w.exercises) {
      const sets = workSets(w, ex, od);
      if (!sets.length) continue;
      const key = exKey(ex.name);
      if (!map.has(key)) map.set(key, { name: ex.name.trim(), sessions: [] });
      map.get(key).sessions.push({ date: w.date, sets });
    }
  }
  return [...map.values()].sort((a, b) => b.sessions.at(-1).date.localeCompare(a.sessions.at(-1).date));
}
const usesWeight = h => h.sessions.some(s => s.sets.some(x => +x.weight > 0));
function bestSet(h) {
  const w8 = usesWeight(h);
  let best = null;
  for (const s of h.sessions) for (const x of s.sets) {
    const sc = w8 ? [+x.weight || 0, +x.reps || 0] : [+x.reps || 0, 0];
    if (!best || sc[0] > best.sc[0] || (sc[0] === best.sc[0] && sc[1] > best.sc[1])) best = { x, sc };
  }
  return best.x;
}
function sparkline(h) {
  const w8 = usesWeight(h);
  // Gewicht: geschätztes 1RM zeigt Fortschritt auch bei mehr Wiederholungen mit gleichem Gewicht
  const vals = h.sessions.slice(-12).map(s => (w8 && bestE1rm(s.sets)) || Math.max(...s.sets.map(x => w8 ? +x.weight || 0 : +x.reps || 0)));
  if (vals.length < 2) return '';
  const W = 72, H = 28, min = Math.min(...vals), max = Math.max(...vals), r = max - min || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * (W - 8) + 4, H - 4 - (v - min) / r * (H - 8)]);
  const [lx, ly] = pts.at(-1);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" style="flex:none"><polyline fill="none" stroke="var(--accent)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" points="${pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}"/><circle cx="${lx}" cy="${ly}" r="3" fill="var(--accent)" stroke="var(--bg-surface)" stroke-width="2"/></svg>`;
}

        : `<div class="metric"><span class="metric-label">Sätze</span><span class="metric-value">${h.sessions.reduce((n, s) => n + s.sets.length, 0)}</span></div>`))(Math.max(0, ...h.sessions.map(s => bestE1rm(s.sets))))}
    </div>
    ${h.sessions.some(s => bestE1rm(s.sets) > 0) ? `<p class="sheet-text">1RM ist geschätzt (Epley-Formel) und dient zum Vergleich von Sätzen mit unterschiedlichen Wiederholungen. Sätze über ${E1RM_MAX_REPS} Wdh. fließen nicht ein.</p>` : ''}
    <div class="hint-row">${ic('dumbbell', 18)}<span>${(m => (m ? m.p.map(g => MUSCLES[g]).join(', ') : 'Keine Muskelgruppe zugeordnet'))(muscleFor(h.name))}</span><button class="btn btn-secondary" data-act="ex-muscles">Ändern</button></div>
    <h3 class="section-label">Alle Einheiten</h3>
    <div>
      ${[...h.sessions].reverse().map(s => `<div class="hist">
        <div class="hist-date">${dfmt(s.date, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })}</div>
        <div class="hist-sets">${s.sets.map(x => esc(fmtSetShort(x))).join('  ·  ')}</div>
      </div>`).join('')}
    </div>
  `);
  const draw = i => {
    sheet.querySelectorAll('#metric button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.m === i)));
    drawChart(sheet, h, metrics[i]);
  };
  sheet.querySelector('#metric').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) draw(+b.dataset.m); });
  sheet.addEventListener('click', e => { if (e.target.closest('[data-act="ex-muscles"]')) { closeSheet(true); assignSheet([h.name]); } });
  requestAnimationFrame(() => draw(0));
}

/* ---------- Diagramm ---------- */
function metricsFor(h) {
  const max = (sets, f) => Math.max(...sets.map(f));
  const sum = (sets, f) => sets.reduce((n, x) => n + f(x), 0);
  const reps = x => +x.reps || 0, kg = x => +x.weight || 0;
  const has1rm = h.sessions.some(s => bestE1rm(s.sets) > 0);
  return usesWeight(h) ? [
    ...(has1rm ? [{ label: '1RM', unit: 'kg', desc: 'Geschätztes 1RM (Epley)', f: s => r05(bestE1rm(s)) || null }] : []),
    { label: 'Gewicht', unit: 'kg', desc: 'Schwerster Satz', f: s => max(s, kg) },
    { label: 'Volumen', unit: 'kg', desc: 'Wdh. × Gewicht', f: s => sum(s, x => reps(x) * kg(x)) },
    { label: 'Wdh.', unit: 'Wdh.', desc: 'Wiederholungen gesamt', f: s => sum(s, reps) }
  ] : [
    { label: 'Max. Wdh.', unit: 'Wdh.', desc: 'Bester Satz', f: s => max(s, reps) },
    { label: 'Wdh. gesamt', unit: 'Wdh.', desc: 'Wiederholungen gesamt', f: s => sum(s, reps) }
  ];
}
const fmtVal = (v, unit) => unit === 'kg' && v >= 10000 ? NUM1.format(v / 1000) + ' t' : num(v) + ' ' + unit;
const fmtTick = v => v >= 10000 ? NUM1.format(v / 1000) + 'k' : num(v);
function niceTicks(min, max) {
  if (min === max) { const pad = Math.max(1, Math.abs(min) * 0.1); min -= pad; max += pad; }
  const raw = (max - min) / 3, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
  return ticks;
}
function drawChart(sheet, h, m) {
  const box = sheet.querySelector('#chart');
  const pts = h.sessions.map(s => ({ date: s.date, v: m.f(s.sets), sets: s.sets })).filter(p => p.v !== null);   // 1RM: Einheiten ohne Schätzung auslassen
  const first = pts[0], last = pts.at(-1);
  sheet.querySelector('#ch-val').textContent = fmtVal(last.v, m.unit);
  sheet.querySelector('#ch-delta').innerHTML = pts.length < 2
    ? `<span class="delta delta-eq">${esc(m.desc)}</span>`
    : delta(last.v, first.v, { unit: m.unit === 'kg' ? 'kg' : m.unit }).replace('</span>', ` <span style="color:var(--text-tertiary);font-weight:500">seit ${dfmt(first.date, { day: 'numeric', month: 'short' })}</span></span>`);

  if (pts.length < 2) { box.innerHTML = `<div class="chart-empty">Ab zwei Einheiten siehst du hier deine Entwicklung.</div>`; return; }

  const W = box.clientWidth || 320, H = 192, L = 40, R = 12, T = 16, B = 28;
  const ticks = niceTicks(Math.min(...pts.map(p => p.v)), Math.max(...pts.map(p => p.v)));
  const y0 = ticks[0], y1 = ticks.at(-1);
  const x = i => L + i / (pts.length - 1) * (W - L - R);
  const y = v => T + (1 - (v - y0) / (y1 - y0 || 1)) * (H - T - B);
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area = `${x(0).toFixed(1)},${H - B} ${line} ${x(pts.length - 1).toFixed(1)},${H - B}`;
  const showDots = pts.length <= 24;
  let runMax = -Infinity;
  const recs = pts.map((p, i) => { const r = i > 0 && p.v > runMax; runMax = Math.max(runMax, p.v); return r; });   // neue Bestwerte: goldene Punkte
  const xl = pts.length > 2 ? [0, Math.floor((pts.length - 1) / 2), pts.length - 1] : [0, 1];
  const dShort = d => dfmt(d, { day: '2-digit', month: '2-digit' });

  box.innerHTML = `
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(h.name)}: ${esc(m.desc)} von ${fmtVal(first.v, m.unit)} auf ${fmtVal(last.v, m.unit)}">
      <defs><linearGradient id="ch-fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--accent)" stop-opacity=".18"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
      </linearGradient></defs>
      ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--border-subtle)"/>
        <text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" class="ch-axis">${fmtTick(t)}</text>`).join('')}
      ${xl.map((i, k) => `<text x="${x(i)}" y="${H - 8}" text-anchor="${k === 0 ? 'start' : k === xl.length - 1 ? 'end' : 'middle'}" class="ch-axis">${dShort(pts[i].date)}</text>`).join('')}
      <polygon points="${area}" fill="url(#ch-fill)"/>
      <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p, i) => recs[i] ? `<circle cx="${x(i)}" cy="${y(p.v)}" r="5" fill="var(--record)" stroke="var(--bg-elevated)" stroke-width="2"/>`
        : (showDots || i === pts.length - 1) ? `<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="var(--accent)" stroke="var(--bg-elevated)" stroke-width="2"/>` : '').join('')}
      <line id="ch-cross" y1="${T}" y2="${H - B}" stroke="var(--border-strong)" stroke-dasharray="3 3" visibility="hidden"/>
      <circle id="ch-hot" r="6" fill="var(--accent)" stroke="var(--bg-elevated)" stroke-width="2" visibility="hidden"/>
      <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/>
    </svg>
    <div class="ch-tip hidden" id="ch-tip"></div>`;

  const svg = box.querySelector('svg'), tip = box.querySelector('#ch-tip');
  const cross = box.querySelector('#ch-cross'), hot = box.querySelector('#ch-hot');
  const showAt = clientX => {
    const rx = clientX - svg.getBoundingClientRect().left;
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((rx - L) / (W - L - R) * (pts.length - 1))));
    const p = pts[i], px = x(i), py = y(p.v);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    hot.setAttribute('cx', px); hot.setAttribute('cy', py); hot.setAttribute('visibility', 'visible');
    hot.setAttribute('fill', recs[i] ? 'var(--record)' : 'var(--accent)');
    tip.innerHTML = `<span>${dfmt(p.date, { weekday: 'short', day: 'numeric', month: 'short' })}${recs[i] ? ' · <span style="color:var(--record)">Bestwert</span>' : ''}</span><b>${fmtVal(p.v, m.unit)}</b><span>${p.sets.map(s => esc(fmtSetShort(s))).join(' · ')}</span>`;
    tip.classList.remove('hidden');
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(W - tw, px - tw / 2)) + 'px';
    tip.style.top = Math.max(0, py - tip.offsetHeight - 16) + 'px';
  };
  const hide = () => { tip.classList.add('hidden'); cross.setAttribute('visibility', 'hidden'); hot.setAttribute('visibility', 'hidden'); };
  svg.addEventListener('pointermove', e => showAt(e.clientX));
  svg.addEventListener('pointerdown', e => showAt(e.clientX));
  svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
}

/* =====================================================================
   Wochenbericht
   ===================================================================== */
/** Kennzahlen einer Woche; mit span nur die ersten span Tage (für den fairen Vergleich mit einer laufenden Woche) */
function weekStats(mon, span = 7) {
  const end = addDays(mon, span);
  const ws = data.workouts.filter(w => w.date >= mon && w.date < end);
  const ex = new Map();
  for (const w of ws) for (const e of w.exercises) {
    const sets = workSets(w, e);
    if (!sets.length) continue;
    const k = exKey(e.name);
    const c = ex.get(k) || { name: e.name.trim(), maxKg: 0, repsAtMax: 0, maxReps: 0, e1: 0 };
    for (const s of sets) {
      const kg = +s.weight || 0, r = +s.reps || 0;
      if (kg > c.maxKg || (kg === c.maxKg && r > c.repsAtMax)) { c.maxKg = kg; c.repsAtMax = r; }
      c.maxReps = Math.max(c.maxReps, r);
      c.e1 = Math.max(c.e1, e1rm(s));
    }
    ex.set(k, c);
  }
  return {
    mon, ex, workouts: ws.length, dates: new Set(ws.map(w => w.date)),
    sets: ws.reduce((n, w) => n + workCount(w), 0),
    reps: ws.reduce((n, w) => n + workReps(w), 0),
    volume: ws.reduce((n, w) => n + volume(w), 0)
  };
}
const fmtBest = a => a.maxKg ? `${num(a.maxKg)} kg × ${a.repsAtMax}` : `${a.maxReps} Wdh.`;
function compareEx(a, b) {
  const signed = (d, unit) => (d > 0 ? '+' : '−') + num(Math.abs(d)) + ' ' + unit;
  if (a.maxKg || b.maxKg) {
    const d = a.maxKg - b.maxKg;
    if (d) return { dir: Math.sign(d), text: signed(d, 'kg') };
    const r = a.repsAtMax - b.repsAtMax;
    return { dir: Math.sign(r), text: r ? signed(r, 'Wdh.') : 'gleich' };
  }
  const r = a.maxReps - b.maxReps;
  return { dir: Math.sign(r), text: r ? signed(r, 'Wdh.') : 'gleich' };
}
function weekReport(mon) {
  const running = mon === mondayIso(today());
  const span = running ? Math.round((toDate(today()) - toDate(mon)) / 864e5) + 1 : 7;   // laufende Woche: bis heute
  // Mengen (Workouts, Sätze, Volumen) bis zum gleichen Wochentag; Bestwerte je Übung gegen die ganze Vorwoche
  const cur = weekStats(mon), prev = weekStats(addDays(mon, -7), span), prevFull = span < 7 ? weekStats(addDays(mon, -7)) : prev;
  const improved = [], declined = [], same = [], added = [], missed = [];
  for (const [k, a] of cur.ex) {
    const b = prevFull.ex.get(k);
    if (!b) { added.push({ name: a.name, to: fmtBest(a) }); continue; }
    const c = compareEx(a, b);
    (c.dir > 0 ? improved : c.dir < 0 ? declined : same).push({ name: a.name, from: fmtBest(b), to: fmtBest(a), diff: c.text, dir: c.dir });
  }
  if (!running) for (const [k, b] of prev.ex) if (!cur.ex.has(k)) missed.push({ name: b.name, to: fmtBest(b) });

  const useVol = cur.volume || prev.volume;
  const [cv, pv] = useVol ? [cur.volume, prev.volume] : [cur.reps, prev.reps];
  const pct = pv ? Math.round((cv - pv) / pv * 100) : 0;
  const what = useVol ? 'Volumen' : 'Wiederholungen';
  const sp = `${pct >= 0 ? '+' : '−'}${Math.abs(pct)} %`;
  let title, text;
  if (!cur.workouts) {
    title = running ? 'Diese Woche noch kein Training' : 'Kein Training in dieser Woche';
    text = prevFull.workouts ? `In der Vorwoche waren es ${plural(prevFull.workouts, 'Workout', 'Workouts')}.` : 'Starte ein Workout, sobald du Zeit hast.';
  } else if (!prevFull.workouts) {
    title = 'Zurück im Training';
    text = `${plural(cur.workouts, 'Workout', 'Workouts')} nach einer Woche Pause.`;
  } else if (!prev.workouts) {
    title = 'Guter Start in die Woche';
    text = `${plural(cur.workouts, 'Workout', 'Workouts')} bis heute, in der Vorwoche um diese Zeit noch keins.`;
  } else if (pct >= 10 && improved.length >= declined.length) {
    title = 'Starke Woche';
    text = `${what} ${sp}${improved.length ? `, ${plural(improved.length, 'Übung', 'Übungen')} verbessert` : ''}.`;
  } else if (improved.length > declined.length && pct > -10) {
    title = 'Du wirst stärker';
    text = `${plural(improved.length, 'Übung', 'Übungen')} verbessert, ${what} ${sp}.`;
  } else if (improved.length > declined.length) {
    title = 'Stärker bei weniger Volumen';
    text = `${plural(improved.length, 'Übung', 'Übungen')} verbessert, ${what} aber ${sp}.`;
  } else if (pct <= -10) {
    title = running ? 'Da geht noch was' : 'Ruhigere Woche';
    text = `${what} ${sp} gegenüber der Vorwoche${declined.length ? `, ${plural(declined.length, 'Übung', 'Übungen')} schwächer` : ''}.`;
  } else {
    title = 'Solide Woche';
    text = `${what} auf dem Niveau der Vorwoche (${sp}).`;
  }
  if (running && cur.workouts) text += span === 1 ? ' Verglichen mit dem Montag der Vorwoche.' : span < 7 ? ` Verglichen mit Mo bis ${wd2(today())} der Vorwoche.` : ' Die Woche läuft noch.';
  return { cur, prev, improved, declined, same, added, missed, title, text, running, span };
}

/* =====================================================================
   Wochenabschluss (ab Sonntag): Vergleich mit dem Durchschnitt + Tipps
   ===================================================================== */
const WRAP_WEEKS = 4;   // Durchschnitt der letzten 4 Wochen

/** Welche Woche steht zum Abschluss bereit? Sonntag: aktuelle Woche. Montag/Dienstag: noch die letzte. */
function wrapMon(t = today()) {
  const dow = toDate(t).getDay();
  const m = dow === 0 ? mondayIso(t) : dow <= 2 ? addDays(mondayIso(t), -7) : null;
  return m && weekStats(m).workouts > 0 ? m : null;
}

/** Trainierte Sätze pro Muskelgruppe in einer Woche (Nebenmuskeln zählen halb, wie die „fractional“-Zählung bei Pelland et al. 2024).
    Optional: days sammelt pro Muskelgruppe die Tage, an denen sie direkt trainiert wurde. */
function weekMuscles(mon, days) {
  const end = addDays(mon, 6), sets = {};
  for (const w of data.workouts) {
    if (w.date < mon || w.date > end) continue;
    const od = onlyDone(w);
    for (const ex of w.exercises) {
      const n = workSets(w, ex, od).length;
      const m = n && muscleFor(ex.name);
      if (!m) continue;
      m.p.forEach(g => { sets[g] = (sets[g] || 0) + n; if (days) (days[g] = days[g] || new Set()).add(w.date); });
      m.s.forEach(g => { sets[g] = (sets[g] || 0) + n / 2; });
    }
  }
  return sets;
}

function weekWrap(mon) {
  const cur = weekStats(mon);
  const firstMon = mondayIso(data.workouts.reduce((a, w) => (w.date < a ? w.date : a), mon));
  const priors = Array.from({ length: WRAP_WEEKS }, (_, i) => addDays(mon, -7 * (i + 1))).filter(m => m >= firstMon).map(m => weekStats(m));   // nicht .map(weekStats): der Index würde als Tagesanzahl gelesen
  const trained = priors.filter(p => p.workouts > 0);            // neueste zuerst
  const have = trained.length > 0;
  const mean = f => (priors.length ? priors.reduce((n, p) => n + f(p), 0) / priors.length : 0);
  const avg = { workouts: mean(p => p.workouts), sets: mean(p => p.sets), reps: mean(p => p.reps), volume: mean(p => p.volume) };
  const r1 = v => Math.round(v * 10) / 10;

  /* Übungen gegen den eigenen Durchschnitt */
  const improved = [], declined = [], same = [], added = [], stagnant = [];
  for (const [k, a] of cur.ex) {
    const hist = trained.map(p => p.ex.get(k)).filter(Boolean);
    if (!hist.length) { if (have) added.push({ name: a.name, to: fmtBest(a) }); continue; }
    const weighted = a.maxKg > 0 || hist.some(h => h.maxKg > 0);
    const val = h => (weighted ? h.maxKg : h.maxReps);
    const base = hist.reduce((n, h) => n + val(h), 0) / hist.length;
    const diff = val(a) - base, pct = base ? diff / base : 0;
    let dir = 0, diffText = '';
    if (Math.abs(diff) >= 1 && Math.abs(pct) >= 0.02) {
      dir = Math.sign(diff);
      diffText = `${diff > 0 ? '+' : '−'}${num(r1(Math.abs(diff)))} ${weighted ? 'kg' : 'Wdh.'}`;
    } else if (weighted) {                                       // gleiches Gewicht: Wiederholungen entscheiden
      const rd = a.repsAtMax - hist.reduce((n, h) => n + h.repsAtMax, 0) / hist.length;
      if (Math.abs(rd) >= 1.5) { dir = Math.sign(rd); diffText = `${rd > 0 ? '+' : '−'}${Math.round(Math.abs(rd))} Wdh.`; }
    }
    const item = { name: a.name, from: `Ø ${num(r1(base))} ${weighted ? 'kg' : 'Wdh.'}`, to: fmtBest(a), diff: diffText, dir, pct: Math.abs(pct), weighted };
    (dir > 0 ? improved : dir < 0 ? declined : same).push(item);
    const h0 = trained[0].ex.get(k), h1 = trained[1] && trained[1].ex.get(k);
    // ohne Fortschritt: weder diese noch letzte Woche über dem Stand von vor zwei Trainingswochen (1RM-Schätzung, sonst bester Satz)
    const sc = x => (weighted ? x.e1 || x.maxKg : x.maxReps);
    if (h0 && h1 && Math.max(sc(a), sc(h0)) <= sc(h1)) stagnant.push({ name: a.name, weighted });
  }
  improved.sort((a, b) => b.pct - a.pct); declined.sort((a, b) => b.pct - a.pct);
  const skipped = have && cur.workouts ? [...trained[0].ex].filter(([k]) => !cur.ex.has(k)).map(([, b]) => ({ name: b.name })) : [];

  /* Muskelgruppen, die gegenüber dem Durchschnitt zu kurz kamen */
  const curDays = {}, curM = weekMuscles(mon, curDays), priorM = priors.map(p => weekMuscles(p.mon));
  const gaps = have ? Object.keys(MUSCLES).map(g => ({ g, avg: priorM.reduce((n, m) => n + (m[g] || 0), 0) / (priorM.length || 1), cur: curM[g] || 0 }))
    .filter(x => x.avg >= 3 && x.cur < x.avg * 0.5).sort((a, b) => (b.avg - b.cur) - (a.avg - a.cur)) : [];

  /* Abgehakte Sätze */
  const ws = data.workouts.filter(w => w.date >= mon && w.date <= addDays(mon, 6));
  const tracked = ws.filter(w => doneCount(w) > 0 || w.finishedAt);
  const tTotal = tracked.reduce((n, w) => n + setCount(w), 0), tDone = tracked.reduce((n, w) => n + doneCount(w), 0);
  const completion = tTotal ? tDone / tTotal : null;

  /* Gesamteindruck */
  const useVol = cur.volume > 0 || avg.volume > 0;
  const [cv, av] = useVol ? [cur.volume, avg.volume] : [cur.reps, avg.reps];
  const pct = av ? Math.round((cv - av) / av * 100) : 0;
  const what = useVol ? 'Volumen' : 'Wiederholungen';
  const sp = `${pct >= 0 ? '+' : '−'}${Math.abs(pct)} %`;
  const n = (c, one, many) => plural(c, one, many);
  let title, text, tone = 'eq';
  if (!cur.workouts) { title = 'Kein Training in dieser Woche'; text = 'Plane für die nächste Woche feste Tage ein, dann bist du schnell wieder drin.'; }
  else if (!have) { title = 'Dein erster Wochenabschluss'; text = 'Noch fehlt der Vergleich, ab der nächsten Woche siehst du hier, wie du zu deinem Durchschnitt stehst.'; tone = 'up'; }
  else if (improved.length > declined.length && pct >= 0) { title = 'Starke Woche'; text = `${n(improved.length, 'Übung', 'Übungen')} über deinem Schnitt, ${what} ${sp} gegenüber Ø.`; tone = 'up'; }
  else if (improved.length > declined.length) { title = 'Du wirst stärker'; text = `${n(improved.length, 'Übung', 'Übungen')} über deinem Schnitt, ${what} ${sp} gegenüber Ø.`; tone = 'up'; }
  else if (declined.length > improved.length) { title = 'Etwas unter deinem Schnitt'; text = `${n(declined.length, 'Übung', 'Übungen')} unter deinem Schnitt, ${what} ${sp} gegenüber Ø. Das passiert, dranbleiben lohnt sich.`; tone = 'down'; }
  else if (pct <= -15) { title = 'Ruhigere Woche'; tone = 'down'; text = `${what} ${sp} gegenüber Ø. ${improved.length ? 'Einzelne Übungen liefen gut, ' : ''}insgesamt war es weniger Training als sonst.`; }
  else if (pct >= 15) { title = 'Aktive Woche'; tone = 'up'; text = `${what} ${sp} gegenüber Ø, bei den Übungen hast du dein Niveau gehalten.`; }
  else {
    title = 'Solide Woche';
    text = improved.length ? `${what} ${Math.abs(pct) < 2 ? 'im Schnitt' : sp + ' gegenüber Ø'}, ${improved.length} ${improved.length === 1 ? 'Übung' : 'Übungen'} besser und ${declined.length} schwächer.`
      : `${what} ${Math.abs(pct) < 2 ? 'im Schnitt' : sp + ' gegenüber Ø'}, bei den Übungen hast du dein Niveau gehalten.`;
  }

  /* Worauf nächste Woche achten – jede Regel stützt sich auf Leitlinien oder Metaanalysen (Quelle steht am Tipp) */
  const tips = [];
  const SRC = {
    acsm: 'ACSM-Leitlinie Krafttraining 2026',
    detrain: 'McMaster et al. 2013, Sports Med (Review)',
    volume: 'ACSM 2026; Schoenfeld et al. 2017, J Sports Sci (Metaanalyse)',
    freq: 'ACSM 2026; Pelland et al. 2024 (Metaanalyse, 67 Studien)',
    high: 'Pelland et al. 2024; Baz-Valle et al. 2022, J Hum Kinet',
    progress: 'ACSM Position Stand 2009 (Progression)',
    recover: 'Craven et al. 2022, Sports Med; Morton et al. 2018, Br J Sports Med',
    load: 'Schoenfeld et al. 2017, J Strength Cond Res (Metaanalyse); ACSM 2026',
    rest: 'Singer et al. 2024, Front Sports Act Living (Metaanalyse)'
  };
  const tip = (icon, tone, title, text, src) => tips.push({ icon, tone, title, text, src });
  const list = a => a.slice(0, 3).join(', ');
  /* Große Muskelgruppen, auf die sich die Satz-Empfehlungen beziehen */
  const MAJOR = ['chest', 'lats', 'shoulders', 'quads', 'hamstrings', 'glutes', 'biceps', 'triceps'];
  const REGIONS = [['Beine', ['quads', 'hamstrings', 'glutes']], ['Brust und Schultern', ['chest', 'shoulders']], ['Rücken', ['lats', 'traps']]];
  const mapped = Object.values(curM).some(v => v > 0);           // nur bewerten, wenn Übungen Muskeln zugeordnet sind
  const fmtSets = v => num(Math.round(v * 2) / 2);

  if (!cur.workouts) {
    tip('calendar', 'warn', 'Kurze Pause, kein Rückschritt',
      'Kraft bleibt nach Studien bis zu etwa drei Wochen ohne Training weitgehend erhalten, danach baut sie schneller ab. Plane für die nächste Woche zwei feste Termine ein.', SRC.detrain);
    tip('dumbbell', 'warn', 'Wieder einsteigen: zweimal Ganzkörper',
      'Für Kraft und Muskeln zählt vor allem, jede große Muskelgruppe mindestens zweimal pro Woche zu trainieren. Der beste Plan ist der, den du durchhältst.', SRC.acsm);
  } else {
    /* 1. Mindestens zweimal pro Woche */
    if (cur.workouts === 1) tip('calendar', 'warn', 'Nur eine Einheit diese Woche',
      'Empfohlen ist, jede große Muskelgruppe mindestens zweimal pro Woche zu trainieren. Plane nächste Woche zwei Termine ein, auch eine kurze Einheit zählt.', SRC.acsm);

    /* 2. Ganze Körperregion ausgelassen */
    const missing = mapped ? REGIONS.filter(([, gs]) => gs.every(g => !curM[g])).map(([l]) => l) : [];
    if (missing.length) tip('alert', 'warn', `Nicht trainiert: ${missing.join(', ')}`,
      'Die Leitlinie empfiehlt, alle großen Muskelgruppen jede Woche zu trainieren. Nimm nächste Woche mindestens eine Übung dafür auf, zum Beispiel als Ganzkörper-Einheit.', SRC.acsm);

    /* 3. Wenig Sätze pro Muskel (Ziel für Muskelaufbau: ~10 pro Woche) */
    const low = mapped ? MAJOR.filter(g => curM[g] > 0 && curM[g] < 10).sort((a, b) => curM[a] - curM[b]) : [];
    if (low.length) tip('dumbbell', 'warn', 'Unter 10 Sätzen pro Muskel',
      `Diese Woche: ${low.slice(0, 3).map(g => `${MUSCLES[g]} ${fmtSets(curM[g])}`).join(' · ')} Sätze. Mehr Sätze bringen bis etwa 10 pro Muskel und Woche deutlich mehr Muskelzuwachs. Ergänze 1 bis 2 Sätze pro Einheit, nicht alles auf einmal.`, SRC.volume);

    /* 4. Muskel nur an einem Tag trainiert */
    const oneDay = mapped && cur.workouts >= 2 ? MAJOR.filter(g => curM[g] >= 6 && curDays[g] && curDays[g].size === 1) : [];
    if (oneDay.length) tip('repeat', 'warn', `Nur an einem Tag: ${list(oneDay.map(g => MUSCLES[g]))}`,
      'Verteile dieselben Sätze auf zwei Tage. Beim Muskelaufbau macht das kaum einen Unterschied, für die Kraft bringt öfter pro Woche messbar mehr, und jeder Satz bleibt frischer.', SRC.freq);

    /* 5. Sehr viele Sätze: abnehmender Nutzen */
    const high = mapped ? MAJOR.filter(g => curM[g] > 20) : [];
    if (high.length) tip('timer', 'warn', `Über 20 Sätze: ${list(high.map(g => MUSCLES[g]))}`,
      'Mehr Volumen bringt ab hier immer weniger zusätzlichen Zuwachs, kostet aber Erholung. 12 bis 20 Sätze pro Muskel und Woche reichen für die meisten. Steigere lieber Gewicht oder Wiederholungen.', SRC.high);

    /* 6. Stagnation: progressive Überlastung mit konkretem nächsten Schritt */
    stagnant.slice(0, 2).forEach(s => {
      const a = cur.ex.get(s.name.toLowerCase());
      if (s.weighted && a) {
        const inc = Math.max(1.25, Math.round(a.maxKg * 0.025 / 1.25) * 1.25);
        tip('up', 'warn', `${s.name}: seit drei Wochen ohne Fortschritt`,
          `Ziel: ${num(a.maxKg)} kg × ${a.repsAtMax + 1}. Schaffst du in allen Sätzen 1 bis 2 Wiederholungen mehr als geplant, erhöhe das Gewicht um 2 bis 10 %, hier etwa ${num(a.maxKg + inc)} kg.`, SRC.progress);
      } else tip('up', 'warn', `${s.name}: seit drei Wochen ohne Fortschritt`,
        `Ziel: ${a ? a.maxReps + 1 : 'eine'} Wiederholung${a ? 'en' : ''} oder eine schwerere Variante. Fortschritt entsteht nur, wenn die Belastung über die Wochen steigt.`, SRC.progress);
    });

    /* 7. Mehrere Übungen gleichzeitig schwächer: Erholung prüfen */
    if (declined.length >= 2 && declined.length > improved.length) tip('down', 'down', `${declined.length} Übungen unter deinem Schnitt`,
      'Wenn mehrere Übungen gleichzeitig nachlassen, liegt es oft an der Erholung. Schon eine Nacht unter 6 Stunden Schlaf senkt die Leistung messbar. Achte auf 7 bis 9 Stunden Schlaf und etwa 1,6 g Eiweiß pro kg Körpergewicht am Tag.', SRC.recover);

    /* 8. Fast nur hohe Wiederholungen: für Kraft schwerer trainieren */
    const wsets = ws.flatMap(w => w.exercises.flatMap(e => workSets(w, e))).filter(s => (+s.weight || 0) > 0);
    if (wsets.length >= 8 && wsets.filter(s => +s.reps >= 15).length / wsets.length >= 0.7) tip('dumbbell', 'warn', 'Fast nur 15+ Wiederholungen',
      'Für Muskelaufbau funktioniert das, wenn du nah an die Ermüdung gehst. Für mehr Maximalkraft sind schwere Gewichte überlegen: Baue pro Übung 2 bis 3 Sätze mit 5 bis 8 Wiederholungen ein.', SRC.load);

    /* 9. Sehr kurze Pausen */
    if (data.settings.autoRest && data.settings.rest <= 60 && cur.sets >= 10) tip('timer', 'warn', 'Pausentimer steht auf 1 Minute',
      'Pausen über 60 Sekunden bringen etwas mehr Muskelzuwachs, weil du in den Folgesätzen mehr schaffst. Stell den Timer auf 1:30, bei schweren Grundübungen gern auf 2 bis 3 Minuten.', SRC.rest);

    /* Erste Woche: Vergleichsbasis schaffen */
    if (!have) tip('repeat', 'warn', 'Wiederhole deine Übungen',
      'Fortschritt lässt sich nur messen, wenn du dieselben Übungen wiederholst. Mach nächste Woche dieselben Übungen und versuche bei einer davon eine Wiederholung mehr.', SRC.progress);

    if (!tips.length) tip('check-circle', 'up', 'Alles im grünen Bereich',
      'Regelmäßigkeit ist der stärkste Faktor. Steigere pro Übung nur eine Sache: erst Wiederholungen, dann bei Erreichen deines Ziels das Gewicht um 2 bis 10 %.', SRC.acsm);
  }

  /* Ziel: mindestens 2 Einheiten (Leitlinie), sonst dein Schnitt */
  const goal = Math.max(2, Math.round(have ? (avg.workouts + cur.workouts) / 2 : cur.workouts || 2));
  return { mon, cur, avg, priorCount: priors.length, have, improved, declined, same, added, stagnant, skipped, gaps, tips: tips.slice(0, 5), goal, title, text, tone };
}

/** Karte am Sonntag (und Mo/Di für die letzte Woche) */
function wrapCard() {

function wrapNotice() {
